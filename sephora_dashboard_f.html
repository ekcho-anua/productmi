<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sephora Key Message Survey Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#ffffff;--card2:#f1f3f6;--line:#e2e5ea;--tx:#1a1d23;--tx2:#6b7280;--acc:#e8336d;--acc2:#3b6fe0;--pos:#0f9d63;--neg:#d94438}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:24px 22px 80px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--tx2);font-size:13px;margin-bottom:20px}
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.05);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0}
.bar .inner{max-width:1320px;margin:0 auto;padding:0 22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:var(--tx2);padding:8px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.seg button.on{background:var(--acc);color:#fff}
.seg.alt button.on{background:var(--acc2)}
.flabel{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx2);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx);font-weight:600}
.n{margin-left:auto;font-size:13px;color:var(--tx2)}
.n b{color:var(--tx);font-size:18px}
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h2{font-size:14.5px;margin:0 0 14px;letter-spacing:-.01em}
.card h3{font-size:12px;color:var(--tx2);margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
section{margin-bottom:28px}
section>h2.sec{font-size:17px;margin:0 0 12px;padding-left:10px;border-left:3px solid var(--acc)}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.two,.three{grid-template-columns:1fr}}
.row{margin-bottom:9px}
.row .t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:4px}
.row .t span:last-child{color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums}
.track{height:8px;background:#e9ecf1;border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--acc)}
.fill.b{background:linear-gradient(90deg,#22b981,#109464)}
.fill.l{background:linear-gradient(90deg,#f4715f,#d94438)}
.fill.n{background:linear-gradient(90deg,#5b8cff,#3557c4)}
.badge{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700}
.badge.pos{background:#e4f6ee;color:var(--pos)}
.badge.neg{background:#fdeaea;color:var(--neg)}
.badge.zero{background:#eef0f3;color:var(--tx2)}
.win{font-size:12px;color:var(--tx2);padding:10px 12px;background:var(--card2);border-radius:9px;line-height:1.6}
.win b{color:var(--tx);font-size:14px}
.win .g{color:var(--pos);font-weight:600}
.win .r{color:var(--neg);font-weight:600}
.mini{font-size:11px;color:var(--tx2);margin-top:2px}
.theme{border-bottom:1px solid var(--line);padding:8px 0;cursor:pointer}
.theme:last-child{border-bottom:0}
.theme .h{display:flex;align-items:center;gap:8px;font-size:13px}
.theme .rank{width:16px;color:var(--tx2);font-size:11px;font-variant-numeric:tabular-nums}
.theme .cnt{margin-left:auto;color:var(--tx2);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.theme .arrow{color:var(--tx2);font-size:9px;transition:.15s}
.theme.open .arrow{transform:rotate(90deg)}
.voc{display:none;margin:8px 0 4px;max-height:260px;overflow:auto;background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:10px}
.theme.open .voc{display:block}
.voc p{margin:0 0 8px;font-size:12px;color:#3f4650;line-height:1.55;padding-left:10px;border-left:2px solid var(--line)}
.voc p:last-child{margin-bottom:0}
.more{display:none}
.more.on{display:block}
.morebtn{margin-top:8px;background:var(--card2);border:1px solid var(--line);color:var(--tx2);border-radius:8px;padding:6px 11px;font-size:11.5px;cursor:pointer;font-family:inherit}
.morebtn:hover{background:#e9ecf1}
.empty{color:var(--tx2);font-size:12.5px;padding:16px 0;text-align:center}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;background:#eef0f4;color:var(--tx2);margin-left:6px;vertical-align:middle;text-transform:none;letter-spacing:0}
.claim{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.claim h2{font-size:14.5px;margin:0 0 12px}
.layout{display:grid;grid-template-columns:194px 1fr;gap:24px;align-items:start}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
.side{position:sticky;top:92px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.side .lb{font-size:10.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;padding:4px 10px 8px}
.nv{display:block;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:9px 11px;margin-bottom:3px;cursor:pointer;font-family:inherit;color:#3f4650}
.nv:hover{background:var(--card2)}
.nv b{display:block;font-size:13px;font-weight:600}
.nv span{font-size:11px;color:#9aa1ab}
.nv.on{background:var(--tx);color:#fff}
.nv.on span{color:#b9bec6}
.side .div{border-top:1px solid var(--line);margin:9px 6px}
.ntab{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ntab th{text-align:right;padding:9px 12px;border-bottom:2px solid var(--line);color:var(--tx2);font-size:11px;font-weight:600;white-space:nowrap;background:#fafbfc}
.ntab th:first-child{text-align:left}
.ntab th s{text-decoration:none;font-weight:400;opacity:.7}
.ntab td{padding:9px 12px;border-bottom:1px solid #eef0f3;font-variant-numeric:tabular-nums}
.ntab tr:last-child td{border-bottom:0}
.ntab td.o{text-align:left}
.ntab td.nm{text-align:right;white-space:nowrap}
.ntab tr.hl{background:#fffaf0}
.pv{color:var(--pos);font-weight:600}
.mv{color:var(--neg);font-weight:600}
.dsig{color:#b45309;font-weight:700}
.dmut{color:#c3c8d0}
.iv{color:var(--tx2)}
.note{margin-top:8px;font-size:11.5px;color:var(--tx2)}
.ex{max-width:980px}
.exb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.exb h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.exb h3 .pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:#eef0f4;color:var(--tx2);text-transform:none}
.exb ul{margin:0;padding-left:0;list-style:none}
.exb li{position:relative;padding-left:14px;margin-bottom:12px;font-size:13.2px;line-height:1.72;color:#3f4650}
.exb li:last-child{margin-bottom:0}
.exb li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:#c3c8d0}
.exb p{margin:0 0 10px;font-size:13.2px;line-height:1.75;color:#3f4650}
.exb p:last-child{margin-bottom:0}
.kc{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.8px;font-weight:600;letter-spacing:.01em;padding:2px 7px;border-radius:6px;border:1px solid;white-space:nowrap;vertical-align:baseline}
.kc.pos{background:#e7f7f0;border-color:#bfe7d6;color:#0b7d50}
.kc.neg{background:#fdecec;border-color:#f6cfcf;color:#c0392f}
.kc.wrapx{white-space:normal}
.exnum{font-variant-numeric:tabular-nums;font-weight:700;color:var(--tx)}
.exnote{margin-top:12px;padding:11px 13px;background:#fafbfc;border:1px dashed var(--line);border-radius:10px;font-size:12.3px;line-height:1.7;color:var(--tx2)}
.exhead{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);margin:22px 0 10px}
</style>
</head>

function filtered(){

  && (state.age.size===0||state.age.has(r.age)));
}
function count(rows,fn){
 const m = new Map();
 rows.forEach(r=>{const v=fn(r); if(v==null)return; (Array.isArray(v)?v:[v]).forEach(x=>m.set(x,(m.get(x)||0)+1));});
 return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function netOf(rows,k,opt){
 const n=rows.length||1;
 const b=rows.filter(r=>r.sku[k].best===opt).length;
 const l=rows.filter(r=>r.sku[k].least===opt).length;
 return {b:b,l:l,net:(b-l)/n*100,inv:(b+l)/n*100};
}
function bars(pairs,total,cls,k,withNet){
 if(!pairs.length) return '<div class="empty">해당 조건의 응답이 없습니다</div>';
 const rows=filtered();
 const mx = Math.max(...pairs.map(p=>p[1]))||1;
 return pairs.map(([key,v])=>{
  let bg='';
  if(withNet){
   const s=netOf(rows,k,key);
   const c=s.net>0?'pos':(s.net<0?'neg':'zero');
   bg='<span class="badge '+c+'">Net '+(s.net>0?'+':'')+s.net.toFixed(1)+'</span>';
  }
  return '<div class="row"><div class="t"><span>'+esc(key)+'</span><span>'+v+'건 · '+(total?(v/total*100).toFixed(1):0)+'%'+bg+'</span></div><div class="track"><div class="fill '+cls+'" style="width:'+(v/mx*100)+'%"></div></div></div>';
 }).join('');
}

   b.onclick=()=>{state.sku=v;window.scrollTo(0,0);render();}; nav.appendChild(b);};
  mkNav('exec','Executive Summary','총평 · SKU별 권장안');
  mkNav('summary','전체 요약','5개 SKU 한눈에');
  M.order.forEach(k=>{const nm=M.skus[k].name, i=nm.indexOf(' ', k==='GS'?8:0); mkNav(k, i>0?nm.slice(0,i):nm, i>0?nm.slice(i+1):'');});
  document.getElementById('navMeta').innerHTML='전체 '+ROWS.length+'명<br>세포라 '+SEPROWS.length+'명';

  if(state.sku==='exec'){
   document.getElementById('skuBody').innerHTML = EXEC;
   return;
  }

  if(state.sku==='summary'){
   document.getElementById('skuBody').innerHTML =
    '<section><h2 class="sec">요약</h2><div class="grid three">'+M.order.map(k=>{
     const b=count(rows,r=>r.sku[k].best), l=count(rows,r=>r.sku[k].least);
     const bt=b[0], lt=l[0];
     return '<div class="card"><h2>'+esc(M.skus[k].name)+'</h2>'
      +'<div class="win" style="margin-bottom:10px"><span class="g">▲ 최선호</span> <b>'+(bt?esc(bt[0]):'-')+'</b><div class="mini">'+(bt?bt[1]+'명 · '+(bt[1]/n*100).toFixed(1)+'% · Net '+(netOf(rows,k,bt[0]).net>0?'+':'')+netOf(rows,k,bt[0]).net.toFixed(1):'')+'</div></div>'
      +'<div class="win"><span class="r">▼ 최비선호</span> <b>'+(lt?esc(lt[0]):'-')+'</b><div class="mini">'+(lt?lt[1]+'명 · '+(lt[1]/n*100).toFixed(1)+'% · Net '+(netOf(rows,k,lt[0]).net>0?'+':'')+netOf(rows,k,lt[0]).net.toFixed(1):'')+'</div></div></div>';
    }).join('')+'</div></section>'
    +'<div class="note">왼쪽 메뉴에서 SKU를 선택하면 선지별 Net · 채널 비교 · 선호/비선호 이유와 VOC 원문을 볼 수 있습니다.</div>';
   return;
  }

  const k=state.sku;
  const best=count(rows,r=>r.sku[k].best), least=count(rows,r=>r.sku[k].least);
  const claims=[...new Set(M.skus[k].bestOptions.concat(M.skus[k].leastOptions,best.map(x=>x[0]),least.map(x=>x[0])))];
  const bestMap=new Map(best);
  claims.sort((a,b)=>(bestMap.get(b)||0)-(bestMap.get(a)||0));

  // ----- Net comparison table (always full base) -----
  const netRows=claims.map(cl=>({cl:cl,a:netOf(ROWS,k,cl),s:netOf(SEPROWS,k,cl)}))
   .sort((x,y)=>y.a.net-x.a.net)
   .map(o=>{
    const d=o.s.net-o.a.net, sig=Math.abs(d)>=TH;
    return '<tr class="'+(sig?'hl':'')+'"><td class="o">'+esc(o.cl)+'</td>'
     +'<td class="nm '+(o.a.net>0?'pv':'mv')+'">'+(o.a.net>0?'+':'')+o.a.net.toFixed(1)+'</td>'
     +'<td class="nm '+(o.s.net>0?'pv':'mv')+'">'+(o.s.net>0?'+':'')+o.s.net.toFixed(1)+'</td>'
     +'<td class="nm '+(sig?'dsig':'dmut')+'">'+(d>0?'+':'')+d.toFixed(1)+(sig?' ◀':'')+'</td></tr>';
   }).join('');

  // ----- theme list with top5 + fold -----
  const themeList=(subset,pol)=>{
   const base=subset.length;
   if(!base) return '<div class="empty">이 문구를 고른 응답자가 없습니다</div>';
   const items=count(subset,r=>r.sku[k][pol+'Theme']);
   const mkRow=([t,c],i)=>{
    const voc=subset.filter(r=>r.sku[k][pol+'Theme']===t).map(r=>r.sku[k][pol+'Voc']);
    return '<div class="theme" onclick="this.classList.toggle(\'open\')"><div class="h"><span class="rank">'+(i+1)+'</span><span class="arrow">▶</span><span>'+esc(t)+'</span><span class="cnt">'+c+'건 · '+(c/base*100).toFixed(1)+'%</span></div><div class="voc">'+voc.map(v=>'<p>'+esc(v)+'</p>').join('')+'</div></div>';
   };
   const top=items.slice(0,5).map(mkRow).join('');
   const rest=items.slice(5);
   if(!rest.length) return top;
   const restCnt=rest.reduce((s,x)=>s+x[1],0);
   const id='mo'+(++uid);
   const lb='그 외 '+rest.length+'개 주제 ('+restCnt+'건) 보기';
   return top+'<div class="more" id="'+id+'">'+rest.map((x,i)=>mkRow(x,i+5)).join('')+'</div>'
    +'<button class="morebtn" data-lb="'+lb+'" onclick="toggleMore(\''+id+'\',this)">'+lb+'</button>';
  };

  const claimBlocks = claims.map(cl=>{
   const bs=rows.filter(r=>r.sku[k].best===cl), ls=rows.filter(r=>r.sku[k].least===cl);
   const s=netOf(rows,k,cl);
   const nc=s.net>0?'pos':(s.net<0?'neg':'zero');
   return '<div class="claim"><h2>'+esc(cl)+'<span class="badge '+nc+'">Net '+(s.net>0?'+':'')+s.net.toFixed(1)+'</span></h2>'
    +'<div class="grid two" style="gap:12px;margin-bottom:14px">'
    +'<div class="win"><span class="g">▲ 가장 선호</span> <b>'+bs.length+'명</b> · '+(n?(bs.length/n*100).toFixed(1):0)+'%</div>'
    +'<div class="win"><span class="r">▼ 가장 비선호</span> <b>'+ls.length+'명</b> · '+(n?(ls.length/n*100).toFixed(1):0)+'%</div></div>'
    +'<div class="grid two">'
    +'<div><h3>선호 이유 주제 (n='+bs.length+')<span class="tag">클릭 시 영문 원문</span></h3>'+themeList(bs,'best')+'</div>'
    +'<div><h3>비선호 이유 주제 (n='+ls.length+')<span class="tag">클릭 시 영문 원문</span></h3>'+themeList(ls,'least')+'</div>'
    +'</div></div>';
  }).join('');

  document.getElementById('skuBody').innerHTML =
   '<h1 style="font-size:19px;margin:0 0 14px">'+esc(M.skus[k].name)+'</h1>'
   +'<section><h2 class="sec">① 메시지 선호도 + Net</h2>'
   +'<div class="grid two">'
   +'<div class="card"><h3>가장 선호하는 메시지</h3>'+bars(best,n,'b',k,true)+'</div>'
   +'<div class="card"><h3>가장 선호하지 않는 메시지</h3>'+bars(least,n,'l',k,false)+'</div></div></section>'
   +'<section><h2 class="sec">② 전체 vs 세포라 최다 사용 Net 비교</h2>'
   +'<table class="ntab"><thead><tr><th>메시지</th><th>전체<br><s>n='+ROWS.length+'</s></th><th>세포라<br><s>n='+SEPROWS.length+'</s></th><th>차이</th></tr></thead><tbody>'+netRows+'</tbody></table>'
   +'<div class="note">이 표만 상단 필터와 무관하게 항상 전체 기준으로 계산됩니다 (지역·나이 필터 적용 시 n이 20~30명대로 떨어져 Net 해석이 불가능해지기 때문). 차이 '+TH+'p 미만은 회색 = 표본오차 범위로 해석하지 않음 / '+TH+'p 이상 ◀만 채널 차이로 해석.</div></section>'
   +'<section><h2 class="sec">③ 선지별 선호 · 비선호 이유와 VOC</h2>'+claimBlocks+'</section>';
 } else {
  document.getElementById('demo').innerHTML =
   '<div class="card"><h3>사용하는 채널 (복수응답)</h3>'+bars(count(rows,r=>r.channels),n,'n')+'</div>'
   +'<div class="card"><h3>가장 자주 사용하는 채널</h3>'+bars(count(rows,r=>r.mainCh),n,'n')+'</div>'
   +'<div class="card"><h3>인종</h3>'+bars(count(rows,r=>r.race),n,'n')+'</div>';
  document.getElementById('demo2').innerHTML =
   '<div class="card"><h3>지역</h3>'+bars(count(rows,r=>r.region),n,'n')+'</div>'
   +'<div class="card"><h3>연령</h3>'+bars(count(rows,r=>r.age).sort((a,b)=>a[0]<b[0]?-1:1),n,'n')+'</div>';
 }
}
render();
</script>
</body>
</html>
