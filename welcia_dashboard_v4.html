<head>

<style>
:root{
 --bg:#f7f9fc; --panel:#ffffff; --ink:#1f2733; --sub:#6b7684; --line:#e6ebf2;
 --accent:#3b6cf6; --accent2:#f6a623; --pos:#2fb37f; --neg:#e5644e;
 --shadow:0 1px 3px rgba(20,40,80,.06),0 6px 24px rgba(20,40,80,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Segoe UI",-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:var(--shadow)}
.brand{font-weight:800;font-size:16px;letter-spacing:-.2px}
.brand small{display:block;font-weight:500;color:var(--sub);font-size:11px;margin-top:2px}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl .lbl{font-size:12px;color:var(--sub);font-weight:600}
.segbtns,.xtabbtns{display:flex;gap:4px;background:#eef2f8;padding:4px;border-radius:10px}
.segbtns button,.xtabbtns button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--sub);transition:.15s}
.segbtns button.on{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(59,108,246,.35)}
.xtabbtns button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.nbadge{margin-left:auto;background:#eef4ff;color:var(--accent);font-weight:700;padding:6px 12px;border-radius:20px;font-size:12px;white-space:nowrap}
.stickyhead{position:sticky;top:0;z-index:50}
.layout{display:flex;min-height:calc(100vh - 62px)}
.side{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:var(--headh,106px);height:calc(100vh - var(--headh,106px));overflow:auto}
.side a{display:block;padding:10px 12px;border-radius:9px;color:var(--sub);text-decoration:none;font-weight:600;font-size:13px;margin-bottom:2px;cursor:pointer}
.side a:hover{background:#f1f5fb;color:var(--ink)}
.side a.on{background:#eef4ff;color:var(--accent)}
.side a .num{display:inline-block;width:20px;color:#aab4c2;font-weight:700}
.main{flex:1;padding:22px 26px;max-width:1100px}
.sec-title{font-size:20px;font-weight:800;margin:0 0 4px}
.sec-desc{color:var(--sub);margin:0 0 18px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 2px;font-size:15px;font-weight:700}
.card .qsub{color:var(--sub);font-size:12px;margin:0 0 12px}
.insight{background:#f3f8ff;border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#2a3a52;margin-top:12px}
.insight b{color:var(--accent)}
.facet-wrap{display:flex;gap:18px;flex-wrap:wrap}
.facet{flex:1;min-width:280px}
.facet-h{font-weight:700;font-size:12.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.facet-h .dot{width:9px;height:9px;border-radius:50%}
.facet-h .fn{color:var(--sub);font-weight:600}
/* bars */
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar-lab{width:132px;flex:none;font-size:12px;text-align:right;color:#404b5c;line-height:1.25}
.bar-track{flex:1;background:#eef2f7;border-radius:6px;height:22px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;color:#fff;font-size:11px;font-weight:700;min-width:2px;transition:width .3s}
.bar-fill.out{color:#404b5c;justify-content:flex-start;padding-left:6px;padding-right:0}
.pie-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.legend{font-size:12px}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .lp{margin-left:auto;font-weight:700;color:#404b5c;padding-left:14px}
.stack{display:flex;height:30px;border-radius:7px;overflow:hidden;margin:6px 0}
.stack .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;min-width:0}
.matrix-lab{font-size:12px;font-weight:600;margin:12px 0 2px;color:#404b5c}
.note{font-size:12px;color:var(--sub);background:#fafbfd;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.comment-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.comment-list div{padding:7px 11px;border-bottom:1px solid #f0f3f8;font-size:12px;color:#3a4657}
.comment-list div:last-child{border:0}
/* voc */
.voc-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.voc-controls select,.voc-controls button{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.voc-controls button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#fbfcfe,#f4f7fc);border-radius:12px;min-height:150px}
.cloud span{font-weight:800;line-height:1;cursor:default;transition:.15s}
.cloud span:hover{opacity:.65}
.krank .bar-lab{width:150px}
.kw-hover{position:fixed;z-index:100;max-width:340px;background:#1f2733;color:#fff;border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);pointer-events:none;display:none;line-height:1.45}
.kw-hover b{color:#9ec1ff}
.kw-hover .v{border-top:1px solid rgba(255,255,255,.15);margin-top:6px;padding-top:6px;max-height:200px;overflow:hidden}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:#e7f6ef;color:var(--pos);margin-left:6px}
.foot{color:#aab4c2;font-size:11px;padding:18px 4px;text-align:center}

.ins-hero{background:linear-gradient(120deg,#eaf1ff,#f4f8ff);border:1px solid #dce7fb;border-radius:16px;padding:22px 24px;margin-bottom:16px}
.ins-seg{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.ins-tag{font-size:22px;font-weight:800;margin:4px 0 8px;color:#1f2733}
.ins-p{margin:0;color:#33415a;font-size:13.5px;line-height:1.65;max-width:880px}
.ins-xnote{background:#fff7ec;border:1px solid #f4dcb0;color:#8a5a1a;border-radius:10px;padding:10px 13px;font-size:12px;margin-bottom:6px}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px}
.ins-block{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px;box-shadow:var(--shadow)}
.ins-bt{font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;margin-bottom:7px}
.ins-bn{width:23px;height:23px;flex:none;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ins-bp{margin:0;color:#3a4657;font-size:12.8px;line-height:1.62}
.ins-synwrap{display:flex;gap:16px;flex-wrap:wrap}
.ins-syn{flex:1;min-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px;box-shadow:var(--shadow)}
.ins-syn h3{margin:0 0 10px;font-size:15px;font-weight:800}
.ins-syn ul{margin:0;padding-left:18px}
.ins-syn li{margin:0 0 9px;font-size:12.8px;line-height:1.6;color:#3a4657}
.ins-dist{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #f0f3f8;font-size:12.8px;line-height:1.6;color:#3a4657}
.ins-dist:first-of-type{border-top:0}
.ins-dist.cur{background:#f3f8ff;border-radius:9px;padding:11px 12px;margin:2px -6px}
.ins-dchip{flex:none;font-size:11px;font-weight:800;color:#fff;background:var(--accent2);border-radius:20px;padding:3px 10px;margin-top:1px}

.filterbar{background:#fbfcfe;border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:12.5px}
.fb-title{font-weight:800;color:var(--ink)}
.fb-group{display:flex;align-items:center;gap:7px}
.fb-lbl{color:var(--sub);font-weight:700}
.fb-group label{display:flex;align-items:center;gap:3px;cursor:pointer;color:#404b5c}
.fb-mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--sub)}
.triseg{display:flex;gap:3px;background:#eef2f8;padding:3px;border-radius:8px}

.triseg button.on{background:var(--accent);color:#fff}
.fb-reset{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--sub)}

.es-box{background:#f5fafb;border:1px solid #dcecef;border-radius:11px;padding:13px 15px;margin-bottom:14px}
.es-title{font-weight:700;font-size:13px;margin-bottom:9px}
.es-n{color:var(--sub);font-weight:600;font-size:11.5px}
.es-row{display:flex;align-items:center;gap:9px;margin:6px 0}
.es-lab{width:118px;flex:none;font-size:12.5px;font-weight:600;color:#33415a}
.es-track{flex:1;background:#e7eef0;border-radius:6px;height:24px;position:relative;overflow:hidden}
.es-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11.5px;font-weight:700;min-width:2px}
.es-out{position:absolute;top:0;height:100%;display:flex;align-items:center;font-size:11.5px;font-weight:700;color:#33415a;white-space:nowrap}
.es-note{font-size:11px;color:var(--sub);margin-top:9px;line-height:1.5}
</style>
</head>

function baseResp(){return DATA.resp.filter(r=>segOK(r.kb)&&passFilters(r.a['Q2'],r.anua,r.welcia));}

// ---- aggregation ----
function tallySingle(rs,code){const c={};let n=0;rs.forEach(r=>{const v=r.a[code];if(v){c[v]=(c[v]||0)+1;n++;}});return {c,n};}
function tallyMulti(rs,code){const c={};let n=0;rs.forEach(r=>{const arr=r.a[code]||[];if(arr.length)n++;arr.forEach(v=>{c[v]=(c[v]||0)+1;});});return {c,n};}

function orderedOptions(agg){return Object.keys(agg.c).sort((a,b)=>agg.c[b]-agg.c[a]);}

// ---- renderers ----
function barChart(order,agg,colorMap){
 const n=agg.n||1;let h='';
 order.forEach(opt=>{const cnt=agg.c[opt]||0;const pct=Math.round(cnt/n*100);
  const col=colorMap[opt];const out=pct<12;
  h+=`<div class="bar-row"><div class="bar-lab">${ko(opt)}</div><div class="bar-track"><div class="bar-fill ${out?'out':''}" style="width:${Math.max(pct,out?0:2)}%;background:${out?'transparent':col}">${out?'':pct+'%'}</div>${out?`<span style="position:absolute;left:${pct}%;top:0;height:100%;display:flex;align-items:center;padding-left:6px;font-size:11px;font-weight:700;color:#404b5c;white-space:nowrap"><span style="width:${pct}%;position:absolute;left:0;height:100%;background:${col};border-radius:6px"></span><span style="position:relative">${pct}%</span></span>`:''}</div></div>`;
 });
 return h;
}
function barChartSimple(order,agg,colorMap){
 const n=agg.n||1;let h='';
 order.forEach(opt=>{const cnt=agg.c[opt]||0;const pct=Math.round(cnt/n*100);
  const col=colorMap[opt];const inside=pct>=12;
  h+=`<div class="bar-row"><div class="bar-lab">${ko(opt)}</div><div class="bar-track">`+
     `<div class="bar-fill ${inside?'':'out'}" style="width:${pct}%;background:${col}">${inside?pct+'%':''}</div>`+
     (inside?'':`<span style="position:absolute;left:calc(${pct}% + 6px);top:0;height:100%;display:flex;align-items:center;font-size:11px;font-weight:700;color:#404b5c">${pct}%</span>`)+
     `</div></div>`;
 });
 return h;
}
function pieChart(order,agg,colorMap){
 const n=agg.n||1;let cum=0;const R=62,C=70;let segs='';
 order.forEach(opt=>{const cnt=agg.c[opt]||0;const frac=cnt/n;if(frac<=0)return;
  const a0=cum*2*Math.PI-Math.PI/2, a1=(cum+frac)*2*Math.PI-Math.PI/2;cum+=frac;
  const large=frac>0.5?1:0;
  const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);
  segs+=`<path d="M${C},${C} L${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} Z" fill="${colorMap[opt]}" stroke="#fff" stroke-width="2"/>`;});
 let leg='';order.forEach(opt=>{const cnt=agg.c[opt]||0;const pct=Math.round(cnt/n*100);
  leg+=`<div><span class="sw" style="background:${colorMap[opt]}"></span>${ko(opt)}<span class="lp">${pct}%</span></div>`;});
 return `<div class="pie-wrap"><svg width="140" height="140" viewBox="0 0 140 140">${segs}</svg><div class="legend">${leg}</div></div>`;
}
function matrix100(rs,subs,levels,colorMap){
 let h='';
 subs.forEach(sc=>{const {c,n}=tallySingle(rs,sc.code);
  h+=`<div class="matrix-lab">${sc.label} <span style="color:var(--sub);font-weight:500">(n=${n})</span></div><div class="stack">`;
  levels.forEach(lv=>{const cnt=c[lv]||0;const pct=n?Math.round(cnt/n*100):0;
   if(pct>0)h+=`<div class="seg" style="width:${pct}%;background:${colorMap[lv]}" title="${ko(lv)} ${pct}%">${pct>=9?pct+'%':''}</div>`;});
  h+='</div>';});
 let leg='<div class="legend" style="display:flex;gap:16px;margin-top:8px">';
 levels.forEach(lv=>leg+=`<div><span class="sw" style="background:${colorMap[lv]}"></span>${ko(lv)}</div>`);
 leg+='</div>';
 return h+leg;
}

function colorMapFor(order){const m={};order.forEach((o,i)=>m[o]=PALSAFE[i%PALSAFE.length]);return m;}

function facetGroups(rs){return [{name:null,rs}];}

function renderQuestion(q,rs){
 // determine global order+colors from combined set
 let combined = rs;
 let agg = q.multi?tallyMulti(combined,q.code):(q.type==='matrix'?null:tallySingle(combined,q.code));
 let order,cmap;
 if(q.type==='matrix'){
   order=q.levels;cmap=colorMapFor(q.levels);
 } else if(q.fixedOrder){
   order=q.fixedOrder.filter(o=>agg.c[o]!==undefined);Object.keys(agg.c).forEach(o=>{if(!order.includes(o))order.push(o)});cmap=colorMapFor(order);
 } else { order=orderedOptions(agg);cmap=colorMapFor(order);}
 const groups=facetGroups(rs);
 let body='<div class="facet-wrap">';
 groups.forEach(g=>{
   let inner='';
   if(q.type==='matrix'){inner=matrix100(g.rs,q.subs,q.levels,cmap);}
   else{
     const ag=q.multi?tallyMulti(g.rs,q.code):tallySingle(g.rs,q.code);
     if(q.type==='pie')inner=pieChart(order,ag,cmap);
     else inner=barChartSimple(order,ag,cmap);
     inner=`<div style="font-size:11px;color:var(--sub);margin-bottom:6px">응답자 n=${ag.n}${caution(ag.n)}</div>`+inner;
   }
   const hh=g.name?`<div class="facet-h"><span class="dot" style="background:${g.col}"></span>${g.name} <span class="fn">(세그먼트 n=${g.rs.length})</span></div>`:'';
   body+=`<div class="facet">${hh}${inner}</div>`;
 });
 body+='</div>';
 return body;
}

function effectSummaryHTML(rs){
 const WATER=['保湿・うるおいの持続','即時的な水分補給'];
 const FIRM=['シワの改善','ハリ・弾力の改善（たるみ対策）'];
 let n=0,w=0,f=0;
 rs.forEach(r=>{const a=r.a['Q18']||[];if(a.length)n++;if(a.some(x=>WATER.includes(x)))w++;if(a.some(x=>FIRM.includes(x)))f++;});
 const pw=n?Math.round(w/n*100):0,pf=n?Math.round(f/n*100):0;
 const row=(emoji,label,cnt,pct,col)=>`<div class="es-row"><div class="es-lab">${emoji} ${label}</div><div class="es-track"><div class="es-fill" style="width:${pct}%;background:${col}">${pct>=12?cnt+'명 ('+pct+'%)':''}</div>${pct<12?`<span class="es-out" style="left:calc(${pct}% + 6px)">${cnt}명 (${pct}%)</span>`:''}</div></div>`;
 return `<div class="es-box"><div class="es-title">수분 · 탄력 효과 기대층 요약 <span class="es-n">(Q18 응답 n=${n}${caution(n)})</span></div>`+
  row('💧','수분 효과 기대',w,pw,'#12b5c9')+
  row('✨','탄력 효과 기대',f,pf,'#8b5cf6')+
  `<div class="es-note">수분 = \'보습·수분 지속\' 또는 \'즉각 수분 공급\' · 탄력 = \'주름 개선\' 또는 \'탄력 개선(처짐 대응)\' 선택자 · 두 집단은 중복 가능</div></div>`;
}
function card(q,rs){
 let ins = q.insight?`<div class="insight">${q.insight(rs)}</div>`:'';
 let extra = q.effectSummary?effectSummaryHTML(rs):'';
 return `<div class="card"><h3>${q.title}</h3><div class="qsub">${q.sub||''}</div>${extra}${renderQuestion(q,rs)}${ins}</div>`;
}
function freetextCard(q,rs){
 const arr=[];rs.forEach(r=>{const v=r.a[q.code];if(v&&v.length>3&&!['なし','特になし','ない','なんとなく','わからない'].includes(v))arr.push(v);});
 let list=arr.slice(0,60).map(v=>`<div>${v}</div>`).join('');
 return `<div class="card"><h3>${q.title}</h3><div class="qsub">${q.sub||''} · 원문(일본어) 대표 응답 ${arr.length}건</div><div class="comment-list">${list||'<div>응답 없음</div>'}</div></div>`;
}

function rankIns(rs,r1,r2){
 const c={};let n1=0;
 rs.forEach(r=>{const a=r.a[r1],b=r.a[r2];if(a){c[a]=(c[a]||0)+1;n1++;}if(b)c[b]=(c[b]||0)+1;});
 const ord=Object.keys(c).sort((x,y)=>c[y]-c[x]);
 return `1·2순위 합산 최다 선호 조합: <b>${ko(ord[0])}</b>. 컨셉 응답자 n=${n1}.`;
}
function lighten(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r+(255-r)*f);g=Math.round(g+(255-g)*f);b=Math.round(b+(255-b)*f);return `rgb(${r},${g},${b})`;}
function rank12Card(q,rs){
 const groups=facetGroups(rs);
 const cAll={};rs.forEach(r=>{const a=r.a[q.r1],b=r.a[q.r2];if(a)cAll[a]=(cAll[a]||0)+1;if(b)cAll[b]=(cAll[b]||0)+1;});
 const order=Object.keys(cAll).sort((x,y)=>cAll[y]-cAll[x]);const cmap=colorMapFor(order);
 // shared scale = max total across options within full segment (for comparable facets)
 let maxTot=1;order.forEach(o=>{if((cAll[o]||0)>maxTot)maxTot=cAll[o];});
 let body='<div class="facet-wrap">';
 groups.forEach(g=>{
  const c1={},c2={};let n1=0;
  g.rs.forEach(r=>{const a=r.a[q.r1],b=r.a[q.r2];if(a){c1[a]=(c1[a]||0)+1;n1++;}if(b)c2[b]=(c2[b]||0)+1;});
  let inner=`<div style="font-size:11px;color:var(--sub);margin-bottom:6px">컨셉 응답자 n=${n1}${caution(n1)}</div>`;
  order.forEach(opt=>{const v1=c1[opt]||0,v2=c2[opt]||0,tot=v1+v2;
   const w1=v1/maxTot*100,w2=v2/maxTot*100;const col=cmap[opt];const light=lighten(col,0.55);
   inner+=`<div class="bar-row"><div class="bar-lab">${ko(opt)}</div>`+
     `<div class="bar-track"><div style="display:flex;height:100%;width:${Math.min(w1+w2,100)}%;border-radius:6px;overflow:hidden">`+
       `<div title="1순위 ${v1}명" style="flex:${v1};background:${col};display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;min-width:0">${w1>=6?v1:''}</div>`+
       `<div title="2순위 ${v2}명" style="flex:${v2};background:${light};display:flex;align-items:center;justify-content:center;color:#3a4657;font-size:10.5px;font-weight:700;min-width:0">${w2>=6?v2:''}</div>`+
     `</div></div>`+
     `<div style="width:96px;flex:none;font-size:11px;color:#404b5c;padding-left:8px">1순위 <b>${v1}</b>·2순위 <b>${v2}</b><br><span style="color:var(--sub)">합 ${tot}명</span></div>`+
   `</div>`;});
  const hh=g.name?`<div class="facet-h"><span class="dot" style="background:${g.col}"></span>${g.name} <span class="fn">(세그먼트 n=${g.rs.length})</span></div>`:'';
  body+=`<div class="facet">${hh}${inner}</div>`;});
 body+='</div>';
 let ins=q.insight?`<div class="insight">${q.insight(rs)}</div>`:'';
 const lg=`<div style="display:flex;gap:16px;font-size:11.5px;color:#404b5c;margin:2px 0 10px"><span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#3b6cf6;vertical-align:middle;margin-right:5px"></span>1순위</span><span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${lighten('#3b6cf6',0.55)};vertical-align:middle;margin-right:5px"></span>2순위</span></div>`;
 return `<div class="card"><h3>${q.title}</h3><div class="qsub">${q.sub||''} · 한 막대 안에 1순위(진한색)+2순위(연한색) 누적, 숫자=선택 수</div>${lg}${body}${ins}</div>`;
}

 let blocks=`<div class="ins-grid">`+B.map(b=>`<div class="ins-block"><div class="ins-bt"><span class="ins-bn">${b.n}</span>${b.t}</div><p class="ins-bp">${b.p}</p></div>`).join('')+`</div>`;
 let common=`<div class="ins-syn"><h3>모든 세그먼트 공통</h3><ul>`+INSIGHTS.common.map(c=>`<li>${c}</li>`).join('')+`</ul></div>`;

<script>
// ---------- VOC ----------
function segMatchKb(kb){if(state.seg==='ALL')return true;if(state.seg==='KB10')return kb>=30;if(state.seg==='MASS')return kb>=10&&kb<=25;return true;}
let vocSel={type:'통합',prod:'수분'}; // prod holds '수분'/'탄력' for integrated, or jp name for product

function vocAgg(pred){
 const cat={},cloud={};let ntot=0;
 VOC.records.forEach(r=>{if(!recMatch(r))return;if(!pred(r))return;ntot++;
  r.cats.forEach((k,i)=>{if(!cat[k])cat[k]={count:0,vocs:[]};cat[k].count++;cat[k].vocs.push(r.voc);});
  r.terms.forEach(t=>{cloud[t]=(cloud[t]||0)+1;});});
 return {cat,cloud,ntot};
}
function renderVoc(){
 // build product options
 const prods=VOC.products;
 let opts=`<option value="I|수분">◆ 수분 제품 통합</option><option value="I|탄력">◆ 탄력 제품 통합</option>`;
 opts+=prods.filter(p=>p.type==='수분').map(p=>`<option value="P|${p.jp}">[수분] ${p.ko}</option>`).join('');
 opts+=prods.filter(p=>p.type==='탄력').map(p=>`<option value="P|${p.jp}">[탄력] ${p.ko}</option>`).join('');
 const cur=vocSel.mode==='P'?('P|'+vocSel.prod):('I|'+vocSel.itype);
 let pred,titleko,typ;
 if(vocSel.mode==='P'){const p=prods.find(x=>x.jp===vocSel.prod);pred=r=>r.prod===vocSel.prod;titleko=p?`[${p.type}] ${p.ko}`:vocSel.prod;typ=p?p.type:'';}
 else{pred=r=>r.type===vocSel.itype;titleko=`${vocSel.itype} 제품 통합`;typ=vocSel.itype;}
 const {cat,cloud,ntot}=vocAgg(pred);
 // cloud
 const terms=Object.keys(cloud).sort((a,b)=>cloud[b]-cloud[a]);
 const maxW=terms.length?cloud[terms[0]]:1;
 const cloudColors=['#3b6cf6','#2fb37f','#f6a623','#8b5cf6','#12b5c9','#e5644e','#ec6f9b'];
 const centerOrder=[];terms.forEach((t,i)=>{if(i%2===0)centerOrder.push(t);else centerOrder.unshift(t);});
 let cloudHtml=centerOrder.map(t=>{const rank=terms.indexOf(t);const sz=15+Math.round((cloud[t]/maxW)*34);const op=(0.55+0.45*(cloud[t]/maxW)).toFixed(2);return `<span data-vterm="${t}" style="font-size:${sz}px;opacity:${op};color:${cloudColors[rank%cloudColors.length]}">${t}</span>`;}).join('');
 // ranking
 const cord=Object.keys(cat).sort((a,b)=>cat[b].count-cat[a].count);
 const maxC=cord.length?cat[cord[0]].count:1;
 let rankHtml=cord.map((k,i)=>{const m=VOC.cat_meta[k];const cnt=cat[k].count;const w=Math.round(cnt/maxC*100);
   return `<div class="bar-row" data-vcat="${k}"><div class="bar-lab">${i+1}. ${m.ko}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${PALSAFE[i%PALSAFE.length]}">${cnt}건</div></div></div>`;}).join('');
 return `<div class="card">
   <h3>구매 이유 VOC — 워드클라우드 & 키워드 랭킹</h3>
   <div class="qsub">랜덤 지정 제품에 대한 "왜 구매했나" 주관식 응답 분석. 워드클라우드=일본어 원문 키워드, 랭킹=한국어 카테고리. 무의미·비구매 사유는 제외. 키워드/막대에 마우스를 올리면 원문 VOC를 볼 수 있습니다.</div>
   <div class="voc-controls">
     <select id="vocSelect">${opts.replace(`value="${cur}"`,`value="${cur}" selected`)}</select>
     <span style="align-self:center;color:var(--sub);font-size:12px">유효 응답 n=${ntot}${caution(ntot)} · ${titleko}</span>
   </div>
   <div class="cloud" id="vcloud">${cloudHtml||'<span style="font-size:13px;color:#9aa7b8">해당 세그먼트에 유효 응답이 없습니다</span>'}</div>
   <div style="font-weight:700;font-size:13px;margin:16px 0 8px">키워드 랭킹 (언급 수)</div>
   <div class="krank" id="vrank">${rankHtml}</div>
 </div>`;
}
function bindVoc(){
 const sel=document.getElementById('vocSelect');
 if(sel)sel.onchange=e=>{const[m,v]=e.target.value.split('|');if(m==='P'){vocSel={mode:'P',prod:v};}else{vocSel={mode:'I',itype:v};}renderSection(state.sec);};
 // hover
 const hv=document.getElementById('kwhover');
 function catVocs(k){const{cat}=vocAgg(currentPred());return cat[k]?cat[k].vocs:[];}
 function currentPred(){if(vocSel.mode==='P')return r=>r.prod===vocSel.prod;return r=>r.type===vocSel.itype;}
 document.querySelectorAll('[data-vcat]').forEach(el=>{
  el.addEventListener('mousemove',ev=>{const k=el.getAttribute('data-vcat');const m=VOC.cat_meta[k];const vs=catVocs(k).slice(0,15);
   hv.innerHTML=`<b>${m.ko} (${m.jp})</b> · 원문 VOC ${catVocs(k).length}건<div class="v">${vs.map(v=>'· '+v).join('<br>')}</div>`;
   hv.style.display='block';hv.style.left=Math.min(ev.clientX+14,window.innerWidth-360)+'px';hv.style.top=Math.min(ev.clientY+12,window.innerHeight-260)+'px';});
  el.addEventListener('mouseleave',()=>hv.style.display='none');});
 document.querySelectorAll('[data-vterm]').forEach(el=>{
  el.addEventListener('mousemove',ev=>{const term=el.getAttribute('data-vterm');
   // find category with this jp display
   let key=Object.keys(VOC.cat_meta).find(k=>VOC.cat_meta[k].jp===term);
   const vs=key?catVocs(key).slice(0,15):[];const cnt=key?catVocs(key).length:0;
   hv.innerHTML=`<b>${term}</b> · 원문 VOC ${cnt}건<div class="v">${vs.map(v=>'· '+v).join('<br>')}</div>`;
   hv.style.display='block';hv.style.left=Math.min(ev.clientX+14,window.innerWidth-360)+'px';hv.style.top=Math.min(ev.clientY+12,window.innerHeight-260)+'px';});
  el.addEventListener('mouseleave',()=>hv.style.display='none');});
}

// ---------- app ----------
function renderSidebar(){
 const s=document.getElementById('side');
 s.innerHTML=SECTIONS.map((sec,i)=>`<a data-sec="${i}" class="${i===state.sec?'on':''}"><span class="num">${i+1}</span>${sec.t}</a>`).join('');
 s.querySelectorAll('a').forEach(a=>a.onclick=()=>{state.sec=+a.getAttribute('data-sec');renderSidebar();renderSection(state.sec);window.scrollTo(0,0);});
}
function renderSection(i){
 if(vocSel.mode===undefined)vocSel={mode:'I',itype:'수분'};
 const sec=SECTIONS[i];const rs=baseResp();
 document.getElementById('filterbar').style.display=sec.insight?'none':'flex';setHeadH();
 if(sec.insight){document.getElementById('main').innerHTML=renderInsight();return;}
 let h=`<h2 class="sec-title">${sec.t}</h2><p class="sec-desc">${sec.d}</p>`;
 sec.q.forEach(q=>{
   if(q.type==='voc')h+=renderVoc();
   else if(q.type==='rank12')h+=rank12Card(q,rs);
   else if(q.type==='kwrank')h+=kwRankCard(q);
   else if(q.type==='freetext')h+=freetextCard(q,rs);
   else h+=card(q,rs);
 });
 h+=`<div class="foot">웰시아 7매 마스크 소비자 조사 · n=406(유효) · 세그먼트: KB_res 기준 · 척도 측정 문항 제외</div>`;
 document.getElementById('main').innerHTML=h;
 if(sec.q.some(q=>q.type==='voc'))bindVoc();
 if(sec.q.some(q=>q.type==='kwrank'))bindConcept();
}
function setHeadH(){const h=document.getElementById('stickyhead');if(h)document.documentElement.style.setProperty('--headh',h.offsetHeight+'px');}
function updateBadge(){const segN=DATA.resp.filter(r=>segOK(r.kb)).length;const n=baseResp().length;const names={ALL:'전체',KB10:'KB10(≥30)',KB20:'KB20(≥25)',MASS:'MASS(10~24)'};const f=state.filters;const filt=(f.ages.length<5)||f.anua!=='all'||f.welcia!=='all';document.getElementById('nbadge').textContent=`${names[state.seg]} · n=${n}`+(filt?` · 필터적용(세그 ${segN})`:'');}
function bindTop(){
 document.querySelectorAll('#segbtns button').forEach(b=>b.onclick=()=>{state.seg=b.getAttribute('data-seg');document.querySelectorAll('#segbtns button').forEach(x=>x.classList.toggle('on',x===b));updateBadge();renderSection(state.sec);});

}

function kwRankCard(q){
 const base=CONCEPT.records.filter(r=>r.q===q.code&&recMatch(r));
 let groups=[{name:null,g:'all',rs:base}];
 let body='<div class="facet-wrap">';
 groups.forEach(gr=>{
  const cat={};gr.rs.forEach(r=>r.cats.forEach(k=>cat[k]=(cat[k]||0)+1));
  const ord=Object.keys(cat).sort((a,b)=>cat[b]-cat[a]);const maxC=ord.length?cat[ord[0]]:1;
  const rows=ord.map((k,i)=>`<div class="bar-row" data-ccat="${k}" data-cq="${q.code}" data-cg="${gr.g}"><div class="bar-lab">${i+1}. ${CONCEPT.cat_meta[k]}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(cat[k]/maxC*100)}%;background:${PALSAFE[i%PALSAFE.length]}">${cat[k]}건</div></div></div>`).join('');
  const hh=gr.name?`<div class="facet-h"><span class="dot" style="background:${gr.col}"></span>${gr.name}</div>`:'';
  body+=`<div class="facet">${hh}<div style="font-size:11px;color:var(--sub);margin-bottom:6px">유효 응답 n=${gr.rs.length}${caution(gr.rs.length)}</div><div class="krank">${rows||'<div style=\"font-size:12px;color:#9aa7b8\">유효 응답 없음</div>'}</div></div>`;
 });
 body+='</div>';
 return `<div class="card"><h3>${q.title}</h3><div class="qsub">주관식 응답을 키워드 카테고리로 랭킹화 · 막대에 마우스를 올리면 원문 VOC(일본어)를 볼 수 있습니다 · 무의미 응답 제외</div>${body}</div>`;
}
function bindConcept(){
 const hv=document.getElementById('kwhover');
 document.querySelectorAll('[data-ccat]').forEach(el=>{
  el.addEventListener('mousemove',ev=>{const k=el.dataset.ccat,q=el.dataset.cq,g=el.dataset.cg;
   let recs=CONCEPT.records.filter(r=>r.q===q&&recMatch(r));
   const vs=recs.filter(r=>r.cats.includes(k)).map(r=>r.voc);
   hv.innerHTML=`<b>${CONCEPT.cat_meta[k]}</b> · 원문 VOC ${vs.length}건<div class="v">${vs.slice(0,18).map(v=>'· '+v).join('<br>')}</div>`;
   hv.style.display='block';hv.style.left=Math.min(ev.clientX+14,window.innerWidth-360)+'px';hv.style.top=Math.min(ev.clientY+12,window.innerHeight-260)+'px';});
  el.addEventListener('mouseleave',()=>hv.style.display='none');});
}

function bindFilters(){
 const apply=()=>{updateBadge();renderSection(state.sec);};
 document.querySelectorAll('.agechk').forEach(c=>c.onchange=()=>{state.filters.ages=[...document.querySelectorAll('.agechk:checked')].map(x=>x.value);apply();});
 document.getElementById('ageAll').onclick=()=>{document.querySelectorAll('.agechk').forEach(c=>c.checked=true);state.filters.ages=[...document.querySelectorAll('.agechk')].map(x=>x.value);apply();};
 document.getElementById('ageNone').onclick=()=>{document.querySelectorAll('.agechk').forEach(c=>c.checked=false);state.filters.ages=[];apply();};
 document.querySelectorAll('.triseg').forEach(g=>{const f=g.getAttribute('data-f');g.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.filters[f]=b.getAttribute('data-v');g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));apply();});});
 document.getElementById('filterReset').onclick=()=>{state.filters={ages:['20〜24歳','25〜29歳','30〜34歳','35〜39歳','40〜44歳'],anua:'all',welcia:'all'};document.querySelectorAll('.agechk').forEach(c=>c.checked=true);document.querySelectorAll('.triseg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-v')==='all')));apply();};
}
renderSidebar();bindTop();bindFilters();updateBadge();renderSection(0);setHeadH();window.addEventListener('resize',setHeadH);
</script>
</body>
</html>
