<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>US Acne Survey 대시보드 (n=401)</title>
<style>
:root{--bg:#f6f8fc;--panel:#fff;--ink:#1b2330;--sub:#6b7684;--line:#e6ebf2;
--accent:#3b6cf6;--accent2:#f2994a;--pos:#2fb37f;--neg:#e5644e;--ghost:#cfd8e6;
--shadow:0 1px 3px rgba(20,40,80,.06),0 6px 24px rgba(20,40,80,.05);}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Segoe UI",-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.top{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:60}
.top .r1{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid #f0f3f8}
.brand{font-weight:800;font-size:16px}.brand small{display:block;font-weight:500;color:var(--sub);font-size:11px}
.nbadge{margin-left:auto;background:#eef4ff;color:var(--accent);font-weight:800;padding:7px 14px;border-radius:20px;font-size:12.5px;white-space:nowrap}
.fbar{display:flex;flex-wrap:wrap;gap:14px;padding:10px 20px;align-items:flex-start}
.fgrp{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.flbl{font-size:11.5px;color:var(--sub);font-weight:700;padding-top:5px;white-space:nowrap}
.chips{display:flex;gap:5px;flex-wrap:wrap;max-width:760px}
.chip{border:1px solid var(--line);background:#fff;padding:4px 10px;border-radius:16px;cursor:pointer;font-size:12px;font-weight:600;color:var(--sub);transition:.12s;white-space:nowrap}
.chip:hover{border-color:#b9c6dc}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.preset{display:flex;gap:4px;background:#eef2f8;padding:3px;border-radius:9px}
.preset button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--sub)}
.preset button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.reset{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer}
.layout{display:flex}
.side{width:216px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:var(--th,140px);height:calc(100vh - var(--th,140px));overflow:auto}
.side a{display:block;padding:9px 12px;border-radius:9px;color:var(--sub);text-decoration:none;font-weight:700;font-size:12.5px;margin-bottom:2px;cursor:pointer}
.side a:hover{background:#f1f5fb;color:var(--ink)}.side a.on{background:#eef4ff;color:var(--accent)}
.main{flex:1;padding:22px 26px;max-width:1120px;min-width:0}
.sec-t{font-size:21px;font-weight:800;margin:0 0 4px}.sec-d{color:var(--sub);margin:0 0 16px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800}
.qsub{color:var(--sub);font-size:11.5px;margin:0 0 12px;line-height:1.45}
.qsub .code{background:#f1f5fb;border-radius:4px;padding:1px 6px;font-weight:700;color:#54637a;margin-right:6px}
.badge{display:inline-block;background:#fff5e8;color:#b06d1c;border:1px solid #f6dcbb;border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:700;margin-left:6px}
.badge.g{background:#eef4ff;color:#3b6cf6;border-color:#d4e2ff}
.insight{background:#f3f8ff;border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#2a3a52;margin-top:12px}
.insight b{color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:1fr;gap:3px}
.blab{font-size:12px;display:flex;gap:8px;align-items:baseline}
.blab .tx{flex:1;min-width:0}
.blab .vv{font-weight:800;font-size:12px;white-space:nowrap}
.blab .cnt{color:var(--sub);font-weight:600;font-size:11px}
.btrack{background:#f1f4f9;border-radius:5px;height:16px;position:relative;overflow:hidden}
.bfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#5b84f8,#3b6cf6);border-radius:5px}
.bghost{position:absolute;top:0;bottom:0;left:0;border-right:2px dashed #9fb2cf;pointer-events:none}
.delta{font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:4px}
.delta.p{background:#e8f7f0;color:#1e8f65}.delta.n{background:#fdecea;color:#c0392b}
.dz{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{font-size:11.5px;display:flex;flex-direction:column;gap:4px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.stk{height:22px;border-radius:5px;overflow:hidden;display:flex;background:#f1f4f9}
.stk span{display:block;height:100%}
.mrow{display:grid;grid-template-columns:200px 1fr 66px;gap:10px;align-items:center;margin-bottom:6px;font-size:12px}
.mrow .mn{color:#3d4c60;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mean{font-weight:800;text-align:right;color:var(--accent)}
.bigmean{display:flex;align-items:baseline;gap:8px;background:#f7faff;border:1px solid #e2ecff;border-radius:10px;padding:10px 14px;min-width:150px}
.bigmean .v{font-size:32px;font-weight:800;color:var(--accent);line-height:1}
.bigmean .u{font-size:12px;color:var(--sub);font-weight:700}
.bigmean .d{font-size:10.5px;color:var(--sub);display:block;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.otcbar{display:flex;gap:8px;align-items:center;background:#fffdf7;border:1px solid #f3e4c8;border-radius:11px;padding:9px 12px;margin-bottom:14px;flex-wrap:wrap}
.otcbar .lb{font-size:11.5px;font-weight:800;color:#a4761f}
.otcbar button{border:1px solid #ecd9b6;background:#fff;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:#8a6a2c;cursor:pointer}
.otcbar button.on{background:#e08b2a;border-color:#e08b2a;color:#fff}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat div{background:#f7faff;border:1px solid #e2ecff;border-radius:9px;padding:8px 12px;font-size:11.5px;color:var(--sub);font-weight:700}
.stat div b{display:block;font-size:19px;color:var(--ink);font-weight:800}
.vocitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fbfcfe}
.vocitem .ot{font-size:13px;color:#22303f}
.vocitem .fu{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px;font-size:12.5px;display:none}
.vocitem.open .fu{display:block}
.vocitem .fq{color:#7a8798;font-style:italic;margin-bottom:5px}
.vocitem .fa{color:#1b2330;background:#eef4ff;border-radius:7px;padding:7px 9px}
.hasfu{cursor:pointer}
.throw .blab .tx b{font-weight:800}
.throw:hover .btrack{outline:2px solid #dbe6fb}
.throw.op .btrack{outline:2px solid var(--accent)}
.vlist{margin:8px 0 16px;padding:10px 12px;background:#f7f9fd;border:1px solid var(--line);border-radius:10px}
.tag{display:inline-block;background:#eef4ff;color:#3b6cf6;border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:800;margin-left:6px}
.tag.no{background:#f1f4f9;color:#98a3b3}
.tabs{display:flex;gap:4px;background:#eef2f8;padding:4px;border-radius:10px;margin-bottom:12px;width:fit-content}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.hist{display:flex;align-items:flex-end;gap:3px;height:120px;margin-bottom:6px}
.hist div{flex:1;border-radius:3px 3px 0 0;position:relative}
.xax{display:flex;gap:3px;font-size:9.5px;color:var(--sub)}.xax div{flex:1;text-align:center}
.warn{background:#fff8f6;border-left:3px solid var(--neg);border-radius:8px;padding:9px 12px;font-size:12px;color:#8a3b2c;margin-top:10px}
.small{font-size:11.5px;color:var(--sub)}
.flowtbl{width:100%;border-collapse:collapse;font-size:11.5px}
.flowtbl th,.flowtbl td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.flowtbl th{background:#f6f9fe;font-weight:700}
.flowtbl td.b{text-align:left;font-weight:700;background:#fbfcfe}
.hm{color:#fff;font-weight:800}

<script>
const D=JSON.parse(document.getElementById('D').textContent);
const QD={};D.q.forEach(q=>QD[q.key]=q);
const N=D.n;
const st={sev:new Set(D.sev.map((_,i)=>i)),ch:new Set(),sec:'sum',otc:{cleanser:'all',moist:'all',spot:'all'},c10:null,voc:{theme:null}};
const OTCIDX={cleanser:0,moist:4,spot:5};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const f1=x=>(Math.round(x*10)/10).toFixed(1);

/* ---------- respondent sets ---------- */
function baseIdx(){
 const out=[];
 for(let i=0;i<N;i++){
  const s=D.sevv[i];
  if(s==null||!st.sev.has(s))continue;
  if(st.ch.size){let ok=false;for(const c of D.chv[i])if(st.ch.has(c)){ok=true;break}if(!ok)continue}
  out.push(i);
 }
 return out;
}
function secIdx(sec){
 let idx=baseIdx();
 const key=sec.id;
 if(OTCIDX[key]!==undefined&&st.otc[key]!=='all'){
  const j=OTCIDX[key],want=+st.otc[key];
  idx=idx.filter(i=>D.otc[i][j]===want);
 }
 return idx;
}
const ALL=()=>{const a=[];for(let i=0;i<N;i++)a.push(i);return a};

/* ---------- aggregation ---------- */
function aggSA(q,idx){
 const c=new Array(q.choices.length).fill(0);let base=0;
 idx.forEach(i=>{const v=q.enc[i];if(v!=null){c[v]++;base++}});
 return {counts:c,base:base,labels:q.choices};
}
function aggMA(q,idx){
 const c=new Array(q.items.length).fill(0);let base=0;
 idx.forEach(i=>{const v=q.enc[i];if(v!=null){base++;v.forEach(k=>c[k]++)}});
 return {counts:c,base:base,labels:q.items};
}
function aggMatrix(q,idx){
 const rows=q.items.map(()=>new Array(q.choices.length).fill(0));
 const bases=q.items.map(()=>0);
 idx.forEach(i=>{const v=q.enc[i];if(!v)return;v.forEach((x,j)=>{if(x!=null){rows[j][x]++;bases[j]++}})});
 return {rows:rows,bases:bases,labels:q.choices,items:q.items};
}
function meanOf(counts,labels,lik){
 // scale: index position among non-excluded, 1..k
 const ex=new Set(lik.exclude||[]);
 let s=0,n=0,k=0;const pos={};
 labels.forEach(l=>{if(!ex.has(l)){k++;pos[l]=k}});
 labels.forEach((l,i)=>{if(!ex.has(l)){s+=pos[l]*counts[i];n+=counts[i]}});
 return {mean:n?s/n:null,n:n,k:k};
}
/* ---------- chart renderers ---------- */
const PAL=['#3b6cf6','#5b84f8','#7f9ffb','#a8bdfd','#f2994a','#f6b97a','#2fb37f','#7fd0b0','#e5644e','#eb9083','#8e7cf0','#b3a7f5'];
function barChart(labels,counts,base,opt){
 opt=opt||{};
 let ord=labels.map((l,i)=>i);
 if(!opt.keepOrder)ord.sort((a,b)=>counts[b]-counts[a]);
 const ps=counts.map(c=>pct(c,base));
 let mxp=Math.max(1,...ps);
 if(opt.ghost)mxp=Math.max(mxp,...opt.ghost.counts.map(c=>pct(c,opt.ghost.base)));
 let h='<div class="bars">';
 ord.forEach(i=>{
  const p=ps[i];let d='';let g='';
  if(opt.ghost){const gp=pct(opt.ghost.counts[i],opt.ghost.base);
   g=`<div class="bghost" style="width:${gp/mxp*100}%" title="전체 401명 기준 ${gp}%"></div>`;}
  h+=`<div class="brow"><div class="blab"><span class="tx">${esc(labels[i])}</span>${d}<span class="cnt">${counts[i]}명</span><span class="vv">${p}%</span></div>
  <div class="btrack"><div class="bfill" style="width:${p/mxp*100}%"></div>${g}</div></div>`;
 });
 return h+'</div>';
}
function donut(labels,counts,base){
 let ord=labels.map((l,i)=>i).sort((a,b)=>counts[b]-counts[a]);
 let acc=0,segs='',leg='';const R=54,C=2*Math.PI*R;
 ord.forEach((i,k)=>{const p=counts[i]/base;const col=PAL[k%PAL.length];
  segs+=`<circle r="${R}" cx="70" cy="70" fill="transparent" stroke="${col}" stroke-width="26" stroke-dasharray="${p*C} ${C}" stroke-dashoffset="${-acc*C}" transform="rotate(-90 70 70)"></circle>`;
  acc+=p;
  leg+=`<div><i style="background:${col}"></i>${esc(labels[i])} <b>${pct(counts[i],base)}%</b> <span class="small">(${counts[i]})</span></div>`;});
 return `<div class="dz"><svg width="140" height="140" viewBox="0 0 140 140">${segs}</svg><div class="legend">${leg}</div></div>`;
}
function stacked(agg,lik){
 let h='';
 const leg=agg.labels.map((l,k)=>`<div><i style="background:${PAL[k%PAL.length]}"></i>${esc(l)}</div>`).join('');
 agg.items.forEach((it,j)=>{
  const b=agg.bases[j];
  if(!b){h+=`<div class="mrow"><div class="mn" title="${esc(it)}">${esc(it)}</div><div class="small">해당 없음</div><div></div></div>`;return}
  let bar='';
  agg.labels.forEach((l,k)=>{const p=agg.rows[j][k]/b*100;if(p>0)bar+=`<span title="${esc(l)} ${Math.round(p)}%" style="width:${p}%;background:${PAL[k%PAL.length]}"></span>`});
  let m='';
  if(lik){const mm=meanOf(agg.rows[j],agg.labels,lik);m=mm.mean!=null?f1(mm.mean):'—'}
  h+=`<div class="mrow"><div class="mn" title="${esc(it)}">${esc(it)}</div><div class="stk">${bar}</div><div class="mean">${m||('n='+b)}</div></div>`;
 });
 return h+`<div class="legend" style="flex-direction:row;flex-wrap:wrap;gap:12px;margin-top:8px">${leg}</div>`;
}
function likertCard(q,agg){
 const mm=meanOf(agg.counts,agg.labels,q.likert);
 let bar='';
 const inc=agg.labels.filter(l=>!(q.likert.exclude||[]).includes(l));
 const tot=agg.base;
 agg.labels.forEach((l,k)=>{const p=agg.counts[k]/tot*100;if(p>0)bar+=`<span title="${esc(l)} ${Math.round(p*10)/10}%" style="width:${p}%;background:${(q.likert.exclude||[]).includes(l)?'#c9d2df':PAL[inc.indexOf(l)%PAL.length]}"></span>`});
 const leg=agg.labels.map((l,k)=>`<div><i style="background:${(q.likert.exclude||[]).includes(l)?'#c9d2df':PAL[inc.indexOf(l)%PAL.length]}"></i>${esc(l)} <b>${pct(agg.counts[k],tot)}%</b></div>`).join('');
 return `<div class="dz"><div class="bigmean"><div><div class="v">${mm.mean!=null?f1(mm.mean):'—'}</div><span class="u">/ ${mm.k}.0 점 평균</span><span class="d">${esc(q.likert.dir||'')}${(q.likert.exclude||[]).length?' · 「'+q.likert.exclude.join('/')+'」 제외 n='+mm.n:''}</span></div></div>
 <div style="flex:1;min-width:280px"><div class="stk" style="height:26px">${bar}</div><div class="legend" style="flex-direction:row;flex-wrap:wrap;gap:12px;margin-top:8px">${leg}</div></div></div>`;
}
function binEdges(all,nb){
 const mn=Math.floor(Math.min(...all)),mx=Math.ceil(Math.max(...all));
 const step=Math.max(1,Math.ceil((mx-mn)/nb));
 const b=[];for(let x=mn;x<=mx;x+=step)b.push(x);
 if(b[b.length-1]<=mx)b.push(b[b.length-1]+step);
 return b;
}
function histogram(vals,edges,color){
 if(!vals.length)return '<div class="small">응답 없음</div>';
 const c=new Array(edges.length-1).fill(0);
 vals.forEach(v=>{let k=edges.findIndex((e,i)=>i<edges.length-1&&v>=e&&v<edges[i+1]);if(k<0)k=c.length-1;c[k]++});
 const mx=Math.max(...c);
 return `<div class="hist">${c.map((n,i)=>`<div title="$${edges[i]}~$${edges[i+1]-1} · ${n}명 (${pct(n,vals.length)}%)" style="height:${n/mx*100}%;background:${color}"></div>`).join('')}</div>
 <div class="xax">${c.map((n,i)=>`<div>${i%2?'':'$'+edges[i]}</div>`).join('')}</div>`;
}
function cumCurve(A,B,cross){
 const lo=Math.min(A.min,B.min),hi=Math.max(A.max,B.max);
 const W=560,H=190,PADL=38,PADB=26,PADT=8,PADR=10;
 const xs=[];for(let x=lo;x<=hi;x+=Math.max(1,Math.round((hi-lo)/120)))xs.push(x);
 if(xs[xs.length-1]!==hi)xs.push(hi);
 const X=v=>PADL+(v-lo)/(hi-lo)*(W-PADL-PADR);
 const Y=p=>PADT+(1-p)*(H-PADT-PADB);
 const fa=x=>A.arr.filter(v=>v>=x).length/A.n;
 const fb=x=>B.arr.filter(v=>v<=x).length/B.n;
 const pa=xs.map(x=>`${X(x)},${Y(fa(x))}`).join(' ');
 const pb=xs.map(x=>`${X(x)},${Y(fb(x))}`).join(' ');
 let grid='';
 [0,.25,.5,.75,1].forEach(p=>{grid+=`<line x1="${PADL}" y1="${Y(p)}" x2="${W-PADR}" y2="${Y(p)}" stroke="#eef2f8"/><text x="4" y="${Y(p)+4}" font-size="9" fill="#8b97a8">${p*100}%</text>`});
 let xt='';
 [lo,Math.round(lo+(hi-lo)*.25),Math.round((lo+hi)/2),Math.round(lo+(hi-lo)*.75),hi].forEach(v=>{
  xt+=`<text x="${X(v)}" y="${H-8}" font-size="9" fill="#8b97a8" text-anchor="middle">$${v}</text>`});
 const cx=X(cross.x);
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto">${grid}${xt}
 <polyline points="${pa}" fill="none" stroke="#3b6cf6" stroke-width="2"/>
 <polyline points="${pb}" fill="none" stroke="#e5644e" stroke-width="2"/>
 <line x1="${cx}" y1="${PADT}" x2="${cx}" y2="${H-PADB}" stroke="#2fb37f" stroke-width="1.5" stroke-dasharray="4 3"/>
 <circle cx="${cx}" cy="${Y(cross.cheap)}" r="4" fill="#2fb37f"/>
 <text x="${cx+6}" y="${Y(cross.cheap)-6}" font-size="10" font-weight="700" fill="#1e8f65">교차 $${cross.x}</text></svg>
 <div class="legend" style="flex-direction:row;gap:16px;flex-wrap:wrap;margin-top:4px">
  <div><i style="background:#3b6cf6"></i>이 가격도 <b>아직 합리적</b> (적정가 ≥ x 라고 답한 비율)</div>
  <div><i style="background:#e5644e"></i>이 가격은 <b>이미 부담</b> (부담가 ≤ x 라고 답한 비율)</div>
  <div><i style="background:#2fb37f"></i>두 곡선 교차 = 무차별 가격</div></div>`;
}
</script>
<script>
/* ---------- insight generators (all computed, never hardcoded) ---------- */
function topN(labels,counts,base,n){
 return labels.map((l,i)=>({l:l,c:counts[i],p:pct(counts[i],base)}))
  .sort((a,b)=>b.c-a.c).slice(0,n);
}
function insSA(q,agg,ghost){
 const t=topN(agg.labels,agg.counts,agg.base,3).filter(x=>x.c>0);
 if(!t.length)return '해당 문항에 응답한 사람이 없습니다.';
 let s=`1위 <b>${esc(t[0].l)}</b> ${t[0].p}% (${t[0].c}명)`;
 if(t[1])s+=` · 2위 ${esc(t[1].l)} ${t[1].p}%`;
 if(t[2])s+=` · 3위 ${esc(t[2].l)} ${t[2].p}%`;
 s+=` — 응답 대상 n=${agg.base}`;
 if(ghost)s+='. 점선은 전체 401명 기준 분포(참고용)';
 return s+'.';
}
function insMA(q,agg,ghost){
 const t=topN(agg.labels,agg.counts,agg.base,3).filter(x=>x.c>0);
 if(!t.length)return '선택된 항목이 없습니다.';
 const avg=agg.counts.reduce((a,b)=>a+b,0)/(agg.base||1);
 let s=`선택률 상위: ${t.map(x=>`<b>${esc(x.l)}</b> ${x.p}%`).join(' · ')} — 응답 대상 n=${agg.base}, 1인 평균 ${f1(avg)}개 선택`;
 if(ghost)s+='. 점선은 전체 401명 기준 분포(참고용)';
 return s+'.';
}
function insMatrix(q,agg){
 if(q.likert){
  const ms=agg.items.map((it,j)=>({it:it,m:meanOf(agg.rows[j],agg.labels,q.likert).mean,n:agg.bases[j]}))
   .filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);
  if(!ms.length)return '응답 없음.';
  let s=`평균 점수 최고 <b>${esc(ms[0].it)}</b> ${f1(ms[0].m)}점`;
  if(ms.length>1)s+=`, 최저 <b>${esc(ms[ms.length-1].it)}</b> ${f1(ms[ms.length-1].m)}점 — 격차 ${f1(ms[0].m-ms[ms.length-1].m)}점`;
  return s+`. (${esc(q.likert.dir||'')})`;
 }
 const first=agg.labels[0];
 const rk=agg.items.map((it,j)=>({it:it,p:pct(agg.rows[j][0],agg.bases[j]),n:agg.bases[j]}))
  .filter(x=>x.n>0).sort((a,b)=>b.p-a.p);
 if(!rk.length)return '응답 없음.';
 return `「${esc(first)}」 비율이 가장 높은 항목은 <b>${esc(rk[0].it)}</b> ${rk[0].p}% (n=${rk[0].n}), 가장 낮은 항목은 <b>${esc(rk[rk.length-1].it)}</b> ${rk[rk.length-1].p}%.`;
}
/* ---------- price (C16) ---------- */
function priceStats(vals){
 const v=vals.filter(x=>x!=null&&!isNaN(x)).sort((a,b)=>a-b);
 if(!v.length)return null;
 const q=p=>v[Math.min(v.length-1,Math.floor(p*v.length))];
 return {n:v.length,min:v[0],max:v[v.length-1],med:q(.5),p25:q(.25),p75:q(.75),
  mean:v.reduce((a,b)=>a+b,0)/v.length,arr:v};
}
function renderPrice(q,idx){
 const good=idx.map(i=>q.enc[0][i]),exp=idx.map(i=>q.enc[1][i]);
 const A=priceStats(good),B=priceStats(exp);
 if(!A||!B)return '<div class="small">응답 없음</div>';
 const lo=Math.floor(Math.min(A.min,B.min)),hi=Math.ceil(Math.max(A.max,B.max));
 let best=null;
 for(let x=lo;x<=hi;x++){
  const cheap=A.arr.filter(v=>v>=x).length/A.n;
  const dear=B.arr.filter(v=>v<=x).length/B.n;
  const gap=Math.abs(cheap-dear);
  if(best===null||gap<best.gap)best={x:x,gap:gap,cheap:cheap,dear:dear};
 }
 const edges=binEdges(A.arr.concat(B.arr),16);
 const inv=A.arr.filter(v=>v<=B.med).length;
 const bad=idx.filter(i=>q.enc[0][i]!=null&&q.enc[1][i]!=null&&q.enc[0][i]>q.enc[1][i]).length;
 const tile=(l,v)=>`<div>${l}<b>${v}</b></div>`;
 return `<div class="grid2">
  <div>
   <div class="qsub" style="margin-bottom:8px"><b style="color:#3b6cf6">적정가</b> — "이 정도면 합리적" (n=${A.n})</div>
   <div class="stat">${tile('중앙값','$'+A.med)}${tile('평균','$'+f1(A.mean))}${tile('범위','$'+A.min+'–$'+A.max)}</div>
   ${histogram(A.arr,edges,'#3b6cf6')}
  </div>
  <div>
   <div class="qsub" style="margin-bottom:8px"><b style="color:#e5644e">비싸다고 느끼는 가격</b> — "이 이상은 부담" (n=${B.n})</div>
   <div class="stat">${tile('중앙값','$'+B.med)}${tile('평균','$'+f1(B.mean))}${tile('범위','$'+B.min+'–$'+B.max)}</div>
   ${histogram(B.arr,edges,'#e5644e')}
  </div></div>
 <div class="small" style="margin-top:6px">두 히스토그램은 동일한 가격 구간(bin)을 쓰므로 좌우를 그대로 비교할 수 있습니다.</div>
 <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px">
  <h3 style="margin:0 0 3px;font-size:14px">누적 곡선 — 무차별 가격 도출</h3>
  <p class="qsub">가격 x를 올려가며 두 비율을 계산합니다. 파란 곡선은 <b>"적정가가 x 이상"이라고 답한 사람의 비율</b>(= x여도 아직 합리적으로 보는 사람), 빨간 곡선은 <b>"부담 시작가가 x 이하"라고 답한 사람의 비율</b>(= x면 이미 비싸다고 보는 사람). 두 곡선이 만나는 지점이 <b>무차별 가격</b>입니다.</p>
  ${cumCurve(A,B,best)}
  <div class="stat" style="margin-top:12px">
   ${tile('무차별 가격 (교차점)','$'+best.x)}
   ${tile('중앙값 밴드','$'+A.med+'–$'+B.med)}
   ${tile('교차점에서 「아직 합리적」',Math.round(best.cheap*100)+'%')}
   ${tile('교차점에서 「이미 부담」',Math.round(best.dear*100)+'%')}
  </div>
 </div>
 <div class="insight">적정가 중앙값 <b>$${A.med}</b>, 부담 시작가 중앙값 <b>$${B.med}</b> → 절반 이상이 받아들이는 <b>중앙값 밴드는 $${A.med}–$${B.med}</b>.
 두 누적 곡선이 교차하는 <b>무차별 가격은 $${best.x}</b>로, 이 가격에서 "아직 합리적" ${Math.round(best.cheap*100)}%와 "이미 부담" ${Math.round(best.dear*100)}%가 균형을 이룹니다.
 적정가를 부담 중앙값($${B.med}) 이하로 답한 사람은 ${inv}명(${pct(inv,A.n)}%)입니다.</div>
 <div class="warn"><b>해석 주의</b> — 이 값은 Van Westendorp 가격민감도 분석의 4개 문항 중 2개(적정가·부담가)만으로 계산한 근사치입니다. "너무 싸서 품질이 의심된다"는 하한 문항이 없어 <b>최적가가 아니라 상한 참고선</b>으로 보는 것이 정확합니다.
 또 주관식 숫자 입력이라 $1, $100 같은 극단값이 섞여 있고(적정가 범위 $${A.min}–$${A.max}), 적정가를 부담가보다 높게 답한 논리적 모순 응답이 ${bad}명 있습니다.</div>`;
}
function renderFlow(fromKey,toKey,idx,title){
 const F=QD[fromKey],T=QD[toKey];
 if(!F||!T)return '';
 const pairs=[];
 idx.forEach(i=>{const a=F.enc[i],b=T.enc[i];if(a!=null&&b!=null)pairs.push([F.choices[a],T.choices[b]])});
 if(!pairs.length)return '';
 const froms={},tos={};
 pairs.forEach(([a,b])=>{froms[a]=(froms[a]||0)+1;tos[b]=(tos[b]||0)+1});
 const K=6;
 const topF=Object.entries(froms).sort((a,b)=>b[1]-a[1]).slice(0,K).map(x=>x[0]);
 const topT=Object.entries(tos).sort((a,b)=>b[1]-a[1]).slice(0,K).map(x=>x[0]);
 const ETC='기타 브랜드';
 const rf=a=>topF.includes(a)?a:ETC, rt=b=>topT.includes(b)?b:ETC;
 const rows=topF.concat([ETC]),cols=topT.concat([ETC]);
 const cell={};rows.forEach(r=>cols.forEach(c=>cell[r+'||'+c]=0));
 pairs.forEach(([a,b])=>{cell[rf(a)+'||'+rt(b)]++});
 const rowTot={},colTot={};
 rows.forEach(r=>rowTot[r]=cols.reduce((s,c)=>s+cell[r+'||'+c],0));
 cols.forEach(c=>colTot[c]=rows.reduce((s,r)=>s+cell[r+'||'+c],0));
 const mx=Math.max(1,...Object.values(cell));
 let h=`<table class="flowtbl"><tr><th style="text-align:left">이전 ↓ / 현재 →</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>이탈 계</th></tr>`;
 rows.forEach(r=>{
  h+=`<tr><td class="b">${esc(r)}</td>`;
  cols.forEach(c=>{const v=cell[r+'||'+c];
   h+=`<td ${v?`class="hm" style="background:rgba(59,108,246,${.15+v/mx*.7})"`:''} title="${esc(r)} → ${esc(c)} : ${v}명">${v||''}</td>`});
  h+=`<td><b>${rowTot[r]}</b></td></tr>`;
 });
 h+=`<tr><td class="b">유입 계</td>${cols.map(c=>`<td><b>${colTot[c]}</b></td>`).join('')}<td><b>${pairs.length}</b></td></tr></table>`;
 const names=[...new Set(Object.keys(froms).concat(Object.keys(tos)))];
 const net=names.map(n=>({n:n,i:tos[n]||0,o:froms[n]||0,net:(tos[n]||0)-(froms[n]||0)})).sort((a,b)=>b.net-a.net);
 const win=net.filter(x=>x.net>0).slice(0,3),lose=net.filter(x=>x.net<0).slice(-3).reverse();
 const churn=net.filter(x=>x.net===0&&x.i>0).sort((a,b)=>b.i-a.i);
 let ins=`전환 건수 <b>${pairs.length}건</b>. 순유입(유입−이탈) 기준으로 보면 —<br>
 <b>순증가:</b> ${win.length?win.map(x=>`${esc(x.n)} <b>${x.net>0?'+':''}${x.net}</b> (유입 ${x.i} / 이탈 ${x.o})`).join(' · '):'없음'}<br>
 <b>순감소:</b> ${lose.length?lose.map(x=>`${esc(x.n)} <b>${x.net}</b> (유입 ${x.i} / 이탈 ${x.o})`).join(' · '):'없음'}`;
 if(churn.length)ins+=`<br><b>유입=이탈 (제자리):</b> ${churn.slice(0,3).map(x=>`${esc(x.n)} ±${x.i}`).join(' · ')} — 규모는 크지만 순증감이 없는 회전형 브랜드입니다.`;
 return `<div class="card"><h3>${esc(title)}<span class="badge g">파생 분석</span></h3>
 <p class="qsub">전환 경험자 ${pairs.length}명의 이전 → 현재 브랜드 이동. 상위 ${K}개 브랜드만 개별 표시하고 나머지는 「기타 브랜드」로 합산했습니다 — 행·열 합계가 전체 ${pairs.length}건과 정확히 맞습니다.
 대각선은 구조적으로 0입니다(같은 브랜드로 "전환"할 수 없으므로).</p>${h}
 <div class="insight">${ins}</div></div>`;
}

<script>

const FILTERQ={'A3':'sev','F1':'chan'};
function renderQ(key,idx){

 if(q.type==='MATRIX'){

 }
 if(q.type==='PRICE'){
  const n=idx.filter(i=>q.enc[0][i]!=null).length;

 }
 return '';

function insLik(q,agg){

 });

function renderVOC(idx){
 const rows=vocRows(idx);
 const nfu=rows.filter(v=>v.a).length;
 let h=`<div class="card"><h3>현재 아크네 루틴의 미충족 — 니즈 테마 <span class="badge g">주관식 분석</span></h3>
 <p class="qsub"><span class="code">B7</span>What’s the one thing your current acne routine doesn’t do well — or that you wish a product could do for you? <span class="badge">OPEN + AI FOLLOW-UP</span><br>
 응답 <b>n=${rows.length}</b> · 이 중 AI 후속질문이 걸린 응답 ${nfu}건 · 현재 필터 표본 ${CURN}명 · 테마는 원응답 + 후속답변을 함께 읽어 분류(복수 태그 허용)</p>

 {

<script>
/* ---------- shell ---------- */
const PRE=[['all','전체'],['mild','Mild 이하 (0-2)'],['mod','Moderate 이상 (3-5)']];
function buildFilters(){
 document.getElementById('fsev').innerHTML=D.sev.map((s,i)=>`<button class="chip ${st.sev.has(i)?'on':''}" data-sev="${i}">${esc(s)}</button>`).join('');
 document.getElementById('fpre').innerHTML=PRE.map(p=>`<button data-pre="${p[0]}" class="${curPre()===p[0]?'on':''}">${p[1]}</button>`).join('');
 document.getElementById('fchan').innerHTML=D.chan.map((c,i)=>`<button class="chip ${st.ch.has(i)?'on':''}" data-ch="${i}">${esc(c)}</button>`).join('');
}
function curPre(){
 const a=[...st.sev].sort((x,y)=>x-y).join(',');
 if(a==='0,1,2,3,4,5')return 'all';
 if(a==='0,1,2')return 'mild';
 if(a==='3,4,5')return 'mod';
 return '';
}
function buildSide(){
 document.getElementById('side').innerHTML=D.sections.map(s=>`<a data-sec="${s.id}" class="${st.sec===s.id?'on':''}">${esc(s.t)}</a>`).join('');
}
function render(){
 const base=baseIdx();CURN=base.length;
 const fl=(st.sev.size!==D.sev.length||st.ch.size>0);
 document.getElementById('nb').innerHTML=fl?`필터 적용 <b>${base.length}명</b> / 401명 (${pct(base.length,401)}%)`:`전체 <b>401명</b>`;
 const sec=D.sections.find(s=>s.id===st.sec);
 const idx=secIdx(sec);
 let h=`<h1 class="sec-t">${esc(sec.t)}</h1><p class="sec-d">${esc(sec.d||'')}</p>`;
 if(OTCIDX[sec.id]!==undefined){
  const j=OTCIDX[sec.id];
  const opts=[['all','전체']].concat(D.otcLab.map((l,i)=>[String(i),l]));
  const cnt=v=>base.filter(i=>v==='all'?true:D.otc[i][j]===+v).length;
  h+=`<div class="otcbar"><span class="lb">B2 기준 · 이 카테고리에서 사용하는 제품 유형</span>`+
   opts.map(([v,l])=>`<button data-otc="${sec.id}:${v}" class="${st.otc[sec.id]===v?'on':''}">${esc(l)} <span style="opacity:.65">${cnt(v)}</span></button>`).join('')+
   `<span class="small" style="width:100%">「전체」는 현재 필터 표본 ${base.length}명 전원. 나머지 버튼을 누르면 B1에서 이 카테고리를 사용한다고 답한 ${base.filter(i=>D.otc[i][j]!=null).length}명 안에서만 계산됩니다(미사용자 자동 제외). 이 섹션의 모든 수치·인사이트가 함께 재계산됩니다.</span></div>`;
 }
 if(sec.id==='sum')h+=renderSummary(base);
  else{
  sec.q.forEach(k=>{
   if(k==='B7'){h+=renderVOC(idx);return}
   if(k==='C10'){h+=renderC10(idx);return}
   h+=renderQ(k,idx);
   if(k==='C3')h+=renderFlow('C3','C1',idx,'클렌저 브랜드 전환 흐름 (C3 → C1)');
   if(k==='E4_M')h+=renderFlow('E4_M','E1',idx,'모이스처라이저 브랜드 전환 흐름 (E4_M → E1)');
   if(k==='E4_ST')h+=renderFlow('E4_ST','E2',idx,'스팟트리트먼트 브랜드 전환 흐름 (E4_ST → E2)');
   if(k==='E16')h+=renderGap(idx);
  });
 }
 const sameSec=(LASTSEC===st.sec);LASTSEC=st.sec;
 const sy=window.scrollY;
 document.getElementById('main').innerHTML=h;
 window.scrollTo({top:sameSec?sy:0});
}
function miniBar(labels,counts,base,topn,color){
 const ord=labels.map((l,i)=>i).sort((a,b)=>counts[b]-counts[a]).slice(0,topn||6).filter(i=>counts[i]>0);
 const mx=Math.max(1,...ord.map(i=>counts[i]));
 return '<div class="bars">'+ord.map(i=>`<div class="brow"><div class="blab"><span class="tx">${esc(labels[i])}</span><span class="cnt">${counts[i]}명</span><span class="vv">${pct(counts[i],base)}%</span></div>
 <div class="btrack" style="height:12px"><div class="bfill" style="width:${counts[i]/mx*100}%${color?';background:'+color:''}"></div></div></div>`).join('')+'</div>';
}
function renderC10(idx){
 const q=QD['C10'];
 const agg=aggSA(q,idx);
 if(!agg.base)return skel(q,'현재 필터 조건에서 이 문항에 응답한 사람이 없습니다.');
 const groups=q.choices.map((l,k)=>({k:k,l:l,n:agg.counts[k],ids:idx.filter(i=>q.enc[i]===k)}))
   .filter(g=>g.n>0).sort((a,b)=>b.n-a.n);
 const mx=Math.max(...groups.map(g=>g.n));
 let h=`<div class="card"><h3>${esc(q.title)}</h3>
 <p class="qsub"><span class="code">${esc(q.key)}</span>${esc(q.stem)}<br>응답 대상 <b>n=${agg.base}</b> / 현재 필터 표본 ${CURN}명 / 전체 401명<br>
 막대를 클릭하면 그 그룹의 <b>현재 클렌저 브랜드(C1)</b> · <b>찾는 성분(C14)</b> · <b>OTC 중요도(C8)</b> · <b>아젤라익산 구매의향(C15)</b>이 펼쳐집니다.</p>
 <div class="bars">`;
 groups.forEach(g=>{
  const open=st.c10===String(g.k);
  h+=`<div class="brow throw ${open?'op':''}" data-c10="${g.k}" style="cursor:pointer">
   <div class="blab"><span class="tx">${esc(g.l)}</span><span class="cnt">${g.n}명</span><span class="vv">${pct(g.n,agg.base)}%</span><span class="small">${open?'▲':'▼'}</span></div>
   <div class="btrack"><div class="bfill" style="width:${g.n/mx*100}%"></div></div></div>`;
  if(open){
   if(g.n<30)h+=`<div class="warn">표본 ${g.n}명으로 매우 작습니다 — 방향 참고용으로만 보세요.</div>`;
   const c1=aggSA(QD['C1'],g.ids),c14=aggMA(QD['C14'],g.ids);
   const c8=aggSA(QD['C8'],g.ids),m8=meanOf(c8.counts,c8.labels,QD['C8'].likert);
   const c15=aggSA(QD['C15'],g.ids),m15=meanOf(c15.counts,c15.labels,QD['C15'].likert);
   const up=c15.labels.reduce((s,l,i)=>s+((l.indexOf('more likely')>0)?c15.counts[i]:0),0);
   h+=`<div class="vlist"><div class="dz" style="margin-bottom:12px">
     <div class="bigmean"><div><div class="v">${m8.mean!=null?f1(m8.mean):'—'}</div><span class="u">/ 5.0 · C8 OTC 중요도</span><span class="d">높을수록 OTC 중요 · n=${m8.n}</span></div></div>
     <div class="bigmean" style="background:#f6fbf8;border-color:#d9efe5"><div><div class="v" style="color:#1e8f65">${m15.mean!=null?f1(m15.mean):'—'}</div><span class="u">/ 5.0 · C15 아젤라익산 구매의향</span><span class="d">"더 살 것 같다" ${pct(up,c15.base)}% · n=${m15.n}</span></div></div>
    </div>
    <div class="grid2">
     <div><div class="qsub" style="margin-bottom:6px"><b>현재 사용 클렌저 브랜드 (C1)</b> · n=${c1.base}</div>${miniBar(c1.labels,c1.counts,c1.base,6)}</div>
     <div><div class="qsub" style="margin-bottom:6px"><b>아크네 클렌저에서 찾는 성분 (C14)</b> · n=${c14.base}</div>${miniBar(c14.labels,c14.counts,c14.base,6,'linear-gradient(90deg,#f6b97a,#f2994a)')}</div>
    </div></div>`;
  }
 });
 h+='</div>';
 h+=`<div class="insight">${insSA(q,agg,null)}</div>`;
 const gSA=groups.find(g=>g.l.indexOf('Salicylic')>0),gBP=groups.find(g=>g.l.indexOf('Benzoyl')>0);
 if(gSA&&gBP&&gSA.n>=20&&gBP.n>=20){
  const mm=(ids,key)=>{const a=aggSA(QD[key],ids);return meanOf(a.counts,a.labels,QD[key].likert).mean};
  const topB=ids=>{const a=aggSA(QD['C1'],ids);return topN(a.labels,a.counts,a.base,1)[0]};
  const a15=mm(gSA.ids,'C15'),b15=mm(gBP.ids,'C15'),a8=mm(gSA.ids,'C8'),b8=mm(gBP.ids,'C8');
  h+=`<div class="insight"><b>SA 선호(${gSA.n}명) vs BPO 선호(${gBP.n}명)</b> —
   아젤라익산 구매의향 <b>${f1(a15)}</b> vs <b>${f1(b15)}</b>, OTC 중요도 <b>${f1(a8)}</b> vs <b>${f1(b8)}</b>.
   현재 브랜드 1위는 각각 ${esc(topB(gSA.ids).l)} ${topB(gSA.ids).p}% / ${esc(topB(gBP.ids).l)} ${topB(gBP.ids).p}%.
   ${a15>b15?'SA 선호층이 아젤라익산을 더 잘 받아들입니다':b15>a15?'BPO 선호층이 아젤라익산을 더 잘 받아들입니다':'두 집단의 아젤라익산 수용도는 동일합니다'} — 성분 커뮤니케이션의 우선 타겟 판단에 쓰세요.</div>`;
 }
 return h+'</div>';
}
function renderGap(idx){
 const q=QD['E16'],qa=QD['E16-a'];
 const m=aggMatrix(q,idx),a=aggMA(qa,idx);
 const rows=m.items.map((it,j)=>{const mm=meanOf(m.rows[j],m.labels,q.likert).mean;
  const k=a.labels.indexOf(it);return {it:it,m:mm,p:k>=0?pct(a.counts[k],a.base):0}}).filter(x=>x.m!=null);
 rows.sort((x,y)=>y.m-x.m);
 const mxm=Math.max(...rows.map(r=>r.m)),mxp=Math.max(...rows.map(r=>r.p));
 let h=`<div class="card"><h3>중요도 평균 vs Top3 선택률 갭 <span class="badge g">파생 분석</span></h3>
 <p class="qsub">E16 평균 중요도(파랑)와 E16-a "가장 중요한 3개" 선택률(주황)을 나란히 비교. 파랑은 높은데 주황이 낮으면 <b>"다 중요하다고는 하지만 우선순위는 아닌"</b> 항목.</p>`;
 rows.forEach(r=>{
  h+=`<div class="brow" style="margin-bottom:9px"><div class="blab"><span class="tx">${esc(r.it)}</span><span class="vv">${f1(r.m)}점</span><span class="cnt">Top3 ${r.p}%</span></div>
  <div class="btrack" style="height:10px"><div class="bfill" style="width:${r.m/mxm*100}%"></div></div>
  <div class="btrack" style="height:10px;margin-top:2px"><div class="bfill" style="width:${r.p/mxp*100}%;background:linear-gradient(90deg,#f6b97a,#f2994a)"></div></div></div>`;
 });
 const gaps=rows.map((r,i)=>({...r,rank:i+1,prank:rows.slice().sort((a,b)=>b.p-a.p).findIndex(x=>x.it===r.it)+1}));
 const over=gaps.slice().sort((a,b)=>(b.prank-b.rank)-(a.prank-a.rank))[0];
 const under=gaps.slice().sort((a,b)=>(a.prank-a.rank)-(b.prank-b.rank))[0];
 h+=`<div class="insight">중요도 순위보다 Top3 순위가 크게 <b>밀린</b> 항목: <b>${esc(over.it)}</b> (중요도 ${over.rank}위 → Top3 ${over.prank}위). 반대로 Top3에서 <b>더 앞선</b> 항목: <b>${esc(under.it)}</b> (중요도 ${under.rank}위 → Top3 ${under.prank}위) — 실제 구매 결정에서 무게가 큰 클레임.</div></div>`;
 return h;
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-sev],[data-pre],[data-ch],[data-sec],[data-otc],[data-th],[data-c10],.hasfu');
 if(!t)return;
 if(t.dataset.sev!==undefined){const i=+t.dataset.sev;st.sev.has(i)?st.sev.delete(i):st.sev.add(i);if(!st.sev.size)st.sev.add(i);buildFilters();render();return}
 if(t.dataset.pre){const p=t.dataset.pre;st.sev=new Set(p==='all'?[0,1,2,3,4,5]:p==='mild'?[0,1,2]:[3,4,5]);buildFilters();render();return}
 if(t.dataset.ch!==undefined){const i=+t.dataset.ch;st.ch.has(i)?st.ch.delete(i):st.ch.add(i);buildFilters();render();return}
 if(t.dataset.c10!==undefined){const v=t.dataset.c10;st.c10=(st.c10===v?null:v);render();return}
 if(t.dataset.sec){st.sec=t.dataset.sec;buildSide();render();return}
 if(t.dataset.otc){const[a,b]=t.dataset.otc.split(':');st.otc[a]=b;render();return}
 if(t.dataset.th){st.voc.theme=st.voc.theme===t.dataset.th?null:t.dataset.th;render();return}
 if(t.classList.contains('hasfu')){t.classList.toggle('open');return}
});
document.getElementById('rst').onclick=()=>{st.sev=new Set([0,1,2,3,4,5]);st.ch=new Set();st.otc={cleanser:'all',moist:'all',spot:'all'};st.c10=null;st.voc.theme=null;buildFilters();render()};
function fixTop(){document.documentElement.style.setProperty('--th',document.getElementById('top').offsetHeight+'px')}
buildFilters();buildSide();render();fixTop();window.addEventListener('resize',fixTop);
/* verification hook */
window.__agg=function(key,sev,ch,otc,gotc){
 const s=st.sev,c=st.ch,o={...st.otc};
 st.sev=new Set(sev);st.ch=new Set(ch);Object.assign(st.otc,otc||{});
 let idx=baseIdx();
 if(otc)for(const k in otc){if(otc[k]!=='all')idx=idx.filter(i=>D.otc[i][OTCIDX[k]]===+otc[k])}
 const q=QD[key];let r;
 if(q.type==='SA')r=aggSA(q,idx);else if(q.type==='MA')r=aggMA(q,idx);
 else if(q.type==='MATRIX'){const m=aggMatrix(q,idx);r={counts:m.rows,base:m.bases}}
 else if(q.type==='PRICE')r={counts:[idx.filter(i=>q.enc[0][i]!=null).length],base:idx.length};
 st.sev=s;st.ch=c;st.otc=o;
 return {n:idx.length,counts:r.counts,base:r.base};
};
</script></body></html>
