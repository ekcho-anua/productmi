<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모이스처라이저 VOC 키워드 대시보드</title>
<style>
  :root{
    --paper:#f6f5f1; --panel:#ffffff; --ink:#1b1d1a; --ink-soft:#5c5f58;
    --line:#e3e1d8; --line-strong:#cfccc0;
    --pos:#2f7d6b; --pos-bg:#e6f1ed; --pos-soft:#8fbfb3;
    --neu:#b08322; --neu-bg:#f6efdd; --neu-soft:#d8c58a;
    --neg:#b1483d; --neg-bg:#f6e6e3; --neg-soft:#d79a91;
    --mono:'SFMono-Regular',ui-monospace,'Menlo','Consolas',monospace;
    --kr:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--kr);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1200px;margin:0 auto;padding:30px 22px 80px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--ink-soft)}
  h1{font-size:clamp(24px,4vw,38px);line-height:1.05;margin:12px 0 6px;letter-spacing:-.02em;font-weight:800}
  .sub{color:var(--ink-soft);font-size:13.5px}
  .sub b{color:var(--ink);font-weight:600}
  h2.sec{font-size:12.5px;font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:34px 0 14px;display:flex;align-items:center;gap:12px}
  h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}

  .viewbar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:22px 0 8px}
  .picker{display:flex;align-items:center;gap:9px}
  .picker label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  select{font-family:var(--kr);font-size:13.5px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);border-radius:9px;padding:8px 12px;cursor:pointer}
  .viewmeta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}

  .stats{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:14px}
  .rating-big{display:flex;align-items:baseline;gap:9px}
  .rating-num{font-family:var(--mono);font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .rating-den{font-family:var(--mono);color:var(--ink-soft);font-size:15px}
  .rating-meta{font-size:11.5px;color:var(--ink-soft);margin-top:6px;font-family:var(--mono)}
  .dist{display:flex;flex-direction:column;gap:5px}
  .dist-row{display:grid;grid-template-columns:32px 1fr 40px;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px}
  .dist-bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
  .dist-fill{height:100%;border-radius:5px;background:var(--line-strong)}
  .dist-row.hi .dist-fill{background:var(--pos-soft)} .dist-row.lo .dist-fill{background:var(--neg-soft)}
  .dist-c{text-align:right;color:var(--ink-soft)}

  .seasontabs{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;margin:22px 0 4px}
  .seasontabs button{border:0;background:transparent;font-family:var(--kr);font-size:13.5px;font-weight:700;color:var(--ink-soft);padding:9px 20px;border-radius:8px;cursor:pointer}
  .seasontabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .seasonmeta{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin:0 0 10px 2px}
  .seasonmeta b{color:var(--ink)}

  .senti{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .senti .bar{flex:1;min-width:180px;display:flex;height:12px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .senti .bar>div{height:100%}
  .senti .sp{background:var(--pos-soft)} .senti .su{background:var(--neu-soft)} .senti .sn{background:var(--neg-soft)}
  .senti .lab{font-family:var(--mono);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
  .senti .lab b{font-weight:700}
  .dot{width:9px;height:9px;border-radius:2px;display:inline-block}
  .dot.p{background:var(--pos)} .dot.n{background:var(--neg)} .dot.u{background:var(--neu)}
  .senti .tot{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}

  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card.accpos{border-top:3px solid var(--pos)} .card.accneg{border-top:3px solid var(--neg)}
  .card h3{margin:0 0 3px;font-size:14.5px;font-weight:700}
  .card .csub{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-bottom:13px}
  .cbar{display:grid;gap:8px}
  .cbar-row{display:grid;grid-template-columns:190px 1fr 56px;align-items:center;gap:10px}
  .cbar-row .cl{font-size:11.5px;line-height:1.25;text-align:right}
  .sztag{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);margin-top:2px}
  .cbar-row .ct{height:15px;background:var(--line);border-radius:4px;overflow:hidden}
  .cbar-row .cf{height:100%;border-radius:4px}
  .accpos .cf{background:var(--pos-soft)} .accneg .cf{background:var(--neg-soft)}
  .cbar-row .cn{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}
  .cbar-row .cn b{color:var(--ink)}
  .empty{background:var(--panel);border:1px dashed var(--line-strong);border-radius:14px;padding:30px;text-align:center;color:var(--ink-soft);font-size:13.5px}

  .foot{margin-top:40px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);line-height:1.7}
  @media (max-width:980px){ .charts{grid-template-columns:1fr} .stats{grid-template-columns:1fr;gap:16px} .cbar-row{grid-template-columns:130px 1fr 50px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">모이스처라이저 · VOC 키워드 대시보드 · Amazon</div>
  <h1 id="title">—</h1>
  <div class="sub" id="subtitle"></div>

  <div class="viewbar">
    <div class="picker">
      <label>SKU</label>
      <select id="picker" onchange="render()"></select>
    </div>
    <div class="viewmeta" id="viewmeta"></div>
  </div>

  <div class="stats">
    <div><div class="rating-big"><span class="rating-num" id="ratingNum">—</span><span class="rating-den">/ 5.0</span></div>
    <div class="rating-meta" id="ratingMeta"></div></div>
    <div class="dist" id="distBox"></div>
  </div>

  <div class="seasontabs">
    <button id="tab-summer" class="on" onclick="setSeason('summer')">여름 (7–8월)</button>
    <button id="tab-winter" onclick="setSeason('winter')">겨울 (12–1월)</button>
  </div>
  <div class="seasonmeta" id="seasonMeta"></div>
  <div class="senti" id="senti"></div>

  <div id="content"></div>
  <div class="foot" id="foot"></div>
</div>

const KM = P.kwmeta, SKUS = P.skus;
const SKUMAP = {}; SKUS.forEach(s=>SKUMAP[s.id]=s);
const trunc=x=>Math.floor(Number(x.toFixed(6))*10)/10;
const pct1=x=>trunc(x).toFixed(1);
let season = 'summer';

function setSeason(s){
  season = s;
  document.getElementById('tab-summer').classList.toggle('on', s==='summer');
  document.getElementById('tab-winter').classList.toggle('on', s==='winter');
  render();
}

function buildLists(counts, sizeBreakdown){
  const total = Object.values(counts).reduce((a,b)=>a+b,0) || 1;
  const pos=[], neg=[];
  let sumPos=0, sumNeu=0, sumNeg=0;
  for (const k in counts){
    if (!counts[k]) continue;
    const m = KM[k];
    const item = {key:k, label:m.label, count:counts[k], pct: trunc(counts[k]/total*100), sizes: (sizeBreakdown||{})[k]};
    if (m.pol==='pos'){ pos.push(item); sumPos+=counts[k]; }
    else if (m.pol==='neg'){ neg.push(item); sumNeg+=counts[k]; }
    else if (m.pol==='neu'){ sumNeu+=counts[k]; }
  }
  pos.sort((a,b)=>b.count-a.count);
  neg.sort((a,b)=>b.count-a.count);
  return {pos, neg, total, sums:{pos:sumPos, neu:sumNeu, neg:sumNeg}};
}

function sizeTag(sizes){
  if (!sizes) return '';
  const parts = Object.keys(sizes).sort().map(sz=>`${sz} ${sizes[sz]}`).join(' · ');
  return `<div class="sztag">용량: ${parts}</div>`;
}

function chartHTML(items, cls){
  if (!items.length) return '<div class="empty">해당 구간에 집계된 키워드 언급이 없습니다.</div>';
  const mx = Math.max(...items.map(i=>i.count),1);
  return `<div class="cbar">${items.slice(0,12).map(i=>`
    <div class="cbar-row">
      <div class="cl">${i.label}${sizeTag(i.sizes)}</div>
      <div class="ct"><div class="cf" style="width:${i.count/mx*100}%"></div></div>
      <div class="cn"><b>${i.count}</b> · ${pct1(i.pct)}%</div>
    </div>`).join('')}</div>`;
}

function sizeDistLine(s){
  if (s.id !== 'cerave_lotion') return '';
  const sd = s.size_dist || {};
  const keys = Object.keys(sd);
  if (keys.length < 2) return '';
  keys.sort((a,b)=>sd[b]-sd[a]);
  const parts = keys.map(k=>`${k} ${sd[k]}건`).join(' · ');
  return `<div style="margin-top:4px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)">용량별 리뷰: ${parts}</div>`;
}

function render(){
  const pk = document.getElementById('picker');
  if (!pk.options.length){
    SKUS.forEach(s=>pk.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.name}</option>`));
  }
  const sel = pk.value || SKUS[0].id;
  const s = SKUMAP[sel];
  document.getElementById('title').textContent = s.name;
  const O = s.overall;
  document.getElementById('subtitle').innerHTML = `전체 평균 평점 <b>${O.avg.toFixed(2)} / 5.0</b> · 리뷰 ${O.n_text}건 · 출처 Amazon 리뷰${sizeDistLine(s)}`;
  document.getElementById('viewmeta').textContent = `평점 ${O.n_rated}건 집계`;

  document.getElementById('ratingNum').textContent = O.avg.toFixed(2);
  document.getElementById('ratingMeta').textContent = `전체 평균 평점 · 평점 ${O.n_rated}건 / 본문 리뷰 ${O.n_text}건`;
  const maxd = Math.max(...Object.values(O.dist));
  document.getElementById('distBox').innerHTML = [5,4,3,2,1].map(r=>{
    const c = O.dist[r]; const cls = r>=4?'hi':(r<=2?'lo':'');
    return `<div class="dist-row ${cls}"><span>${r}★</span><div class="dist-bar"><div class="dist-fill" style="width:${maxd?c/maxd*100:0}%"></div></div><span class="dist-c">${c}</span></div>`;
  }).join('');

  const SE = s.seasons[season];
  const seasonLabel = season==='summer' ? '여름(7–8월)' : '겨울(12–1월)';
  document.getElementById('seasonMeta').innerHTML = `${seasonLabel} 평균 평점 <b>${SE.avg.toFixed(2)} / 5.0</b> · 리뷰 <b>${SE.n_text}건</b> (전체 대비 ${SE.n_rated && O.n_rated ? pct1(SE.n_rated/O.n_rated*100):'0.0'}%)`;

  const {pos, neg, total, sums} = buildLists(SE.counts, SE.size_breakdown);
  const st = (sums.pos+sums.neg) || 1;
  const pp = trunc(sums.pos/st*100), pn = trunc(sums.neg/st*100);
  document.getElementById('senti').innerHTML = `
    <span class="lab"><i class="dot p"></i>긍정 <b>${pp}%</b></span>
    <span class="lab"><i class="dot n"></i>부정 <b>${pn}%</b></span>
    <div class="bar"><div class="sp" style="width:${sums.pos/st*100}%"></div><div class="sn" style="width:${sums.neg/st*100}%"></div></div>
    <span class="tot">전체 언급 ${st.toLocaleString()}건 (긍정 ${sums.pos}·부정 ${sums.neg})</span>
  `;
  document.getElementById('content').innerHTML = `
    <div class="charts">
      <div class="card accpos"><h3>만족점 — 주요 긍정 키워드</h3><div class="csub">${seasonLabel} · 효능·사용감 기준 언급량 순위</div>${chartHTML(pos)}</div>
      <div class="card accneg"><h3>불만족점 — 주요 부정 키워드</h3><div class="csub">${seasonLabel} · 부작용·unmet needs 포함 언급량 순위</div>${chartHTML(neg)}</div>
    </div>
  `;
}
document.getElementById('foot').innerHTML = 'VOC 키워드 대시보드 · 리뷰 텍스트 기반 규칙 분류 · 백분율 = 키워드 언급 ÷ 해당 구간 전체 언급(절삭) · 계절 구분 = 리뷰 작성월 기준(7–8월/12–1월)';
render();
</script>
