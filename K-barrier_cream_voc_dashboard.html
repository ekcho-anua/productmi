ften, cause it does feel very heavy during the hot heat in summer. I may buy the largest size they sell, once I finish using the bottle i brought."}], "other_condition_trigger": [{"rating": 4, "date": "2026-07-11", "season": "summer", "html": "Hydrating. <strong>I got this to help with my toddler&#x27;s eczema</strong> after reading a few positive reviews; however, it didn&#x27;t do anything so I&#x27;m now using it on my face to help reset my barrier after facial/laser treatments. It is hydrating and feels thick but does absorb fairly well. I want to say it&#x27;s helped but it&#x27;s also no magical lifesaver. It reminds me of the Avene brand except Avene absorbs better and works just as well if not better imho. Would not buy again but worth trying for anyone out there wondering."}, {"rating": 1, "date": "2024-03-29", "season": "other", "html": "contains soybean and canola oil -- not great for people with these allergies!. <strong>I initially purchased this for my daughter who has eczema</strong>. Over the years she has developed allergies to all her previous lotions, so I thought she could try this one, since it was fragrance free and for sensitive skin. However, when I got the package today, I read the ingredients before giving it to her (as I do for everything), and there was a sticker listing the ingredients translated from Korean (something I couldn&#x27;t find before purchasing, otherwise I would not have purchased it!) and there were two ingredients listed -- canola oil and soybean oil. My daughter happens to be allergic to both these things, and using this without reading the ingredients would have sent her to the hospital. I hope in the future this company will prominently list their ingredients so as not to put anyone in danger, as people who use these types of lotion generally have other allergies."}, {"rating": 3, "date": "2024-01-07", "season": "winter", "html": "Sensitive skin review !!. I’ve tried a handful of moisturizers but <strong>due to my eczema and psoriasis on my face</strong> (extremely dry and sensitive skin) none really do the job like how my soon jung moisturizer does. I saw everyone swear up and down on this specific cream claiming it was lightweight but super hydrating. I gave it multiple chances for weeks at a time, but I noticed my skin soaked it up within an hour &amp; was left dry. The ceramides didn’t really do anything special to my skin, if anything my redness got more red. It didn’t break me out thankfully but I can see people with combination to oily skin having this moisturizer &amp; falling in love with it. No scent and a pretty hefty amount for the price!"}, {"rating": 5, "date": "2026-07-07", "season": "summer", "html": "Works Amazingly!. I have dishydrodic eczema on my hands. It itches, its inflammation, constant open skin, its super dry in spots while hydrated on other spots. My hands are beyond destrpyed at times. Due to the condition of my hands when breakouts happen, Ibused first aid lotion. I would rank it 6/10. <strong>By chance I purchased this lotion in a hope that it would heal my skin</strong>. It healed my fingers to 95% in 5 days. At day 2 I seen a complete turn around. My skin did not hurt or angry. This product has worked wonders on my hands. This will be my new go to for skin repair."}, {"rating": 5, "date": "2026-07-07", "season": "summer", "html": "great product. <strong>I bought this for my son&#x27;s severe eczema</strong>. It helped him when he put it on, but complained that it made his skin itch more, and stopped using it. In an effort not to waste it, I started using it on my hands and face. It has made my skin so soft! It&#x27;s not oily and goes on smoothly. Since it was one of the few creams that actually did help my son&#x27;s eczema, I will attempt to have him try it again."}, {"rating": 5, "date": "2026-07-14", "season": "summer", "html": "Must buy!. I can’t say enough about this cream. My boss told me about it. <strong>Cause I was having some skin irritation like skin psoriasis</strong> and nothing has helped with the itching but this cream. Tried many prescribed ointment and creams. While they do work they sometimes leave white patches behind or skin discoloration. This cream does NOT! This will always be a staple of mine."}], "dry_skin_driver": [{"rating": 5, "date": "2026-08-09", "season": "summer", "html": "Goodbye dry skin. <strong>I have purchased cream after cream trying to find the right fit for my dry skin</strong> until now. I have spent hundreds, thousands of dollars searching for a cream that has no smell and doesn’t make me sick. After just one night I see the difference and my skin actually absorbed the cream! Usually the cream sits on my face and nothing happens after it is washed off- my skin is back to dry as if I never used the cream. This morning I woke up to smooth, hydrated skin on my face. Even my makeup looked amazing! I recommend this cream to those sensitive to smells and with dry skin."}, {"rating": 1, "date": "2024-12-11", "season": "winter", "html": "BUYER BEWARE: PORE CLOGGING. After almost 2 months of nightly use, this product unfortunately was the culprit for my acne. I’m in my mid-30s, have combination (more on the dry side) skin. Past history of Accutane due to cystic acne. <strong>I was in the market for a</strong> “barrier” cream moisturizer for my dry skin, especially in the winter. Haven’t had acne since early 20s. I thought my face was purging at first; however, cystic acne isn’t purging. It’s an indicator of inflammation (redness) and irritation. I also had white heads all over. It was on my forehead, cheeks, and chin. I stopped using it and my face hasn’t had any new breakouts. Unfortunately, I’m dealing with scarring from the acne. Buyer beware, it can clog pores."}, {"rating": 5, "date": "2026-07-25", "season": "summer", "html": "Loving it :). So I got this today and I can already tell that it’s a winner , <strong>I have very very dry skin on my face and I wanted to find something that could help with that</strong>. Hopefully it helps with my red marks around my chin I’ve been dealing with. I love Korean skin care products too so I would definitely try this out if your curious about it … oh and a little goes a long way and it’s a thick cream ! I know once winter comes I’m going to be reordering this stuff"}, {"rating": 2, "date": "2024-07-27", "season": "summer", "html": "Was expecting more. <strong>I suffer from very dry skin on my nose</strong> and in some areas of my face. I read the reviews and was hopeful that this would help keep my skin hydrated and looking good. Well, it didn’t happen. The lotion doesn’t feel creamy and honestly does nothing for combination skin or dry skin."}, {"rating": 5, "date": "2026-07-08", "season": "summer", "html": "Thick and nourishing. <strong>I am 73 and live in a very dry environment</strong>. I just moved from a humid location and none of my face creams seem to help my dry skin now. I read about this on social media under a &quot;non-toxic skin care&quot; category. They suggested another lotion that I happened to have to go on first then to put this cream on next. It has made such a difference in my old, dry face. I had never heard of this brand before but so glad to have it now. I have never had a loyalty to any particular product but this is one I will use for the rest of my life. It is that good"}], "redness_rosacea": [], "social_recommendation": [{"rating": 5, "date": "2026-08-24", "season": "summer", "html": "Nice and hydrating. Loving this cream so far. It feels thick and substantial at first and then melts into your skin and absorbs. Ai <strong>recommended it to me</strong> for moisture barrier repair and it’s been good for that. And doesn’t affect my makeup application. I will buy again."}, {"rating": 5, "date": "2026-07-08", "season": "summer", "html": "Thick and nourishing. I am 73 and live in a very dry environment. I just moved from a humid location and none of my face creams seem to help my dry skin now. I <strong>read about this on social media</strong> under a &quot;non-toxic skin care&quot; category. They suggested another lotion that I happened to have to go on first then to put this cream on next. It has made such a difference in my old, dry face. I had never heard of this brand before but so glad to have it now. I have never had a loyalty to any particular product but this is one I will use for the rest of my life. It is that good"}], "ingredient_based": [{"rating": 1, "date": "2024-03-29", "season": "other", "html": "contains soybean and canola oil -- not great for people with these allergies!. I initially purchased this for my daughter who has eczema. Over the years she has developed allergies to all her previous lotions, so I thought she could try this one, <strong>since it was fragrance free</strong> and for sensitive skin. However, when I got the package today, I read the ingredients before giving it to her (as I do for everything), and there was a sticker listing the ingredients translated from Korean (something I couldn&#x27;t find before purchasing, otherwise I would not have purchased it!) and there were two ingredients listed -- canola oil and soybean oil. My daughter happens to be allergic to both these things, and using this without reading the ingredients would have sent her to the hospital. I hope in the future this company will prominently list their ingredients so as not to put anyone in danger, as people who use these types of lotion generally have other allergies."}], "kbeauty_preference": [{"rating": 2, "date": "2026-07-13", "season": "summer", "html": "Good value but leaves you sticky. I was <strong>recommended this in a korean skincare group</strong> when I was looking into options other than aestura. Because it&#x27;s expensive for a small amount. It&#x27;s the same price as this big jar. However I&#x27;m not a fan. I used it for the first time at the end of my routine like I usually do. I finished 2 hours ago and my skin still feels sticky instead of moisturized and I&#x27;m so sad about that. It is thick and creamy and no scent which is great. Good price for the size. Im just not a fan of the overall result. I have no choice but to finish it though."}, {"rating": 5, "date": "2026-07-25", "season": "summer", "html": "Loving it :). So I got this today and I can already tell that it’s a winner , I have very very dry skin on my face and I wanted to find something that could help with that. Hopefully it helps with my red marks around my chin I’ve been dealing with. I <strong>love Korean skin care</strong> products too so I would definitely try this out if your curious about it … oh and a little goes a long way and it’s a thick cream ! I know once winter comes I’m going to be reordering this stuff"}, {"rating": 1, "date": "2025-12-12", "season": "winter", "html": "Disappointing for dry, aging skin. I really wanted to love the Illiyoon Ceramide Ato Concentrate Cream. I have dry, aging skin and purchased this after seeing so many glowing reviews, especially within the <strong>K-beauty space</strong> (which I usually have great luck with). Unfortunately, this cream was simply awful for my skin. After about a month of consistent use, my skin became increasingly dry and noticeably more wrinkled. Instead of strengthening my barrier or improving hydration, it seemed to actively make my skin worse. I can’t pinpoint exactly why it reacted this way on me, but the change was undeniable. I stuck with it for about six weeks hoping my skin would adjust, but ultimately had to stop. Once I switched back to my La Roche-Posay moisturizer and layered with a barrier cream, my skin began to heal—becoming firmer, plumper, calmer, and far less stressed. This product may work well for others, but if your skin tends toward dryness or dehydration, I’d recommend approaching with caution or skipping it altogether. Sadly, this was not the ceramide cream my skin needed."}], "no_redness_improvement": [{"rating": 3, "date": "2020-07-16", "season": "summer", "html": "Not moisturzing enough. I agree with a few other reviewers who have stated that this cream isn&#x27;t moisturizing enough. I agree. I had to return for this reason. I also didn&#x27;t find this cream very soothing. It <strong>didn&#x27;t help to reduce redness</strong> or irritation."}], "no_effect_general": [{"rating": 3, "date": "2026-08-10", "season": "summer", "html": "Combination skin. Too heavy for my combination/sensitive skin. Love the texture and lack of fragrance but caused me to break out so <strong>not worth the</strong> hassle."}, {"rating": 3, "date": "2026-07-07", "season": "summer", "html": "Okay <strong>not worth the</strong> hype. Not as moisturizing"}, {"rating": 4, "date": "2026-07-08", "season": "summer", "html": "Good but <strong>not worth the</strong> price. It&#x27;s is a nice moisturizer but really not worth the money. I feel like Eucerin is about the same as this one and definitely a better price. I bought it during prime days just to try it but personally i don&#x27;t think its worth all the hype on social media."}, {"rating": 2, "date": "2026-05-16", "season": "other", "html": "<strong>Didn&#x27;t work</strong> for me. Not very moisturizing and didn&#x27;t help my hand eczema at all"}, {"rating": 3, "date": "2026-04-12", "season": "other", "html": "<strong>Not worth the</strong> hype or the price tag. Honestly this is a lightweight and non-greasy moisturizer but at the end of the day it&#x27;s just not worth the price, it doesn&#x27;t make my skin feel any different than an off-branded face moisturizer. I think this product has been overhyped especially considering it&#x27;s Korean skin care but CeraVe is more moisturizing and for a comparable price, La Roche-posay is much better quality"}, {"rating": 2, "date": "2025-03-02", "season": "other", "html": "Ok, <strong>not worth it</strong>. Wanted to give this a try since I&#x27;ve been loving a few different Korean skin care lines lately, and I have sensitive skin, but I didn&#x27;t think it was really worth it. The cream is a little thicker than the normal lotion I use with Aveeno, but didn&#x27;t notice much a difference enough to switch over."}, {"rating": 1, "date": "2026-07-15", "season": "summer", "html": "<strong>Not worth the</strong> hype. This moisturizer just sits on my skin I don’t like it"}, {"rating": 1, "date": "2026-04-12", "season": "other", "html": "Nothing special. Thick and really didn’t notice anything special after using it daily. Sent back before the 30 day mark. <strong>Waste of money</strong>"}, {"rating": 1, "date": "2025-07-09", "season": "summer", "html": "Nahhh. For dry skin.. absolutely was <strong>not worth the</strong> hype. It first feels luxuriously moisturizing. Dries down to a dry residue film. Felt thick and dry around my eyes. Pastey! That’s how it feels! Used on my body instead, broke me out on my chest and back. No no no… glow for five minutes, enough for an influencer to influence you, yeah. But trash… The photo with the dry looking hand, is what it actually dries down to…"}, {"rating": 1, "date": "2020-07-20", "season": "summer", "html": "Do Not Recommend - Bad Breakout. I used this cream on my face for a week and my skin broke out in cystic acne. I haven’t had that kind of bad acne in years. I stopped using it to see what would happen and my skin went back to normal. I don’t know what ingredients were aggravating, I use a lot of products but nothing like this has ever happened. <strong>Waste of money</strong> and a horrible product."}], "texture_heavy_greasy": [{"rating": 3, "date": "2026-08-10", "season": "summer", "html": "Combination skin. <strong>Too heavy</strong> for my combination/sensitive skin. Love the texture and lack of fragrance but caused me to break out so not worth the hassle."}, {"rating": 3, "date": "2026-05-09", "season": "other", "html": "Wanted it more <strong>greasy</strong>.. It’s OK. I do not feel any ceramide beads, as I expected. This is not as greasy as I wanted. It doesn’t irritate however and applies easily. It does not leave a shine. I like the flat container. I got travel size, under 3 oz. No scent. Prolly wouldn’t buy again, but I will use this one til finished."}, {"rating": 1, "date": "2026-04-21", "season": "other", "html": "<strong>Greasy</strong> feel + no moisture + irritation + extreme dryness, breakout patches = extremely poor product.. I&#x27;m not sure how this product got such glowing reviews. I really wanted to love it, kept thinking if I just gave it a few more days something would change. The product feels very heavy, greasy as if it&#x27;s just sitting on top of the skin, not getting absorbed whatsoever. Even worse, after a couple of weeks I started to notice I was now getting very dry, irritated and flaky patches around the edges of my face, something I have never had in my life as I tend to be oily around my hairline. Honestly I am so disappointed with this product I feel like Amazon shouldn&#x27;t carry it, it&#x27;s bordering on toxic. According to some other reviews it contains canola oil and other harmful cancer causing ingredients as well."}, {"rating": 1, "date": "2026-06-28", "season": "other", "html": "Didn’t absorb well. Wanted to love this product I finally purchased it during prime day however I found the product to be sticky on my skin and even after and entire night it did not absorb into my skin as I would’ve liked it to. I went back to my trusty Vanicream, this just didn’t absorb well and felt almost <strong>greasy</strong>. Returned."}, {"rating": 1, "date": "2026-06-29", "season": "other", "html": "Read 1 Star Reviews. STICKY, <strong>GREASY</strong>, RASHES. I bought one for someone else before, I just bought one for myself and tried for first time. It gives me RASHES, VERY STICKY SKIN GREASY LOOKING SKIN🤮🤮 JUST READ “ONE STAR REVIEWS” BEFORE PURCHASING. THEY ARE ALL TRUE!"}, {"rating": 5, "date": "2026-07-14", "season": "summer", "html": "Chronically dehydrated skin helper!. Note for people with hypothyroidism and have chronically dehydrated skin! Ive found this lotion to be long lasting in leaving my skin feeling moisturized. I take daily doses of supportive supplements and try to drink enough water but this lotion helps lock everything in. It feels amazing! I buy the giant tub which is a great value. Doesn&#x27;t leave my skin <strong>greasy</strong>, only moisturized. The smaller tubes are great on the go too (especially frequent hand washers). I use for face and body routine! I rarely leave ratings but this product has helped me in so many ways. Apply fresh out of the shower and/or fresh face washing!"}, {"rating": 5, "date": "2026-08-01", "season": "summer", "html": "Excellent Quality for a Reasonable Price. A little goes a long way with this facial cream. It is very absorbent and feels great, not heavy or <strong>greasy</strong>. It is best applied to slightly damp skin and locks in moisture. It is great for sensitive skin and does not cause irritation or breakouts. It did not aggravate my rosacea. For the quality of the product, it is an excellent price. I highly recommend it!"}, {"rating": 5, "date": "2026-08-01", "season": "summer", "html": "Great product!!. I have very dry skin that can get flaky, tight, red, irritated, etc. and I have had none of that since using this. It soaks in quickly and easily. It is not <strong>greasy</strong>. It does not make my face shiny. Several friends have commented that my skin looks better while I&#x27;ve been using this. The price is great also. I have paid SO much more for less product that does nothing. This is a bargain! I will say that I do live in a very dry area that also can be very cold (Colorado) so I will see how it goes over winter when my skin really gets bad. I recommend this to others with dry skin but I actually think the formula, the texture and how it goes on will work for any skin type."}, {"rating": 5, "date": "2026-07-10", "season": "summer", "html": "Creamy, smoothing, all day moisture. I was influenced to try this product months ago and now I&#x27;m on my 2nd bottle. The product goes on easily, isn&#x27;t <strong>greasy</strong>, and is absorbed into the skin very well. By the end of the day, my skin looks amazing and is so soft and smooth, even in the dry climate I live in. I don&#x27;t wash my face every day (don&#x27;t come at me), so the container lasted much longer than I thought it would. I&#x27;m looking forward to trying some of their other products as well."}, {"rating": 5, "date": "2026-07-19", "season": "summer", "html": "Already purchased a 2nd tube!. This is my 2nd tube, however still on my 1st one - Just wanted to take advantage of prime day sale because so far, I love this stuff! It’s more affordable than the Biossance Omega Repair Cream I usually use and it seems to work! I’m 45 yrs old, Filipino/Puerto Rican, and tend to have drier skin. I’m starting to use tretinoin, which can make my face even drier while I figure out how many nights a week my face can handle it. I use every night after corsRx snail mucin and after tretinoin (2x/wk for now). I also use some mornings when I feel drier. Other mornings I use a slightly lighter weight moisturizer or the Drmtlgy tinted moisturizer with spf. I wouldn’t say this stuff is light weight but I don’t need a ton to feel moisturized, so it lasts awhile. It’s not <strong>greasy</strong> and doesn’t seem to clog pores. In the photos, tube on the left is the 1st I purchased &amp; on right is the new one. I’ll update later with the date I purchased the 1st tube. Sorry so long but hope this review helps!"}, {"rating": 4, "date": "2026-07-30", "season": "summer", "html": "A little heavy, but great otherwise!. A little bit thicker, but tbh I love it. I have fairly sensitive skin and it’s been doing a great job. I have combo-oily skin, and after 4 hours I have to blot, but after that I should b fine for another 4! I use a pea size amount every morning paired w a milky toner! I will say it’s moisturizing but not <strong>greasy</strong>, super simple and straight forward! Makes my skin glow and supports my barrier!"}, {"rating": 4, "date": "2026-08-22", "season": "summer", "html": "Ceramide Ato Cream. Thick and creamy but not too <strong>sticky</strong>"}, {"rating": 4, "date": "2026-07-24", "season": "summer", "html": "Quality Moisturizer. Really like this moisturizer -- silky application and lightweight without stink fragrance or looking <strong>greasy</strong> or oily. No shine, just hydrated and supple skin. I use it every morning and night, plus rhe price is right!!!!"}, {"rating": 2, "date": "2026-07-13", "season": "summer", "html": "Good value but leaves you <strong>sticky</strong>. I was recommended this in a korean skincare group when I was looking into options other than aestura. Because it&#x27;s expensive for a small amount. It&#x27;s the same price as this big jar. However I&#x27;m not a fan. I used it for the first time at the end of my routine like I usually do. I finished 2 hours ago and my skin still feels sticky instead of moisturized and I&#x27;m so sad about that. It is thick and creamy and no scent which is great. Good price for the size. Im just not a fan of the overall result. I have no choice but to finish it though."}, {"rating": 2, "date": "2026-07-17", "season": "summer", "html": "I din&#x27;t like it. I first bought it and I really don&#x27;t feel it&#x27;s to thick for my skin type, as I don&#x27;t absorb it quickly and felt it was <strong>too heavy</strong> for me."}, {"rating": 2, "date": "2026-03-19", "season": "other", "html": "Caused bumpy dry skin. I liked this at first, but after a few weeks of using I noticed my face was getting very dry and flakey and with a bumpy texture. Also wasn&#x27;t a fan of the <strong>sticky</strong> feeling it left. After switching to a different lotion my face is much better. Disappointed since everyone said this was the hg of face lotions.. 2 stars because maybe it&#x27;s just my skin type but I think like most viral products they start with a good formula and then switch to cheaper ingredients as more people start buying since the reviews started out good then get worse with time!"}, {"rating": 2, "date": "2026-05-07", "season": "other", "html": "Not what I expected…. Received it today and could not wait to use it. Now I applied it after a shower on my arms, legs as well as my face. It feels so <strong>sticky</strong> and it has been an hour. Not for me. Will use on hands and feet and not purchase again. Back to my Cerave cream."}, {"rating": 2, "date": "2026-04-17", "season": "other", "html": "When dry it feels very <strong>tacky</strong> and I&#x27;m unable to wear it under makeup.. It is much thicker than I thought it would be. But my dissatisfaction is it leaves my skin very tacky feeling when I have only put on a small amount. I have washed my face at the end of the day and applied it before going to bed. In the morning it is still tacky and I can&#x27;t put makeup on until I wash it off first."}, {"rating": 2, "date": "2026-01-17", "season": "winter", "html": "Worked great for my body, but not for my face. I used this cream during a time when my skin was breaking out and my skin barrier was damaged, and unfortunately it made my facial skin worse. It felt <strong>too heavy</strong> for my face during that period and didn’t agree with my skin. I didn’t want to waste it, so I started using it on my body instead, and it actually worked amazing there. It was very moisturizing, soothing, and helped with dryness without irritation. Overall, I wouldn’t personally use this on my face again, but it’s a great body moisturizer, especially if you need something rich and nourishing."}, {"rating": 2, "date": "2026-05-17", "season": "other", "html": "<strong>Too heavy</strong> for my skin. I was not really a fan of this product. It left my face feeling like there was a heavy film on it. It blended fine just did not feel smooth or dissolved int the skin."}, {"rating": 3, "date": "2026-04-12", "season": "other", "html": "Not worth the hype or the price tag. Honestly this is a lightweight and non-<strong>greasy</strong> moisturizer but at the end of the day it&#x27;s just not worth the price, it doesn&#x27;t make my skin feel any different than an off-branded face moisturizer. I think this product has been overhyped especially considering it&#x27;s Korean skin care but CeraVe is more moisturizing and for a comparable price, La Roche-posay is much better quality"}, {"rating": 3, "date": "2026-04-07", "season": "other", "html": "Good for dry skin only. Good for ointment type moisturization.. This is a creamy textured cream. It covers the dry skin. It did not create any itching right away. The skin feels moisture after apply. It is non <strong>greasy</strong>. Absorption is excellent. It acts like a dry ointment with absolute absorption. However, it has created white bumpy heads on my jawline and chick. It is unexpected."}, {"rating": 1, "date": "2026-03-13", "season": "other", "html": "Doesn’t work for me. This cream is somehow making my face feel <strong>greasy</strong> and dry at the same time. I was looking for a replacement to my expensive face cream. This had a lot of good reviews, so I decided to give it a try. I’ve been using this cream for months and it just dries my skin."}, {"rating": 5, "date": "2026-08-18", "season": "summer", "html": "Favorite Moisterizer. This is probably the best moisterizer that I&#x27;ve ever used before. I feel like it&#x27;s the only one that is actually hydrates my skin, especially in the wintertime when my face gets so dry and peels. This cream really helpde with that. It is fragrence-free like it states it is, and a little bit does go a long way. It&#x27;s a slightly thicker consistency when it comes out of the bottle, but when you apply it on your skin, it doesn&#x27;t feel <strong>greasy</strong> or heavy at all. It just soaks right into the skin and hydrates it so well."}, {"rating": 5, "date": "2026-08-26", "season": "summer", "html": "10/10 lotion. 10/10 love it, I had to level up to the big bottle because the smaller one went too fast. It absorbs really well in the skin, not <strong>greasy</strong> at all. It’s not creamy but it’s not thick either. I was experiencing really bad dry skin and this lotion healed me quickly."}, {"rating": 4, "date": "2026-07-10", "season": "summer", "html": "Pretty good. I like it. I wouldn’t call it heavy moisturizer, but it seems to stay on, but it makes my face <strong>sticky</strong>."}, {"rating": 1, "date": "2026-05-26", "season": "other", "html": "Nothing Special. Nothing great about this product at all. Feels <strong>greasy</strong> and gave me an ache breakout when I usually don’t have issues with ache at all."}, {"rating": 1, "date": "2026-03-19", "season": "other", "html": "Caused redness and irritation!. It’s irritating and <strong>sticky</strong>. Barely even hydrating. Not suitable at all for dry or sensitive skin. Especially the sensitive part. The AESTURA Atobarrier moisturizer is a much better choice. I should’ve never tried this an alternative to it."}, {"rating": 3, "date": "2020-07-26", "season": "summer", "html": "Big value if on a budget, but not cosmetically elegant. First, I was amazed by how big the tube I received was for this price-- it&#x27;s massive and will definitely last you a long time! I was looking for a replacement for my CeraVe Daily Moisturizing Lotion, since they&#x27;ve reformulated and it no longer works with me skin. I found this cream to be heavy but not very moisturizing. It feels like there is a layer on my skin, so I only use it at night since its a bit suffocating. The texture is the worse-- gritty from the encapsulated ceramides and thick and tacky. It legit feels like I&#x27;m rubbing elmer&#x27;s glue on my face (and my eyebrows get all glued down in weird ways, with the little capsules stuck in them.. just gross). I find my skin sticking to my pillow case at night, even when I&#x27;ve tried to move my skincare evening routine to a few hours before bed time. Its like the stickiness never goes away! It dries matte and then is <strong>greasy</strong> in the mornings.. never a nice &quot;glowy, dewey,&quot; or &quot;glass-like&quot; finish like I&#x27;ve read others mention. I found this strange since most of the reviews say the opposite about this moisturizer, so maybe my skin is just different. I&#x27;m still experimenting with different ways to use this to get it to work better for me (ex. apply to wet skin, before other moisturizers, after other moisturizers, increase dry times between layering steps, using it just on its own, day time vs night time, less product vs more product, etc.) because its such a large tube at such a low cost that I want it to work for me. Also it doesn&#x27;t irritate my sensitive skin and hasn&#x27;t caused any breakouts, so that gives me motivation to keep trying to make it work. For reference, I have dehydrated combination skin. Prone to blackheads in the t-zone and hormonal acne in the U zone So far I&#x27;ve been using this for about ten days. I will update this review if things change in the future."}, {"rating": 3, "date": "2025-12-17", "season": "winter", "html": "Heavy Moisturizer, Better for Mature or Ultra-Dry Skin. I bought this to help get my skin through cold weather because I saw that people were recommending it online. I think it’s kinda mid overall. For me, I think it caused some closed comedones because it was <strong>too heavy</strong> for me. For reference, I am 30 yrs old, assigned female at birth, sensitive combination skin."}, {"rating": 5, "date": "2026-07-23", "season": "summer", "html": "Love this cream!!. This cream is amazing!!! I bought it as a moisturizer for my face but ended up using it on my legs, where I had some red spots on my shins. After using this on my legs for about 5 days, the red spots slowly disappeared. I am almost done with my first bottle, but already ordered another. I have also used it on my face but haven’t used it consistently so I can’t see any benefits yet. I did notice when I used it on my face, it is a little <strong>greasy</strong> but is fine after you put foundation and blush. I would highly recommend this cream!!"}, {"rating": 5, "date": "2026-08-29", "season": "summer", "html": "Highly recommend. I have pretty sensitive skin so I’m always a bit weary to try new lotions, but this one has been amazing. It’s gentle and very hydrating, but doesn’t leave my face feeling <strong>sticky</strong>."}, {"rating": 5, "date": "2026-08-14", "season": "summer", "html": "Very hydrating.. This is amazing stuff. Hydrates my skin without making my rosacea flair up. I first bought a 2.5 oz bottle to try and then I bought the big jar. It holds a lot! Just be careful, I figured out a little goes a long way. If I use too much, my skin feels a bit <strong>sticky</strong>. But overall, I love it!"}, {"rating": 5, "date": "2026-07-26", "season": "summer", "html": "Love this cream. I&#x27;ve been using Illiyoon Ceramide Ato Concentrate Cream for about a year after seeing it recommended, and I&#x27;m so glad I decided to try it. I was looking for a moisturizer to use as part of my nightly skincare routine, and this one leaves my skin feeling soft, hydrated, and comfortable without feeling heavy or <strong>greasy</strong>. Even though I&#x27;ve recently started alternating it with another nighttime product every other night, this cream is still a permanent part of my routine because of how healthy and moisturized it keeps my skin feeling. I definitely plan to keep repurchasing it."}, {"rating": 4, "date": "2026-05-02", "season": "other", "html": "Deeply Hydrating Cream That Works Well for Sensitive Skin. This is a rich, soothing moisturizer, non-<strong>greasy</strong> that really focuses on long lasting hydration. It has a thick but smooth texture that spreads easily and absorbs better than expected for something so nourishing. It is especially helpful for dry or sensitive skin, helping to calm irritation while strengthening the skin barrier over time. The hydration feels steady and lasting rather than temporary, which makes it a good option for both daily use and more intensive repair when skin feels dehydrated. Overall, this is a dependable moisturizer that prioritizes comfort and barrier support. It is not lightweight, but it is very effective for keeping skin soft, balanced, and well hydrated."}, {"rating": 4, "date": "2026-06-10", "season": "other", "html": "<strong>Sticky</strong>. I really wanted to love this beautiful cream. But it stayed sticky it seemed like for hours after application. Im a texture freak. So no. I&#x27;ll pass it along.."}, {"rating": 4, "date": "2026-06-19", "season": "other", "html": "Satisfied!. I REALLY like this product, feels nice and not <strong>greasy</strong>"}, {"rating": 4, "date": "2026-06-14", "season": "other", "html": "Feels Great. This feels great, extremely moisturizing without being <strong>greasy</strong>, however I personally broke-out from it."}, {"rating": 1, "date": "2026-04-16", "season": "other", "html": "Not really a face cream. This is awful. Leaves a <strong>tacky</strong> feel on the skin. I will use as a hand ream but not on the face. Won’t buy again."}, {"rating": 2, "date": "2024-06-26", "season": "other", "html": "Acne inducing but wrinkle reducing. I had to stop using this product because it was making me have acne break outs. However, I will say that it gave me a nice glow, it felt nice, not <strong>greasy</strong> or heavy. Maybe a like sticky in the first few seconds of applying it. But it appeared to reduce any fine lines I had"}, {"rating": 2, "date": "2024-12-11", "season": "winter", "html": "The product is <strong>sticky</strong>. If I use the product by itself, if it&#x27;s very sticky. If I used it with another product as the second layer, it was smooth. Honestly, I feel like it did nothing for my skin."}, {"rating": 2, "date": "2024-07-26", "season": "summer", "html": "Smells….. Saw so many reviews that this doesn’t smell, so i got it. it has a strong chocolate smell to me which i’m just not a fan of…. pretty heavy moisturizer and leaves my face a bit <strong>sticky</strong>"}, {"rating": 3, "date": "2024-03-29", "season": "other", "html": "<strong>Too heavy</strong> for acne prone skin. I read the other reviews regarding acne but my quest for Korean glass skin quieted them in my mind. Unfortunately they were completely right. Two days after using the cream in the evening during my PM routine my skin started to break out. I’ve dealt with acne in my teens and 20s but haven’t had it in the last 10-15 years. Small white head pimples appeared and continued to pop up throughout the day. So this is a NO for me. Not great for acne prone skin. I will add that it’s found a new life as a rich hand cream for me. I suffer from dry cuticles and this cream is fantastic for a night rub. It doesn’t soak in quickly but it is deeply moisturizing. Overall-not great for a new prone skin but nice for dry body skin."}, {"rating": 3, "date": "2024-03-07", "season": "other", "html": "nice... but not for my skin type. tldr: has ingredients that sit on my skin instead of absorb into it; broke out as a result edit: i have now found out cetyl ethylhexanoate was the cause of my breakouts! i have dehydrated oily sensitive skin. i saw people say this moisturizer is gentle and moisturizing on tiktok and i decided i&#x27;d give it a try. i like the cooling effect it gives and it makes my skin feel really soft. but after a while i realized it leaves a <strong>greasy</strong> feeling to my face and i started breaking out. i researched the ingredients and i found it has Pentaerythrityl Tetraisostearate and Cetyl Ethylhexanoate which i&#x27;m pretty sure were the causes to my breakout. maybe the other versions of this moisturizer don&#x27;t have this but i don&#x27;t want to take my chances and buy again, i&#x27;m using this for my body instead :)"}, {"rating": 5, "date": "2026-08-11", "season": "summer", "html": "Rosacea dry skin loves!. My rosacea dry skin loves this!!! It’s so thick but doesn’t take forever to rub in. It takes a few seconds which I love. It makes my skin feel so hydrated and it doesn’t leave me <strong>greasy</strong> feeling. There is no scent which is nice too. Fragrance-free. It lasts a long time and a little goes a long way."}, {"rating": 5, "date": "2026-08-23", "season": "summer", "html": "Delicious butter like body cream. This is my third time buying this cream. It’s luscious and soft + thick and not <strong>sticky</strong>. It’s such a great cream and I wonder if they make face cream too!"}, {"rating": 5, "date": "2026-07-29", "season": "summer", "html": "Deep Hydration Without Feeling <strong>Greasy</strong>. This has become one of my favorite moisturizers. It&#x27;s rich enough to keep my skin feeling hydrated but doesn&#x27;t leave a heavy or greasy feeling. It absorbs well, layers nicely with the rest of my skincare routine, and leaves my skin feeling soft and comfortable. A little goes a long way, so the tube lasts longer than expected. If you have dry or sensitive skin and want a reliable everyday moisturizer, I definitely recommend giving this one a try."}, {"rating": 5, "date": "2026-08-13", "season": "summer", "html": "Great for after tretinoin. Loving this moisturizer so far. I’ve been wanting to try this particular one for a while as I’ve heard it is great at night over tretinoin and maintaining the skin barrier. I like that it’s thicker but not <strong>too heavy</strong> on the skin."}, {"rating": 5, "date": "2026-08-01", "season": "summer", "html": "Sensitive skin approved. I tried this for the first time 4 months ago on a trial run as i have sensitive skin and not a lot of things are compatible with my skin. I use this every day as my morning AND night moisturizer. There is no fragrance. It leaves my skin glowing and hydrated without a <strong>greasy</strong> feeling. If you have sensitive skin i would highly recommend trying this product."}, {"rating": 4, "date": "2026-04-04", "season": "other", "html": "Caused slight irritation. =(. I loved the feel of this moisturizer and how gentle it appeared to be. But unfortunately, it caused slight irritation under my eyes and on my cheeks. I have combination skin that is very sensitive, so it could just be from that. Very rarely do I come across a moisturizer that causes irritation. It is usually caused from a cleanser. This product had no smell and was not <strong>greasy</strong> or heavy. It absorbed quickly and didn&#x27;t cause my pores to clog. It did take care of the dry skin very well. I wanted to love this product since a lot of people love it. I&#x27;m sure it will be perfect for most people. Thank you."}, {"rating": 4, "date": "2026-06-15", "season": "other", "html": ".. Overall good, though a bit <strong>too rich</strong> for my skin."}, {"rating": 4, "date": "2026-06-11", "season": "other", "html": "Deffenitly Moisturizing!. Non-<strong>greasy</strong>, Fragrance- free, Light weight, and a pretty good amount for the price. I have combo skin and this is my holy graillllll &gt;,0,&lt;Definitely my go-to moisturizer"}, {"rating": 4, "date": "2026-04-25", "season": "other", "html": "Nice, but not the lotion for me.. I use the regular Ceramide ATO Lotion daily. I thought I’d try this as well. My observation is it’s <strong>sticky</strong>, a bit heavy and doesn’t seem like it absorbs into my skin as well as the regular lotion. I love the lack of fragrance. If this were the lotion for me, I think it would be worth the price."}, {"rating": 4, "date": "2026-05-13", "season": "other", "html": "Great for dry skin. Really moisturizing and gentle on sensitive skin. It leaves my skin soft without feeling <strong>greasy</strong>. Only reason not 5 stars is it can feel a little heavy sometimes, but overall really good cream."}, {"rating": 1, "date": "2026-05-27", "season": "other", "html": "-1. Garbage. Feels <strong>sticky</strong> on your face."}, {"rating": 2, "date": "2026-08-20", "season": "summer", "html": "<strong>Too heavy</strong>. Caused me acne"}, {"rating": 3, "date": "2023-10-29", "season": "other", "html": "Wanted to like this more than I did. I love the ingredients and originally thought it was a good size for the money. Unfortunately This lotion is extremely heavy on the skin and leaves a <strong>greasy</strong> feeling residue. It also goes really quickly. Not sure if the bottle was not full or what but it did not last long at all. No smell to this that I noticed which is what I was looking for. It’s not awful, but just a little too heavy and expensive."}, {"rating": 5, "date": "2026-08-24", "season": "summer", "html": "Great product for an affordable price. Very nice face cream that is not <strong>greasy</strong>. My son loved it so much I had to reorder. The price is affordable."}, {"rating": 5, "date": "2026-08-09", "season": "summer", "html": "Excellent hydration for sensitive skin. This moisturizer is fantastic for dry, sensitive skin. It absorbs quickly without feeling <strong>greasy</strong>, and my skin stays hydrated for hours. A little goes a long way, and there&#x27;s no irritation at all. Highly recommend for anyone with sensitive or dry skin!"}, {"rating": 5, "date": "2026-06-28", "season": "other", "html": "Seals everything so good. Took me a long time to find a cream that my skin needed. My skin has been damaged for over a decade and I had no idea. When I realized that I needed a cream that has the 3:1:1 ratio, I’ve watched a lot of videos and then I wanted to get the one from Aestura but it was too expensive while this one was half the price with same or if not more benefits. At first I thought it was <strong>too heavy</strong> because I had oily skin just to realize that I had combo skin but got oily because it was dehydrated and damaged. When I first applied this I was like “OH MAN” should’ve gotten that stuff earlier. I’m telling you this is all you need with a great serum underneath…"}, {"rating": 5, "date": "2026-05-08", "season": "other", "html": "A Korean&#x27;s Intense Allergy Season Remedy. I held off on purchasing this for a while - honestly thought it might just feel a bit... generic or &quot;whatever&quot; because of the price point. It&#x27;s been just over 1 month of using it multiple times daily. I felt like I was going through such a specific situation where I already have dry and combo/oily hormonal skin (comes with flakiness and redness) and allergy season, especially in dry Colorado has been absolutely brutal. My nose for the most part has looked like it had little shards of glass sticking out. Hard to exfoliate when it&#x27;s already so raw. There are many favorites for [Korean] skincare, but this is a really sensitive time for my skin, along with the intense sun here. My review comes with glorious sneezing and blowing my nose all day, already predisposed flaky skin. I&#x27;ve been applying this moisturizer very frequently, because yes, unfortunately regardless of product, any lotion comes off with vigorous nose blowing. I&#x27;d say at least 5 times throughout the day. It has been heavy enough to protect my skin in this sensitive spot, but not feel <strong>greasy</strong>. Clearly I cannot speak too much on longevity because I wipe it off unintentionally. While having searched for a long while for a bang-for-your-buck, but still good quality, luxury feeling moisturizer for allergy season, I have no regrets having pulled the trigger on this one. A tip for any, any facial skincare is to leave your face a little damp before application. For these throughout-the-day applications, I usually wet my hand a wee bit first. (+ At this time, I&#x27;m using the Haruharu Wonder Black Rice Moisture Airyfit Daily Sunscreen 1.69fl.oz alongside it because WEAR YOUR SUNSCREEN!!!)"}, {"rating": 3, "date": "2020-05-05", "season": "other", "html": "Just meh. I didn’t love this like a lot of people did. I found it to be <strong>greasy</strong>. I am now using it for my chest or hands but it’s too slippery and doesn’t really sink into skin. So bummed because I wanted to love it especially for the price. I’m sticking with Avène"}, {"rating": 3, "date": "2020-07-29", "season": "summer", "html": "I wanted to like it... I wanted to like this , I have sensitive acne prone combination skin. This was too oily / thick for me. It felt to <strong>greasy</strong> afterwards. So I now just use it for my neck or body. Still really thick though. Maybe better for dryer skin"}, {"rating": 4, "date": "2026-05-28", "season": "other", "html": "Love this cream. Goes on nice and smooth. Not <strong>greasy</strong>"}, {"rating": 4, "date": "2026-05-15", "season": "other", "html": "Great hydration. Excellent, my skin has never been so hydrated, non <strong>greasy</strong> I use it on my face slso"}, {"rating": 5, "date": "2026-08-26", "season": "summer", "html": "Good. It’s a good moisturizer not too <strong>greasy</strong> .It is perfect for sensitive skin"}, {"rating": 5, "date": "2026-08-23", "season": "summer", "html": "Penetrates my skin without <strong>greasy</strong> feel. Luxurious lotion! It’s non-greasy but rich. It penetrates and feeds my skin. I love it."}, {"rating": 4, "date": "2026-05-02", "season": "other", "html": "Not <strong>greasy</strong>. I like this cream. It leaves my face feeling good without a greasy feeling. I&#x27;ll keep trying it and might even purchase it again. :)"}, {"rating": 4, "date": "2026-05-17", "season": "other", "html": "Super price and immediate absorption. It really works non <strong>greasy</strong> and easy to apply"}, {"rating": 4, "date": "2026-03-30", "season": "other", "html": "Generally happy. Lovely non-<strong>greasy</strong> &amp; creamy moisturizer that is competitively priced for the size bottle (good value for dollar!). Absorbs easily and relatively lightweight. Only slight negative is a &quot;plastic&quot; smell to the cream. Not sure what&#x27;s the cause, but it&#x27;s there."}, {"rating": 3, "date": "2025-12-29", "season": "winter", "html": "Smell bad, everything else good.. Pros: Very moisturizing without being too heavy or <strong>greasy</strong>. Cons: Strong, unpleasant smell (much like self tanning lotion)."}, {"rating": 4, "date": "2026-01-24", "season": "winter", "html": "Great product. Not sticky and absorbs very quickly. One thing I hate about using moisturizer on my body is that my clothes stick to me for awhile but this doesn&#x27;t have any <strong>greasy</strong> feeling at all. Edit: I have to take one star off due to the 200ml tube with the small opening it making it impossible to squeeze out product at the half way mark. I&#x27;ll have to cut it open to get the remaining product."}, {"rating": 5, "date": "2026-08-04", "season": "summer", "html": "Favorite New Moisturizer. I LOVE this stuff!! It has definitely been a game changer for skin. It&#x27;s so soft and moisturized. The cream doesnt leave a <strong>sticky</strong> film or residue. I will definitely buy again."}, {"rating": 1, "date": "2025-02-15", "season": "other", "html": "Too <strong>sticky</strong>. Not hydrating and drys sticky. Not sure why its so hyped. Went in trash."}, {"rating": 4, "date": "2026-03-16", "season": "other", "html": "Longterm Hydrating. Doesn’t dry fast and feels hydrating for longer. Great to use for Night time. But feels way <strong>greasy</strong>."}, {"rating": 4, "date": "2026-03-13", "season": "other", "html": "Not <strong>greasy</strong> goes right into the skin absorbing very well. This lotion is ok it’s a little pricey not sure if I’ll buy it again"}, {"rating": 4, "date": "2026-02-28", "season": "other", "html": "Nice product. I like so far. It maybe a little <strong>too heavy</strong> in the humidity od SC summer. We will see."}, {"rating": 1, "date": "2022-03-17", "season": "other", "html": "<strong>too heavy</strong> cream. I will buy not again and not recommend it."}, {"rating": 5, "date": "2026-07-19", "season": "summer", "html": "Non-<strong>greasy</strong> moisturizing lotion. It’s genuinely good. I have dry skin but don’t like greasy and sticky lotions. This one absorbs quickly, is not greasy or sticky and keeps my dry legs and arms moisturized all day. I need to check how it works in winter. So far, I am very satisfied and would highly recommend."}, {"rating": 4, "date": "2024-11-12", "season": "other", "html": "Good beauty product. The Illiyoon Ceramide Ato Concentrate Cream is a fantastic choice for those with dry and sensitive skin looking for long-lasting hydration. The cream is thick yet absorbs surprisingly well, leaving skin soft and smooth without any <strong>greasy</strong> residue. I love that it’s gentle enough for use on both the face and body and is even safe for infants, making it versatile for families. The hydration really does last; my skin feels comfortable and well-moisturized throughout the day, and I&#x27;ve noticed my skin barrier feels stronger and less prone to irritation. The fact that it’s vegan and free from harsh additives is a huge plus, especially for sensitive skin. The only minor drawback is that it takes a little time to fully sink in, so it might not be ideal for a quick routine or those with very oily skin. Otherwise, this cream is an excellent choice for deep, lasting hydration and barrier repair!"}], "absorption_issue": [{"rating": 2, "date": "2024-09-24", "season": "other", "html": "Helps during dermatitis flares, but does not moisturize the skin. Been using this product for several months now. When I apply it, it takes FOREVER to soak in, and even after an hour or two it still feels like the moisturizer just <strong>sits on top of my skin</strong>. Also it smells like a plasticy chemical out of the tube? Fortunately that doesn’t linger. My biggest complaint is it just doesn’t not moisturize. Even when applied to different parts of my body it’s like a thin film that eventually rubs off on my clothes :("}, {"rating": 1, "date": "2026-07-15", "season": "summer", "html": "Not worth the hype. This moisturizer just <strong>sits on my skin</strong> I don’t like it"}], "scent_complaint": [{"rating": 1, "date": "2026-02-17", "season": "other", "html": "Didn’t like smell. Really <strong>smelled bad</strong> .. not sure if it was defective, expired or what. Won’t buy again."}, {"rating": 3, "date": "2025-12-29", "season": "winter", "html": "<strong>Smell bad</strong>, everything else good.. Pros: Very moisturizing without being too heavy or greasy. Cons: Strong, unpleasant smell (much like self tanning lotion)."}], "price_value_complaint": [{"rating": 4, "date": "2026-07-08", "season": "summer", "html": "Good but <strong>not worth the price</strong>. It&#x27;s is a nice moisturizer but really not worth the money. I feel like Eucerin is about the same as this one and definitely a better price. I bought it during prime days just to try it but personally i don&#x27;t think its worth all the hype on social media."}, {"rating": 2, "date": "2026-07-13", "season": "summer", "html": "Good value but leaves you sticky. I was recommended this in a korean skincare group when I was looking into options other than aestura. Because it&#x27;s <strong>expensive</strong> for a small amount. It&#x27;s the same price as this big jar. However I&#x27;m not a fan. I used it for the first time at the end of my routine like I usually do. I finished 2 hours ago and my skin still feels sticky instead of moisturized and I&#x27;m so sad about that. It is thick and creamy and no scent which is great. Good price for the size. Im just not a fan of the overall result. I have no choice but to finish it though."}, {"rating": 2, "date": "2026-08-25", "season": "summer", "html": "Changed Product Formulation. They changed the formulation! Product is much thinner than previously and more <strong>expensive</strong>! I’m annoyed because now I have to find a new moisturizer."}, {"rating": 3, "date": "2026-04-12", "season": "other", "html": "Not worth the hype or the price tag. Honestly this is a lightweight and non-greasy moisturizer but at the end of the day it&#x27;s just <strong>not worth the price</strong>, it doesn&#x27;t make my skin feel any different than an off-branded face moisturizer. I think this product has been overhyped especially considering it&#x27;s Korean skin care but CeraVe is more moisturizing and for a comparable price, La Roche-posay is much better quality"}, {"rating": 1, "date": "2026-05-11", "season": "other", "html": "Quality of this cream. One star because the quality of this hand cream is not good , it’s really dry on hand , I wanted to returned it but then they make their return of this hand cream is difficult. I won’t recommend this cream to anyone and it’s <strong>expensive</strong> too"}, {"rating": 1, "date": "2026-03-13", "season": "other", "html": "Doesn’t work for me. This cream is somehow making my face feel greasy and dry at the same time. I was looking for a replacement to my <strong>expensive</strong> face cream. This had a lot of good reviews, so I decided to give it a try. I’ve been using this cream for months and it just dries my skin."}, {"rating": 3, "date": "2026-03-12", "season": "other", "html": "Not great value. The biggest size is so much better value which makes me wonder how much they upcharge for this product. It works well and is moisturizing, but quite <strong>expensive</strong>"}, {"rating": 2, "date": "2024-11-22", "season": "other", "html": "Expected more. You get what you pay for. This product does not come close to providing the hydration you get from more <strong>expensive</strong> products. With skin care you just can’t cheap out."}, {"rating": 3, "date": "2023-10-29", "season": "other", "html": "Wanted to like this more than I did. I love the ingredients and originally thought it was a good size for the money. Unfortunately This lotion is extremely heavy on the skin and leaves a greasy feeling residue. It also goes really quickly. Not sure if the bottle was not full or what but it did not last long at all. No smell to this that I noticed which is what I was looking for. It’s not awful, but just a little too heavy and <strong>expensive</strong>."}, {"rating": 5, "date": "2026-06-28", "season": "other", "html": "Seals everything so good. Took me a long time to find a cream that my skin needed. My skin has been damaged for over a decade and I had no idea. When I realized that I needed a cream that has the 3:1:1 ratio, I’ve watched a lot of videos and then I wanted to get the one from Aestura but it was too <strong>expensive</strong> while this one was half the price with same or if not more benefits. At first I thought it was too heavy because I had oily skin just to realize that I had combo skin but got oily because it was dehydrated and damaged. When I first applied this I was like “OH MAN” should’ve gotten that stuff earlier. I’m telling you this is all you need with a great serum underneath…"}, {"rating": 4, "date": "2026-03-25", "season": "other", "html": "Similar to American brands. Works great but very similar to Cerave, Cetaphil or Eucerin. I don’t see much of a difference between this and those brands except that this was a bit <strong>expensive</strong>. I’ll use it up but probably won’t buy it again. I do like it though"}, {"rating": 5, "date": "2026-07-05", "season": "summer", "html": "Finally a Cost effective Barrier Cream that DOESN’T Sting!. I use prescription retinol and sometimes I get a little too ambitious with my layering concoctions and my skin gets sensitive. I’ve tried several “barrier” creams and many of them sting and burn immediately upon application. Isn’t the point of a barrier cream to prevent that?! This one is sting free, super thick and feels luxurious. The only other one that was sting free for me was LRP but it’s too <strong>expensive</strong> for that tiny tube. I will upgrade to the big tub after I use this tube. Get it and you won’t regret it."}, {"rating": 5, "date": "2026-07-23", "season": "summer", "html": "Best moisturizer. I will keep buying this cream forever! It deeply hydrates my skin and has become my favorite final step in my nighttime skincare routine. It leaves my skin soft, plump, and moisturized all night long. Honestly, the hydration is just as good as many <strong>expensive</strong> moisturizers. I absolutely love it!"}], "packaging_issue": [{"rating": 2, "date": "2025-09-06", "season": "other", "html": "Defective product. I’ve really enjoyed this cream in the past. I’m already on my third bottle. However, this time I noticed the <strong>packaging</strong> had changed, and the product itself seemed different as well. There were no little beads like before, and unfortunately, it left my skin feeling dry. It might have just been a defective batch, but it was still a bit disappointing compared to my previous experiences."}, {"rating": 3, "date": "2025-02-21", "season": "other", "html": "Product works well, a little difference what I&#x27;m used too but no issues. This was recommended to me from a reddit user and upon using for 3 months, no issue on normal skin. Product seems good, different smell and thicker than what I remember it used to be. I like this product better beauty of Joseon because it doesn&#x27;t have an oil/glow effect at the end, it does but not too shinny. The product is sweat resistant as I used for the gym and it stay on well. drawback is it like a little oily once I hit past the 12 hour mark. I recommend daily cleanse and don&#x27;t leave this product on too long. Male, 40, Normal skin, oily on T-zone areas I usually order mine from YesStyle but this time I took and chance and ordered from Amazon. <strong>Packaging</strong> is in English and I tried to reach out the company but their email keeps on getting invalid email address. Most likely will not order again since I can&#x27;t get a hold of the company. Order was fulled by Amazon via &quot;ILLIYOON Official&quot;"}, {"rating": 5, "date": "2026-08-08", "season": "summer", "html": "non-irritating. Zero irritation. Emollient enough for my extra dry skin from climate and hormones. <strong>Packaging</strong> is un-fancy making it good for my purse and dispensing a controlled amount. Affordable! Thank you."}, {"rating": 5, "date": "2026-07-11", "season": "summer", "html": "Just buy it. Genuinely the real deal. No fancy <strong>packaging</strong>, no BS mystery ingredients. Insane value and the best moisturizer I&#x27;ve used living here in the desert. Maybe couple it with a panthenol cream every few days for barrier repair but genuinely the best moisturizer for the money I&#x27;ve ever used. Huge bottle so you don&#x27;t feel bad about using it on your body too. No fragrance is awesome. Very light for being so moisturizing too. Use it anywhere and everywhere because it&#x27;s so economical!"}, {"rating": 4, "date": "2026-03-12", "season": "other", "html": "Very nice, hydrating but <strong>packaging</strong> needs a change. This product is wonderful but I truly hate the packaging. It is very thick cream so it’s difficult to squeeze out."}, {"rating": 4, "date": "2024-08-30", "season": "summer", "html": "Needs better <strong>packaging</strong>. I like the cream and the option of a big value size. The problem is that it really needs a sturdier inner lid. A flimsy piece of plastic doesn&#x27;t do anything to protect the interior of the main lid and when I received it, the plastic piece had mixed in with the cream. I had to spend some time fishing it out and trying to scrape the cream back into the container since I didn&#x27;t want to waste product. Also, the jar was packed in the shipper box with no packing filler. So it was just sliding around in the box as it traveled to me. I&#x27;m sure that contributed to the cream splattering all over the inner lid and the flimsy plastic becoming imbedded in the cream. Not a great way to receive a new product. Update (1/12/25): my second tub arrived with no problems. No complaints. It&#x27;s a great cream, especially now that we&#x27;re into the heart of winter. It offers stellar protection and moisturization. Will be repurchasing."}], "breakout_reaction": [{"rating": 3, "date": "2026-08-10", "season": "summer", "html": "Combination skin. Too heavy for my combination/sensitive skin. Love the texture and lack of fragrance but caused me to <strong>break out</strong> so not worth the hassle."}, {"rating": 1, "date": "2026-04-21", "season": "other", "html": "Greasy feel + no moisture + irritation + extreme dryness, <strong>breakout</strong> patches = extremely poor product.. I&#x27;m not sure how this product got such glowing reviews. I really wanted to love it, kept thinking if I just gave it a few more days something would change. The product feels very heavy, greasy as if it&#x27;s just sitting on top of the skin, not getting absorbed whatsoever. Even worse, after a couple of weeks I started to notice I was now getting very dry, irritated and flaky patches around the edges of my face, something I have never had in my life as I tend to be oily around my hairline. Honestly I am so disappointed with this product I feel like Amazon shouldn&#x27;t carry it, it&#x27;s bordering on toxic. According to some other reviews it contains canola oil and other harmful cancer causing ingredients as well."}, {"rating": 1, "date": "2026-06-05", "season": "other", "html": "New product formulation. I was in love with the old formula- used it for the past two years. I just recieved the new formula (unknowingly) that they have been slowly releasing over last year and it took longer to get to the US. My face has a rash, I’m <strong>breaking out</strong> and I’m also grieving the old product. I get married in a few months and it took me so long to find something that worked for my skin. I don’t understand why companies change a formula when they have such a great product to begin with. So disappointed!"}, {"rating": 1, "date": "2026-04-10", "season": "other", "html": "New Reformulation Sucks. Formula changed and is no longer good. This used to be my holy grail but after the formula changed, it did the opposite of what I liked it in the first place. After using the new reformulated moisturizer, I started <strong>breaking out</strong> and it’s no longer heavy and thick enough to moisturize my super dry skin. Illyoon ruined this product for me! I used to really like this moisturizer and was the only moisturizer I bought for years because it’s the only thick moisturizer that hasn’t broken me out and moisturized my super dry skin at the same time, it was gentle and gotten rid of my dry patches but now it does completely the opposite."}, {"rating": 1, "date": "2026-04-17", "season": "other", "html": "Beware!!!!!. After reading a couple reviews I decided to give it a try. Big mistake! I have no allergies and at my 70+ years I am sure I would know. Within two days of using this on my face I started <strong>breaking out</strong> with acne and white heads. I discontinued use and an still trying to clear this break out up. You need to be aware no matter your skin type is if you don&#x27;t want to look like a 13 year old with pimples and white heads beware of this misleading cream. GARBAGE."}, {"rating": 1, "date": "2026-04-20", "season": "other", "html": "Made me <strong>breakout</strong>. For reference I do have oily and acne prone skin. After seeing the hype on it I decided to give it a try to combat with my dry skin during the winter months. It was unfortunately a mistake for me sadly. I developed a monster sized zit. It was still around when I developed another one on the other size of my face 2 weeks later. And now a few days after this new one popped up I can feel another one developing on my upper lip. This is the only new product I’m trying."}, {"rating": 1, "date": "2026-07-09", "season": "summer", "html": "ACNE CAUSING. TERRIBLE. Was working so good at first and then I noticed pimples. I rarely <strong>breakout</strong> and thought it was because of stress, but it kept getting worse with every use. It is a very thick cream so maybe that is why."}, {"rating": 5, "date": "2026-08-01", "season": "summer", "html": "Excellent Quality for a Reasonable Price. A little goes a long way with this facial cream. It is very absorbent and feels great, not heavy or greasy. It is best applied to slightly damp skin and locks in moisture. It is great for sensitive skin and does not cause irritation or <strong>breakouts</strong>. It did not aggravate my rosacea. For the quality of the product, it is an excellent price. I highly recommend it!"}, {"rating": 5, "date": "2026-08-10", "season": "summer", "html": "Improved my combo skin hydration a ton!. This moisturizer is now a staple in my skin routine! For years I tried a bunch of mild ones where you can get in bulk or just were cheap. I have combo skin, so much drier and oiler areas on the skin. The old moisturizers did the general job, but I wanted to address the mild <strong>breakouts</strong> I’ve had for years and overall skin quality. In combination with benzoyl, I’ve been using this moisturizer for over 6 months and I’ve noticed a considerable difference in breakout frequency (much less) and my skin texture is much more plump and hydrated. I’ve gone a few weeks without using the moisturizer and really did notice my skin looking less glowy. I use this twice daily and for skin prep for makeup. I love it and would definitely recommend trying to see if it works for you!"}, {"rating": 4, "date": "2026-07-18", "season": "summer", "html": "Not. The cream does feel good but it broke me out in <strong>acne</strong> in a matter of a week when prior i didn&#x27;t have any so if you have sensitive skin i don&#x27;t recommend"}, {"rating": 2, "date": "2026-01-17", "season": "winter", "html": "Worked great for my body, but not for my face. I used this cream during a time when my skin was <strong>breaking out</strong> and my skin barrier was damaged, and unfortunately it made my facial skin worse. It felt too heavy for my face during that period and didn’t agree with my skin. I didn’t want to waste it, so I started using it on my body instead, and it actually worked amazing there. It was very moisturizing, soothing, and helped with dryness without irritation. Overall, I wouldn’t personally use this on my face again, but it’s a great body moisturizer, especially if you need something rich and nourishing."}, {"rating": 2, "date": "2025-11-03", "season": "other", "html": "Illiyoon causes <strong>breakouts</strong> only use in hands and body!!!!. Caused breakouts!!! I have combo oily skin do not buy if you have this type of skin. They say it does cause breakouts complete lie after one night use I looked like a pickle!! I use it for my hands and body now. If you want a nice breakout use on the face. I think this is made for dry skin types. The big tub last a long time. I couldn&#x27;t get my money back 😭 I wish the company would contact me and give me a refund, but it has been so long ago. I hope this helps with buying decisions for Oily/combo skin types and dry skin types. I was trying to use it with tretinoin."}, {"rating": 2, "date": "2023-11-02", "season": "other", "html": "Wanted to love this but it broke me out!. I did my research before purchasing this and even ran the ingredients through the <strong>Acne</strong>-Safe app and was given the all clear. I chose this over Soon Jung barrier repair because I saw a lot of people say that it broke them out. Application was thick almost like a primer and my face immediately felt “covered” and suffocated (I should have washed it off immediately). But as with any product I tried to give it a few days before deciding if I liked it. I wanted to use this to help with dryness and peeling from using Arazlo (tazarotene) so the first night I used it as a buffer before applying the Arazlo. The next morning my entire nose was inflamed and clogged with those big white heads and my pores look so noticeable and pronounced, even on my cheeks! Next night I applied it after the Arazlo and my nose was peeling and raw the next day with even more deep white heads. Turns out this product has soybean oil which clogs pores! I did not like the thick unbreathable texture and my nose became less inflamed almost immediately after I stopped applying it. I use Cosrx Rice overnight mask now and it’s fantastic, super moisturizing and as with most Cosrx products it doesn’t break me out. I wish I was one of the people who loved this product but it just didn’t work well with my skin at all!"}, {"rating": 3, "date": "2026-04-05", "season": "other", "html": "Its a good product.. I had some <strong>break out</strong>s after using it on my face, but it&#x27;s seems ok for the body."}, {"rating": 1, "date": "2026-07-05", "season": "summer", "html": "Does not work!. I have dry and sensitive skin. This product did not help but instead made me <strong>break out</strong>….so that’s a definite NO for me. Disappointed after reading all the reviews."}, {"rating": 1, "date": "2026-04-01", "season": "other", "html": "No go for me! :(. I was really hoping to like this moisturizer, but it has caused my skin to <strong>break out</strong>! The dimethicone also pills up on my skin. It’s weird. It’s left my skin with a rough texture. It was not moisturizing at all for me. I’ve also realized that this product does not contain clean ingredients so I won’t be using it at all. No thanks!"}, {"rating": 1, "date": "2024-08-09", "season": "summer", "html": "moisturizers but is a bit heavy, clogging for oily skin. I had no issues with this product in terms of <strong>breaking out</strong> or negative reactions, but I felt it was a bit heavy in that after cleansing and drying my skin before applying sunscreen, my skin felt &quot;wet&quot; and there was a layer of product remaining. This product will help those with drier skin than those with oily skin. That said, it applies nicely on the skin and there&#x27;s a lot of product for quantity so definitely get your money&#x27;s worth. 2/19/25: Update: this is too clogging as an oily skin person. interestingly, I use products like vanicream cream which supposed to be even heavier than illiyoon but I didn&#x27;t feel it was as clogging (Blackheads on nose). Update 6/28/25: I&#x27;ve been trying to figure out what my skin always appears flushed and red and after going thru a ton of product permutations: it&#x27;s either this benton or the illiyoon ato cream. i dropped both and skin looks a lot better within a day. not sure what specific ingredients triggered my skin."}, {"rating": 1, "date": "2026-03-20", "season": "other", "html": "Not for me. The concentrate cream gave me the worst <strong>breakout</strong> I&#x27;ve had in years. Tried it overnight and the next day I had a massive cystic acne spot and a bunch of little spots. I haven&#x27;t had acne like that since I was a teenager. It also wasn&#x27;t moisturizing at all; it actually made my skin feel a bit tight."}, {"rating": 1, "date": "2026-08-03", "season": "summer", "html": "That product would work on my skin. I have dry skin and did not go with my face I <strong>broke out</strong>"}, {"rating": 1, "date": "2026-06-12", "season": "other", "html": "<strong>Breakout</strong> due to product. This made me breakout into a itchy rash on my face down to my neck I cannot recommend this product. Who knows where they get it?"}, {"rating": 1, "date": "2026-05-09", "season": "other", "html": "not for me AT ALL.. used a very small amount of this twice and <strong>broke out</strong> in tiny pimples both times IMMEDIATELY. i was so excited for this the way they have so many celebrities making ads for it im genuinely so disappointed."}, {"rating": 5, "date": "2026-08-27", "season": "summer", "html": "Moisturizing and safe for my sensitive skin!. Love it. I have sensitive skin and this did not cause any reaction nor did it make me <strong>break out</strong>! It does seem to calm my skin. If is moisturizing but I have very dry skin so I will have to see how it does in the winter. For now it’s great, and I think it will be moisturizing enough for winter as well if I layer some marajuca oil on top."}, {"rating": 4, "date": "2026-04-14", "season": "other", "html": "Leave skin hydrated and soft. I gave this a four-star review because at first, or at least for me anyway, the first 2 weeks this product caused me to <strong>break out</strong>. I have highly sensitive skin and I&#x27;m very prone to acne breakout. I am a 52-year-old woman in the midst of menopause and acne is still an issue, however with menopause also comes very dry skin. It&#x27;s hard to find something that can address the dry skin and not cause breakouts. I toughed it out and continued with the product and now it does not cause breakouts any longer. It&#x27;s a great moisturizer. Your skin absorbs it quickly and your skin is left feeling very hydrated and soft. If you purchase it and you notice you&#x27;re breaking out, I would suggest using every other day until your skin gets used to it."}, {"rating": 1, "date": "2026-07-15", "season": "summer", "html": "Gave me <strong>acne</strong>/closed comedones. Started giving me acne. The new formula gave me acne in places where I never had acne before"}, {"rating": 1, "date": "2026-05-07", "season": "other", "html": "Do Not Buy.. sorry. Do not buy this product it gave me <strong>acne</strong> and made my skin dry and patchy - I have a medical science degree and I’m always trying to find hydrating products this is not it.."}, {"rating": 1, "date": "2026-05-26", "season": "other", "html": "Nothing Special. Nothing great about this product at all. Feels greasy and gave me an ache <strong>breakout</strong> when I usually don’t have issues with ache at all."}, {"rating": 1, "date": "2024-12-11", "season": "winter", "html": "BUYER BEWARE: PORE CLOGGING. After almost 2 months of nightly use, this product unfortunately was the culprit for my acne. I’m in my mid-30s, have combination (more on the dry side) skin. Past history of Accutane due to cystic acne. I was in the market for a “barrier” cream moisturizer for my dry skin, especially in the winter. Haven’t had acne since early 20s. I thought my face was purging at first; however, cystic acne isn’t purging. It’s an indicator of inflammation (redness) and irritation. I also had white heads all over. It was on my forehead, cheeks, and chin. I stopped using it and my face hasn’t had any new <strong>breakouts</strong>. Unfortunately, I’m dealing with scarring from the acne. Buyer beware, it can clog pores."}, {"rating": 1, "date": "2025-10-28", "season": "other", "html": "Not for T-Zone. It leaves a thick oil slick on your face, it feels heavy and oily, it does not seep in as other typical products do but seems to just sit on top of your skin. It landed up making me <strong>break out</strong> despite giving it additional time to allow my skin to regulate to it, it did not. I would caution those who tend to have acne or a slightly more oily t-zone to stay away from this product."}, {"rating": 3, "date": "2020-07-26", "season": "summer", "html": "Big value if on a budget, but not cosmetically elegant. First, I was amazed by how big the tube I received was for this price-- it&#x27;s massive and will definitely last you a long time! I was looking for a replacement for my CeraVe Daily Moisturizing Lotion, since they&#x27;ve reformulated and it no longer works with me skin. I found this cream to be heavy but not very moisturizing. It feels like there is a layer on my skin, so I only use it at night since its a bit suffocating. The texture is the worse-- gritty from the encapsulated ceramides and thick and tacky. It legit feels like I&#x27;m rubbing elmer&#x27;s glue on my face (and my eyebrows get all glued down in weird ways, with the little capsules stuck in them.. just gross). I find my skin sticking to my pillow case at night, even when I&#x27;ve tried to move my skincare evening routine to a few hours before bed time. Its like the stickiness never goes away! It dries matte and then is greasy in the mornings.. never a nice &quot;glowy, dewey,&quot; or &quot;glass-like&quot; finish like I&#x27;ve read others mention. I found this strange since most of the reviews say the opposite about this moisturizer, so maybe my skin is just different. I&#x27;m still experimenting with different ways to use this to get it to work better for me (ex. apply to wet skin, before other moisturizers, after other moisturizers, increase dry times between layering steps, using it just on its own, day time vs night time, less product vs more product, etc.) because its such a large tube at such a low cost that I want it to work for me. Also it doesn&#x27;t irritate my sensitive skin and hasn&#x27;t caused any <strong>breakouts</strong>, so that gives me motivation to keep trying to make it work. For reference, I have dehydrated combination skin. Prone to blackheads in the t-zone and hormonal acne in the U zone So far I&#x27;ve been using this for about ten days. I will update this review if things change in the future."}, {"rating": 5, "date": "2026-07-13", "season": "summer", "html": "As close to a Miracle Cream as possible!. This is a miracle cream for me! It cleared up the eczema/ dermatitis <strong>breakouts</strong> almost overnight. (Been dealing with it on and off for too many YEARS) Within a week my skin was the best its EVER been! This worked better for me than La Roch Posay, Neutrogena, Ceravee and all the other &quot;miracle&quot; creams. They all seemed to make things &quot;better&quot;, but Illiyoon took it all the way to healed and better than ever. Honestly was skeptical because it was recommended by &quot;influencers&quot; but im so glad I decided to try it! I got it during prime day, but this creme
