did leave my face moisturized\n"}, {"rating": 2, "date": "2024-07-15", "season": "summer", "html": "Reformulation is Awful - Ruined This Product. The original version of this product was the best moisturizer I&#x27;ve ever used - lightweight, easy to spread, and great for acne-prone skin, but still deeply moisturizing (enough to be used with prescription retinoids). This 2024 reformulation feels thick, tacky, and hard to spread. Worst of all, it&#x27;s now so occlusive that it leaves a <strong>greasy</strong>-feeling film that sits atop your skin, which clogs my pores and causes acne. The addition of niacinimide causes the skin on my neck to get red, itchy, and irritated too. I&#x27;m so frustrated that they basically had a perfect product with the prior formulation and completely ruined it. Save your money and look elsewhere - Illiyoon is a fraction of the price and basically the same experience, minus the irritated skin.\n"}, {"rating": 3, "date": "2024-07-01", "season": "summer", "html": "Would not recommend for oily skin. I&#x27;m someone with oily skin and I only used this moisturizer at night for a couple weeks and it still left me very <strong>greasy</strong>. This product dose leave a sticky like consistency on the skin and I think this product is too expensive for the amount of product you get if you are just starting your k beauty journey I would suggest finding something different they have better moisturizers for cheaper. I will say I think this product would be better for people with dry skin. However my skin dose feel pretty soft so that is a plus I just think I don&#x27;t have the right skin for this product.\n"}, {"rating": 4, "date": "2024-06-18", "season": "other", "html": "<strong>Too heavy</strong> for my face, but great as a cream for the body. I have combo sensitive skin. I got this to help repair my skin barrier since I over exfoliated and had skin peeling off, but it wouldn&#x27;t absorb into my skin. I tried rubbing it in more and using by itself, but it would just sit on my skin. I slept with it on overnight to see if maybe it just needs a long time to absorb, but when I woke up it was still sitting on top and ended up giving me acne. I eventually gave up, but used it on my neck and ashy parts of my body and it made it feel super soft and moisturized.\n"}, {"rating": 3, "date": "2024-05-26", "season": "other", "html": "Doesn&#x27;t work for me!. I have combination sensitive skin and this moisturizer just didn&#x27;t work for me. Sadly, it made my skin super <strong>sticky</strong> and never seemed to really absorb into my skin. It does provide pretty great hydration, but for me it didn&#x27;t work. It is also very thick as well, this product would probably work a lot better for someone who has very dry skin.\n"}, {"rating": 1, "date": "2024-03-31", "season": "other", "html": "Went from best ever to worst. The original formulation of this product was divine. It was an unbelievably outstanding product. The new version is laughably bad. Can&#x27;t believe how stupid this company is to destroy such a top tier product. The new version is so <strong>greasy</strong> I looked like I rubbed butter all over my face. It doesn&#x27;t moisturize, form a protective barrier anymore, and stung my skin. Hope everyone hates it and stops buying it so they&#x27;ll bring back the OG formulation that was so many people&#x27;s HG.\n"}, {"rating": 2, "date": "2023-09-24", "season": "other", "html": "<strong>sticky</strong>, somewhat drying and broke me out. So I have combination skin, oily t zone, dry chin and sometimes dryness on my cheeks. I was reading reviews saying this moisturizer was good for combination but turns out it didn&#x27;t work for me. Instead of hydrating, I felt like it dried up areas of my face even more and made me break out. Another thing, it feels very sticky yet for some reason it didn&#x27;t hydrate my skin enough. It did work well for my oily t zone though. However i started breaking out more and more as I used it each day. Since it didn&#x27;t work on my face I simply started using it on my arms and body because this moisturizer is very pricey and i wouldn&#x27;t want for it to be a waste of money.\n"}, {"rating": 3, "date": "2023-09-12", "season": "other", "html": "Feels <strong>greasy</strong>. I want to love this product so bad because it&#x27;s rated number one moisturizer in korea. Unfortunately this product is very greasy. To make this product work for me I only use in day time under sunscreen. Secondly, it smells like plastic. I nervous if this is really from Korea or a knock off . I can&#x27;t compare but if anyone has the real one that was purchased in korea can chime in on this.\n"}, {"rating": 4, "date": "2023-05-19", "season": "other", "html": "Its good but not for oily skin. I&#x27;m obsessed with Korean skincare so I wanted to try this moisturizer but it&#x27;s wayyyy <strong>too heavy</strong> for oily skin. I kept getting bumps on my forehead and cheeks. Maybe it&#x27;s better for cold weather. Wouldn&#x27;t recommend if you have oily sensitive skin. It also has a strange chemically smell.\n"}, {"rating": 3, "date": "2022-09-26", "season": "other", "html": "Very moisturizing, but also unpleasantly <strong>sticky</strong>. The good: This definitely moisturized the skin where I patch-tested it, upon washing my face it was noticeably softer than the skin around it. A little went a long way, and there was not an unpleasant smell, just a light chemical scent that faded very quickly. The bad: it continued to feel sticky on my skin the entire time, although it did not stick to fabric or my hair after about the first minute. All in, it&#x27;s definitely going to stay in my lineup for the depths of winter, but it&#x27;s too heavy and sticky-feeling for daytime wear. I was hoping for better from the minds behind AmorePacific(a sister brand to this one.)\n"}, {"rating": 3, "date": "2026-08-01", "season": "summer", "html": "Sits on the face not impressed. Don&#x27;t like it maybe I use too much product but it sits on the face don&#x27;t know if my face sucks in the moisturiser. <strong>Greasy</strong> face dislike really wanted to love it\n"}, {"rating": 3, "date": "2026-07-18", "season": "summer", "html": "Gentle but <strong>Greasy</strong>. It has no scent and is gentle on my dry, sensitive skin, but it&#x27;s greasy so I&#x27;ll only use it at night and use Paula&#x27;s Choice Resist during the day.\n"}, {"rating": 5, "date": "2026-07-09", "season": "summer", "html": "Great. Top-tier barrier repair cream, especially if your skin barrier is damaged. I use Differin and retinol, so this has been perfect for me. I usually apply it at night, and it does an amazing job of restoring my skin. If you don&#x27;t use strong actives or your skin barrier isn&#x27;t compromised, this cream might feel too heavy. It leaves a <strong>greasy</strong> feeling on the skin for quite a while after application. Personally, I don&#x27;t mind it at all because it works so well. I&#x27;m already on my third tube.\n"}, {"rating": 2, "date": "2026-07-04", "season": "summer", "html": "Eh. I didn&#x27;t notice a difference. It abosrbs fine but has a <strong>greasy</strong> feeling. Its lightweight but doesn&#x27;t do anything for my skin.\n"}, {"rating": 1, "date": "2026-07-02", "season": "summer", "html": "<strong>Too heavy</strong>. Too thick and heavy for my skin, and leaves a dewy feel. After 3 days of using it it broke me out.\n"}, {"rating": 5, "date": "2026-01-14", "season": "winter", "html": "Great barrier helping moisturizer!. I love this moisturizer. It is better for dry skin. It is semi thick. It does not clog my pores and I actually see my skin has a better appearance after using it with time. I like it as a moisturizer for the winter time. It would be <strong>too heavy</strong> for the summer. Even though it is not a huge bottle it does last quite a long time!\n"}], "absorption_issue": [{"rating": 1, "date": "2025-02-10", "season reamy, and a little goes a long way. Like a typical barrier cream, it takes a bit to fully absorb, so while it <strong>sits on the skin</strong> you can feel a bit of tackiness. I have liked other Aestura products, but this is not my favorite barrier cream, I have actually used others that I found to be more light weight. If you are chronically dry this is a great non irritating option.\n"}], "not_authentic": [], "lightweight_absorption": [{"rating": 5, "date": "2026-06-30", "season": "other", "html": "Love it!. My favorite moisturizer. Actually <strong>feels like it absorbs instead of sitting</strong> on top of my skin. Thick and nourishing. I have combo/dry skin and use rx arazlo/tarazotene.\n"}, {"rating": 5, "date": "2026-06-28", "season": "other", "html": "Worth every penny. This is one of those products that is worth the hype. I decided to give it a go because it&#x27;s marketed towards dry, sensitive skin, which is what I have. I&#x27;m also acne prone. And this moisturizer completely transformed my face. It&#x27;s thick, but <strong>not greasy</strong>, doesn&#x27;t clog my pores, and my skin is glowing and plump! It wears great under makeup too. So it&#x27;s replaced my day and night moisturizers! Can&#x27;t recommend enough.\n"}, {"rating": 5, "date": "2026-06-28", "season": "other", "html": "Eczema Warriors must buy!. This is a life saver for my severe facial eczema. Soothing and doesn&#x27;t sting even when I&#x27;m broken out and cracking. No smell and doesn&#x27;t irritate my skin. Doesn&#x27;t cause flairs. Silky smooth application that leaves my skin with a glossy (<strong>not greasy</strong>) glow. Super hydrating. A little actually does go a long way, and that&#x27;s coming from someone who medically needs to moisturize constantly. My skin drinks this stuff. I&#x27;ll buy this forever as long as the recipe stays the same.\n"}, {"rating": 5, "date": "2026-06-28", "season": "other", "html": "Magical. Magic. This cream is a god send. I have really bad rosacea on my right cheek. Nothing has worked and I have spent a lot of money on expensive products and it never reduces the redness. This cream reduced redness within a week! A WEEK! I am beyond impressed. My face stays hydrated all day and is <strong>lightweight</strong>. This is worth every penny. Can&#x27;t wait to try more of the with products.\n"}, {"rating": 5, "date": "2026-06-27", "season": "other", "html": "Great product. Very good solid every day moisturizer. Good for sensitive skin, no scent, and melts into skin. Lightweight and <strong>not greasy</strong> at all. My skin loved it.\n"}, {"rating": 5, "date": "2026-06-26", "season": "other", "html": "one of the best moisturizers for dry and sensitive skin. This cream has quickly become one of my favorite moisturizers. It feels rich and nourishing but does not sit heavily on the skin. The texture spreads easily and <strong>absorbs well</strong> while still leaving skin feeling protected and comfortable. The ceramide capsules are a nice feature and help give the cream a more moisturizing feel without being greasy. My skin felt softer and more hydrated after using it consistently, and it worked especially well whenever my skin felt dry or stressed. It layers nicely under sunscreen and makeup and does not pill with other skincare products. A little goes a long way, so the tube lasts quite a while. Overall, a great barrier focused moisturizer that delivers long lasting hydration and leaves skin feeling healthy and smooth.\n"}, {"rating": 5, "date": "2026-06-14", "season": "other", "html": "Amazing hydration. As an aesthetician, this cream is perfect for extra hydration or balancing the skin barrier. It&#x27;s <strong>lightweight</strong> and blends in beautifully. I highly recommend this cream. ⭐️⭐️⭐️⭐️⭐️\n"}, {"rating": 5, "date": "2026-06-11", "season": "other", "html": "Best moisturizer for dry skin!. Great for dry, dehydrated skin. Doesn&#x27;t burn skin like some moisturizers can on sensitive skin. <strong>Lightweight</strong> but sinks in well. Packaging helps get all the product out.\n"}, {"rating": 5, "date": "2026-05-18", "season": "other", "html": "Favorite everyday moisturizer!. I have tried just about every daily moisturizer there is out there and had never really found THE one until I came across this particular one. I have extremely sensitive/eczema prone skin and this is now my go to moisturizer. I use it morning and night. It&#x27;s highly moisturizing, yet <strong>non-greasy</strong>. Does not clog my pores or cause irritation. It is unscented. Relatively affordable price for how amazing this product is. I am already on my second tube and will continue to purchase!\n"}, {"rating": 5, "date": "2026-05-17", "season": "other", "html": "Good product!. Very good product and nice feel. A very small amount is all you need for a moisturized and smooth feeling face. No adverse reactions either my sensitive skin. <strong>Not greasy</strong> very clean feeling lightweight just a small dab!\n"}, {"rating": 5, "date": "2026-05-15", "season": "other", "html": "Would purchase over and over. Can&#x27;t be without it.. This is my second purchase of this product. I use it day and night as a final moisturizer after my skincare routine. <strong>Non greasy</strong>, lightweight and no skin irritation. I only use a pea sized amount and the product lasts for months. It helps retain the moisture in your skin by creating a clean light barrier.\n"}, {"rating": 5, "date": "2026-04-09", "season": "other", "html": "Good product 👍. Tried this morning, didn&#x27;t expect it to be so good. Very light weight, <strong>non greasy</strong>. Feel very comfortable on the face, highly recommended\n"}, {"rating": 5, "date": "2026-04-02", "season": "other", "html": "Perfect extra hydration for winter months. Very hydrating for winter but still feels lightweight and smooth. <strong>Not greasy</strong> at all.\n"}, {"rating": 5, "date": "2026-03-30", "season": "other", "html": "Great moisturizing cream. Very hydrating and gentle on the skin. It feels rich but <strong>absorbs well</strong> without being greasy. Leaves my skin soft and smooth really happy with it!\n"}, {"rating": 5, "date": "2026-03-30", "season": "other", "html": "It&#x27;s <strong>non-greasy</strong>. It&#x27;s good product It is non- greasy…\n"}, {"rating": 5, "date": "2026-03-23", "season": "other", "html": "Best moisturizer esp with actives like Tret. Such a great moisturizer. Thick but <strong>not greasy</strong>, moisturizing but not heavy. Absorbs so well. I am oily and acne prone and this moisturizer works so well for me especially while using several actives. In fact, I believe it makes me tolerate Tretinoin better, calming my skin after harsh actives. Will repurchase again and again!\n"}, {"rating": 4, "date": "2025-10-15", "season": "other", "html": "Great <strong>Lightweight</strong> Moisturizer, But Runs Out Quickly. I really love this Aestura moisturizer—it works beautifully on my skin. It provides great hydration without feeling too thick or heavy. My face feels soft and calm after using it, and it layers well with other products. In the morning, I&#x27;ve noticed my skin stays balanced and doesn&#x27;t get oily like it used to. The only downside is that it&#x27;s a bit pricey for the amount you get. I just wish the tube lasted a little longer. I find myself restocking a couple of tubes every time it goes on sale just to keep up.\n"}, {"rating": 4, "date": "2025-10-11", "season": "other", "html": "제품 사용 후기 요약. Very nice product to use. Not sure how effective it is but certainly feels good and <strong>absorbs well</strong>\n"}, {"rating": 4, "date": "2025-08-13", "season": "summer", "html": "Clean, smooth moisturizer. Came quickly. Love the feel of this moisturizer. <strong>Not greasy</strong>. I heard there was a sunscreen I&#x27;d like to find.\n"}, {"rating": 3, "date": "2023-08-05", "season": "summer", "html": "weird chemical smell. Very moisturizing and somewhat <strong>lightweight</strong>. After a few days of using it, there was a chemical smell whenever I used it. There wasn&#x27;t a smell the first 3 days so or using it but after the smell appeared.\n"}, {"rating": 3, "date": "2023-06-13", "season": "other", "html": "Texture is nice, smell is weird. Feels nice on the skin. Very moisturizing and <strong>not greasy</strong> or heavy. A little goes a long way. I like that it contains no synthetic fragrances. however, there&#x27;s a weird distinct smell that I really don&#x27;t like. It just smells funky to me so I&#x27;m that&#x27;s why I&#x27;m giving it 3 stars. It&#x27;s a great moisturizer though. If you&#x27;re not too sensitive about smell, then you should definitely try this.\n"}, {"rating": 4, "date": "2022-10-11", "season": "other", "html": "Good for those with dry skin and ok for those with combo skin. Not really for oily skin.. This review is for AESTURA ATOBARRIER365 CREAM | Long Lasting Hydration Facial Moisturizer for Dry &amp; Sensitive Skin | 80ml, 2.7 oz The brand Aestura is made by AmorePacific which is a pretty large cosmetics company in South Korea. I was interested because of it being an AmorePacific product. This is a thick product with little encapsulated ceramide beads in them. I think since it is a thicker product it works quite well for those with dry skin. For those with combo or oily skin, this might be better for night time use because it&#x27;s a bit heavier. The cream is thick and silky and the beads seem to <strong>absorb quickly</strong> and doesn&#x27;t make it feel like you&#x27;re trying to exfoliate. It does leave a slightly dewy/shiny look to the skin, but eventually absorbs. As for the scent, I don&#x27;t really smell much of anything with this product. If I have to say if I lean my nose super close I can pick up a slight plastic like scent to it. I would probably recommend this cream for dry or combo skin folks. If you have oily skin, maybe you can save it for winter time or when you use skincare that dries your skin out.\n"}, {"rating": 4, "date": "2022-10-10", "season": "other", "html": "Seems to work. I didn&#x27;t realize this was supposed to be for your face, I&#x27;ve been using it on my feet. I have terribly dry cracked feet, and this seems to help keep some of that moisture from leaving my desert feet. I wouldn&#x27;t say it lasts 100 hours as the product page claimed, but it&#x27;s at least <strong>not greasy</strong> and seems to help keep my feet from getting worse. I think it must be a Korean beauty product as the entire box is written in character, so I&#x27;m trying my best to make it work!\n"}, {"rating": 5, "date": "2026-08-25", "season": "summer", "html": "Amazing for acne-prone skin!!! 10/10. Cannot recommend this product enough!!! It truly is amazing, your skin will feel so smooth! It&#x27;s <strong>not greasy</strong> at all and leaves your skin with such a nice glass look. I&#x27;ve been using it for about 2 months and have not broken out once and I have very acne prone skin, I use it every single night and wake up and my skin still feels hydrated. Totally recommend 10/10!\n"}, {"rating": 5, "date": "2026-08-21", "season": "summer", "html": "Nourishing holy grail. LOVE. This is a must have for dry sensitive skin. Most creams I&#x27;ve used get sucked up in my skin and I still feel dry after. This once is amazing and makes me feel adequately hydrated. It is thick but <strong>not greasy</strong>. Love the little beads. I will keep buying this\n"}, {"rating": 5, "date": "2026-08-19", "season": "summer", "html": "A very nice moisturizer.. I took this on a trip last month and really enjoyed using it. It has a creamy feel and is very moisturizing. Yet it&#x27;s <strong>lightweight</strong> and doesn&#x27;t feel sticky. I use it in the evening and in the morning, my face feels nice and supple. And I like that it doesn&#x27;t really have scent.\n"}, {"rating": 5, "date": "2026-08-16", "season": "summer", "html": "The best lotion I have ever used! Great for dry, flaky, tight skin. Plays well with other products.. I wish I could give this product 100 stars! After trying so many face lotions, I finally found this. I used to have oily skin in my 20s, but something happened in my 30&#x27;s and my skin got tight, dry, and flaky. I used to be fine with just the cerave daily moisturizer, but then had to move to the thick cerave night cream. It worked well but didn&#x27;t do well for product layering, and my facial suncreen and makeup would get thick and clumpy. After trying many gels, lotions, and creams, I ordered this. It goes on easy, <strong>absorbs quickly</strong>, and doesn&#x27;t leave a heavy or greasy feel or shine. My skin feels stretchy, bouncy, and moisturized. It lasts all day and is great for layering other products on top. I will continue to order this a recommend it to anyone who has the same problem with dry skin!\n"}, {"rating": 4, "date": "2026-07-26", "season": "summer", "html": "Great alternative to Cicalfate while on tretinoin. Not as great as my holy grail Avene Cicalfate as an all-in-one repair cream/ barrier cream but worked better while my skin was compromised while on Tretinoin treatment. Hella pricey. Will try the Illyoon ato moisturizer next time coz it&#x27;s half the price. Use this after tretinoin and this work wonders. Makes me look like a glazed donut at night. <strong>Lightweight</strong> compared to Cicalfate.\n"}, {"rating": 3, "date": "2026-07-23", "season": "summer", "html": "Good moisturizer but not for me. I bought this moisturizer after seeing it recommended all over Reddit for people using tretinoin. It&#x27;s somewhat hydrating and gentle for sensitive skin, but while it felt <strong>lightweight</strong> at first, I felt like it left a waxy or plasticky residue on my face after using it. I didn&#x27;t find it hydrating enough for me, and I felt like it wasn&#x27;t quite worth the price tag. Tons of people love this moisturizer, I just unfortunately wasn&#x27;t one of them.\n"}, {"rating": 5, "date": "2026-07-14", "season": "summer", "html": "THE best moisturizer for a desert climate. I&#x27;ve lived in a desert climate for 20 years and have long been on the search for a moisturizer that could actually last the whole day. My friend brought this back for me from Korea a couple months ago and I&#x27;m straight obsessed. It feels so smooth, silky and <strong>lightweight</strong> with no pilling or shine. I&#x27;m happy to have this in my life and with perimenopause probably coming soon this arrived just in time. It&#x27;s a little pricey but I stocked up when it was on sale for prime\n"}, {"rating": 5, "date": "2026-07-07", "season": "summer", "html": "A Staple in My Skincare Routine. I love this moisturizer! I originally purchased it at Sephora and quickly fell in love with it. When I saw it on sale during Prime Day, I grabbed another one. It feels <strong>lightweight</strong>, never greasy, and I&#x27;ve definitely noticed an improvement in my skin since using it. Even at full price, I think it&#x27;s an excellent value and well worth the money.\n"}, {"rating": 5, "date": "2026-07-07", "season": "summer", "html": "Sensitive, hormonal skin has met its match- holy grail product!. This is hands down, the best moisturizer I&#x27;ve ever tried. From $2-200, this is just a superior product. With hormonal, aging skin, it is hard to keep moisture and my skin rarely feels supple. Add to that hormonal breakouts, perioral dermatitis…it&#x27;s all I could to not cry. This has calmed my skin, consistently leaves it feeling hydrated, <strong>not greasy</strong>, does not cause flare ups nor does it make them worse….I&#x27;m just so very thankful to have found this product. It&#x27;s my holy grail and I will NEVER be without it. I use this on my 10 year olds sensitive skin with no issue- just an all around, no bells and whistles, fantastic product!!!! A little goes a very long way, as well.\n"}, {"rating": 5, "date": "2026-01-18", "season": "winter", "html": "VERY Hydrating and <strong>Lightweight</strong> Moisturizer. Aestura is a great moisturizer that is effective at hydrating and sealing moisture, while maintaining a lightweight feeling. I really enjoy the consistency; it feels very emollient and occlusive. It is great to layer on top of essences and serums. Compared to all moisturizers on the market, this is one of the top ones for being so effective, even on sensitive skin.I will say I do prefer to use Illiyoon&#x27;s moisturizer (Aestura&#x27;s sister brand) because I have very dry skin and live in a dry climate (Illiyoon is more thick and occlusive). But Aestura is perfect for most people and fits the skincare needs of many.\n"}, {"rating": 4, "date": "2025-12-04", "season": "winter", "html": "Great but feels <strong>lightweight</strong>. Great moisturizer with excellent ingredients. It&#x27;s a bit lightweight for me, not as rich as I would have liked for my PM routine\n"}], "gentle_non_irritating": [{"rating": 5, "date": "2026-06-28", "season": "other", "html": "Eczema Warriors must buy!. This is a life saver for my severe facial eczema. Soothing and <strong>doesn&#x27;t sting</strong> even when I&#x27;m broken out and cracking. No smell and doesn&#x27;t irritate my skin. Doesn&#x27;t cause flairs. Silky smooth application that leaves my skin with a glossy (not greasy) glow. Super hydrating. A little actually does go a long way, and that&#x27;s coming from someone who medically needs to moisturize constantly. My skin drinks this stuff. I&#x27;ll buy this forever as long as the recipe stays the same.\n"}, {"rating": 5, "date": "2026-06-11", "season": "other", "html": "Best moisturizer for dry skin!. Great for dry, dehydrated skin. <strong>Doesn&#x27;t burn</strong> skin like some moisturizers can on sensitive skin. Lightweight but sinks in well. Packaging helps get all the product out.\n"}, {"rating": 5, "date": "2026-05-30", "season": "other", "html": "Great vegan barrier cream with <strong>no irritation</strong>. The winter air wrecked my skin barrier in just a few spots. I have oily skin prone to breakouts and extremely sensitive to &quot;natural&quot; ingredients like botanicals. I tried this because it is targeting barrier health without any complicated actives or botanicals or anything else. I replaced my moisturizer entirely so this is used on the oily areas and dry spots. The dry spots went away and I have no irritation or breakouts after a few months of daily use. It&#x27;s rich and luxurious feeling, but not heavy or goopy. My skin feels soft and smooth all day. I was surprised that it leaves some glow as heavier creams tend not to. It&#x27;s lovely. One odd thing: I have never felt the little beads the company and reviews mention. Mine is always perfectly smooth. Hopefully that&#x27;s ok and not bad product.\n"}, {"rating": 5, "date": "2026-05-13", "season": "other", "html": "Great!. Moisturizer is super hydrating. I have eczema and occasional breakouts and this moisturizer is perfect. Takes some time to absorb but since it <strong>doesn&#x27;t irritate</strong> my skin it&#x27;s a winner!\n"}, {"rating": 5, "date": "2026-04-19", "season": "other", "html": "Soothing and <strong>nonirritating</strong>, great with tretinoin. This is a very soothing, non-irritating cream, no scent. I use it under makeup and don&#x27;t have a problem with that, but my skin is normally very dry. I bought this after starting tretinoin. This cream is even more gentle and soothing than my favorite Clinique moisturizers. It gives my skin a subtle glow/shine that I like.\n"}, {"rating": 5, "date": "2026-03-30", "season": "other", "html": "Great moisturizing cream. Very hydrating and <strong>gentle on the skin</strong>. It feels rich but absorbs well without being greasy. Leaves my skin soft and smooth really happy with it!\n"}, {"rating": 3, "date": "2023-04-08", "season": "other", "html": "just okay. i wanted to like this moisturizer so bad but it just didnt work out for me. it has this weird plasticy smell that takes some getting used to. its good at keeping the skin balanced and <strong>non irritating</strong> especially with my sensitized tretinon skin. however after a about a month of usage i came to the conclusion that it was indeed breaking me out. so sad :( after i switched back to my old moisturizer the frequent breakouts stopped. oh well!\n"}, {"rating": 3, "date": "2022-10-06", "season": "other", "html": "Doesn&#x27;t provide Anywhere close to 100 Hours of Hydrated Skin as Claimed!. I&#x27;ve been using this facial moisturizer for awhile now and find it does provide adequate moisture to my facial skin. In their aid, it states this cream provides 100 hours of hydration to your skin. With that, I DON&#x27;T find that Claim to be accurate at all! At best, this moisturizer helps keep your skin hydrated for maybe 12 hours! I&#x27;ve made it a point to analyze this moisturizer to see how close, hour wise their claim would hold true. I&#x27;ve learned over the years when it comes to products like this with unrealistic claims, they never seem to materialize! That holds True with this moisturizer as well!! With a claim of 100 hours of moisturized skin, that&#x27;s OVER Four days, no way is that possible at all! Don&#x27;t get me wrong, this is a decent/Average product, but their claims of 100 hours of moisturized skin just isn&#x27;t accurate at all, at least based on my skin and testing. I do like this facial cream as it does provide for adequate moisture on your face. I appreciate this cream is Dermatologist tested. They&#x27;ve tested this product on sensitive skin and according to their test it passed that test. Their claim of &quot;rejuvenated&quot; skin is a stretch as well. YES, this Does hydrate your facial skin as well as your neck line. But to claim it rejuvenates your skin, no I don&#x27;t see that aspect at all! I do agree this cream helps to clear dull skin as it does that with the hydration aspect of this product. According to their add, they state they have a patent on this product which I do find as a positive. Their patent involves &quot;Triple-Capsule composed of Ceramide, fatty acid, and cholesterol&quot;. There&#x27;s really no way for me to prove or disapprove that claim without a clinical test on my end. I have sensitive skin and this product <strong>doesn&#x27;t irritate</strong> my skin at all. It&#x27;s easy to apply to your skin and goes on smooth and even. It&#x27;s not tacky at all and it absorbs quickly into your skin. They&#x27;ve stated this cream is cruelty free, free of mineral oils, artificial fragrance, and no artificial dyes. I applaud them for not testing on animals as that&#x27;s really important to me! I do like this product, but, I&#x27;ll call out &quot;claims&quot; when I find their NOT Accurate! ! I rate this moisturizer as an average facial cream that&#x27;s easily found on this platform. This cream has helped keep my facial skin moisturized and provide for a healthier appearance due to increased hydration to my skin. I&#x27;m completely Neutral with recommending this product. I view this as an Average Facial moisturizer, nothing more nothing less. Based on their price point, I find it really expensive as it&#x27;s just an average facial moisturizer. I Hope you find my Review Helpful, Thanks for Reading.\n"}, {"rating": 4, "date": "2022-10-05", "season": "other", "html": "Rich hydrating cream for dry skin. I have combo skin. Most super dry everywhere except around the nose and chin. My skin is also sensitive and reactive. I had no reactions or irritation while testing this product over the last two weeks. I use it every other night after washing my face before bed. I dont like to wash my face in the mornings because I find it gets irritated if I disturb it too much, so if I use a thick moisturizer nightly it would actually be too much for my skin and I&#x27;d end up with acne. This product is thick and creamy, and a little goes a long way. Like a typical barrier cream, it takes a bit to fully absorb, so while it sits on the skin you can feel a bit of tackiness. I have liked other Aestura products, but this is not my favorite barrier cream, I have actually used others that I found to be more light weight. If you are chronically dry this is a great <strong>non irritating</strong> option.\n"}, {"rating": 5, "date": "2026-07-29", "season": "summer", "html": "This is my new and best moisturizer that keeps my barrier in tact. I love this moisturizer. It works well on my sensitive skin. It <strong>doesn&#x27;t burn</strong> and keeps my skin barrier in tact. If you use regular retinal a, which I do, this works well to keep your skin well hydrated. I&#x27;m 68 years old for reference. My skin is combo/ sensitive. I have it on subscription and it&#x27;s well worth it. It&#x27;s less expensive than products such as Olay etc. and works so much better.\n"}], "lasting_hydration": [{"rating": 5, "date": "2026-06-28", "season": "other", "html": "Magical. Magic. This cream is a god send. I have really bad rosacea on my right cheek. Nothing has worked and I have spent a lot of money on expensive products and it never reduces the redness. This cream reduced redness within a week! A WEEK! I am beyond impressed. My face stays hydrated <strong>all day</strong> and is lightweight. This is worth every penny. Can&#x27;t wait to try more of the with products.\n"}, {"rating": 5, "date": "2026-05-30", "season": "other", "html": "Great vegan barrier cream with no irritation. The winter air wrecked my skin barrier in just a few spots. I have oily skin prone to breakouts and extremely sensitive to &quot;natural&quot; ingredients like botanicals. I tried this because it is targeting barrier health without any complicated actives or botanicals or anything else. I replaced my moisturizer entirely so this is used on the oily areas and dry spots. The dry spots went away and I have no irritation or breakouts after a few months of daily use. It "html": "Definitely keeps my dry skin moisturized. I have pretty dry skin and I was surprised by how long this lotion <strong>kept my face moisturized</strong>! It&#x27;s cool seeing the beads kind of melt into my skin and I also like how the packaging is travel-size friendly. But like the other reviews here, I would probably use this as a night moisturizer because it does feel a little too moisturizing in the day time unless you have super, super dry skin/ live in a dry environment. I brought this cream with me when I traveled to a relatively humid environment and I think my skin got clogged up and it became a bumpy texture because it got TOO moisturized, so be sure to patch test! I&#x27;ve been using the Cerave moisturizer on my face before I tried this one out. And after patch testing it for a few weeks, I don&#x27;t really see any physical differences between the two moisturizers to be honest. They both moisturized and hydrated my face overnight and the texture is pretty similar. Since I didn&#x27;t see a difference on my skin, I might stick to Cerave because it&#x27;s a bit more budget friendly. Overall, I&#x27;m glad I tried this product out! I think this is a great moisturizer because it does get the job done and it kept my skin moisturized for a long period of time.\n"}, {"rating": 5, "date": "2026-08-22", "season": "summer", "html": "Love this moisturizer. This is a great product, helps my skin stay hydrated <strong>all day</strong>! Highly recommend\n"}, {"rating": 5, "date": "2026-08-16", "season": "summer", "html": "The best lotion I have ever used! Great for dry, flaky, tight skin. Plays well with other products.. I wish I could give this product 100 stars! After trying so many face lotions, I finally found this. I used to have oily skin in my 20s, but something happened in my 30&#x27;s and my skin got tight, dry, and flaky. I used to be fine with just the cerave daily moisturizer, but then had to move to the thick cerave night cream. It worked well but  line has been a game-changer. Initially, I was concerned that it would be too greasy, but my skin actually absorbs it effortlessly. I&#x27;m already planning to repurchase it\n"}, {"rating": 3, "date": "2024-06-11", "season": "other", "html": "Great lotion aside from the plastic smell. As someone with sensitive skin, I did a lot of research before purchasing this cream. I love the consistency and find that it does <strong>help reduce the severity</strong> of aftermath from prescription retinol creams. However, I cannot get past the smell. It smells like freshly manufactured plastic. While it&#x27;s not overpowering, I would say the scent has a strength of 3/10, and that&#x27;s too much for me. Coming from someone who can handle and even enjoys the original Biologique Recherche Lotion P50 1970, that is saying a lot. When it really comes down to it, I think the smell makes me question the integrity and quality of the formulation. As a scientist and someone who is obsessed with skincare, I don&#x27;t want to put anything that isn&#x27;t the best on my skin. The ceramides are good though, I will give them that. Love the consistency as well.\n"}], "fragrance_satisfaction": [{"rating": 5, "date": "2026-06-27", "season": "other", "html": "Great product. Very good solid every day moisturizer. Good for sensitive skin, <strong>no scent</strong>, and melts into skin. Lightweight and not greasy at all. My skin loved it.\n"}, {"rating": 5, "date": "2026-05-18", "season": "other", "html": "Favorite everyday moisturizer!. I have tried just about every daily moisturizer there is out there and had never really found THE one until I came across this particular one. I have extremely sensitive/eczema prone skin and this is now my go to moisturizer. I use it morning and night. It&#x27;s highly moisturizing, yet non-greasy. Does not clog my pores or cause irritation. It is <strong>unscented</strong>. Relatively affordable price for how amazing this product is. I am already on my second tube and will continue to purchase!\n"}, {"rating": 4, "date": "2026-05-11", "season": "other", "html": "My Go-To Barrier Repair Cream for Dry &amp; Sensitive Skin ✨. Aestura Atobarrier 365 Cream is one of the best creams for dry, sensitive, and damaged skin barriers. It&#x27;s <strong>fragrance-free</strong>, deeply moisturizing, and perfect for days when your skin feels very dehydrated or irritated. I especially love using it after retinol because it calms and nourishes the skin without feeling harsh or heavy.\n"}, {"rating": 5, "date": "2026-04-19", "season": "other", "html": "Soothing and nonirritating, great with tretinoin. This is a very soothing, non-irritating cream, <strong>no scent</strong>. I use it under makeup and don&#x27;t have a problem with that, but my skin is normally very dry. I bought this after starting tretinoin. This cream is even more gentle and soothing than my favorite Clinique moisturizers. It gives my skin a subtle glow/shine that I like.\n"}, {"rating": 4, "date": "2025-10-17", "season": "other", "html": "Great hand cream. I&#x27;m not too pleased with this as a face cream but it is very effective as a hand cream. Definitely moisturizing with <strong>no scent</strong> so great for sensitive skin.\n"}, {"rating": 3, "date": "2024-06-15", "season": "other", "html": "Film Texture on Combination Skin. The absorption of the Aestura Face Moisturiser was not ideal. The cream took a long time to apply and felt like a film on my combination skin. However, the product is <strong>fragrance-free</strong> and may work better for people with dry skin in a dry climate.\n"}, {"rating": 3, "date": "2023-11-09", "season": "other", "html": "Decent moisturizer. I was excited to try this Korean brand but wasn&#x27;t overly impressed to be honest. Lightweight, I prefer a thicker cream, <strong>no scent</strong> really, haven&#x27;t noticed a major difference in using it. Probably won&#x27;t buy again.\n"}, {"rating": 3, "date": "2026-07-18", "season": "summer", "html": "Gentle but Greasy. It has <strong>no scent</strong> and is gentle on my dry, sensitive skin, but it&#x27;s greasy so I&#x27;ll only use it at night and use Paula&#x27;s Choice Resist during the day.\n"}, {"rating": 5, "date": "2026-07-07", "season": "summer", "html": "Moisturizing. One of my favorite creams to use at night. A <strong>light clean scent</strong> and feels cool and moisturizing but still light.\n"}], "value_for_money": [{"rating": 5, "date": "2026-05-18", "season": "other", "html": "Favorite everyday moisturizer!. I have tried just about every daily moisturizer there is out there and had never really found THE one until I came across this particular one. I have extremely sensitive/eczema prone skin and this is now my go to moisturizer. I use it morning and night. It&#x27;s highly moisturizing, yet non-greasy. Does not clog my pores or cause irritation. It is unscented. Relatively <strong>affordable</strong> price for how amazing this product is. I am already on my second tube and will continue to purchase!\n"}, {"rating": 4, "date": "2026-05-10", "season": "other", "html": "<strong>Good price</strong> for amount. Got a sample and loved it, and purchased the full size. I feel like it does a good job of moisturizing without being overly greasy.\n"}, {"rating": 4, "date": "2026-04-06", "season": "other", "html": "Moisture with out greasy feeling for mature skin. Lovely product Excellent <strong>value for money</strong>\n"}, {"rating": 4, "date": "2022-10-28", "season": "other", "html": "Expensive but great. Is the <strong>perfect size</strong> to take on a plane because it is under the 100 ml limit. It&#x27;s good to use all around your body as well as your face. It&#x27;s a bit expensive. That&#x27;s the only problem with it and that&#x27;s why I deducted one star. But if the price doesn&#x27;t bother you, you should get it.\n"}], "smooth_texture": [{"rating": 5, "date": "2026-04-29", "season": "other", "html": "Aestura autobarrier. I never write reviews. Im 63. Have had skin cancer. Rosacea ect...this stuff feels so WONDERFUL on my skin im in shock. <strong>Silky</strong> smooth soft n nourished. Its expensive but a little goes a long way. I just got it. Cant waite to see if my poor sun damaged skin gets better. But as a old disabled lady ill skip meals to buy some\n"}, {"rating": 5, "date": "2026-04-28", "season": "other", "html": "So <strong>silky</strong> soft. Love this stuff. Made a huge difference in my skin so far. Only been using for 2 weeks, But I&#x27;m very happy with results so far.\n"}, {"rating": 5, "date": "2026-04-07", "season": "other", "html": "Great barrier repair and restoration moisturizer. The Aestura Atobarrier 365 Cream is a really good moisturizer if your skin feels dry, irritated, or damaged from using strong skincare products. It is made to help repair and protect your skin barrier, so it works well when your skin feels tight, sensitive, or easily gets red. The texture is medium weight, so it <strong>feels smooth</strong> and moisturizing without being super thick. It gives a healthy, soft finish to my skin and works especially well for my normal, sometimes dry skin. For oily skin, though, I think it can be a little too much, especially during the day. I usually apply a thinner layer in the morning, to be able to put sunscreen on top. At night I anpply more to let it work in full Overall, it is a great cream for repairing the skin barrier and keeping skin hydrated, but oily skin types may like it more as a nighttime moisturizer.\n"}, {"rating": 5, "date": "2026-03-30", "season": "other", "html": "Great moisturizing cream. Very hydrating and gentle on the skin. It feels rich but absorbs well without being greasy. Leaves my skin <strong>soft and smooth</strong> really happy with it!\n"}, {"rating": 4, "date": "2023-07-23", "season": "summer", "html": "Great!. This moisturizer is reallyyyy <strong>silky</strong> smooth, moisturizing, and leaves my skin glowing every time I use it. The only bad thing is that it has a weird smell to it. Other than that it&#x27;s perfect!\n"}, {"rating": 4, "date": "2022-10-11", "season": "other", "html": "Good for those with dry skin and ok for those with combo skin. Not really for oily skin.. This review is for AESTURA ATOBARRIER365 CREAM | Long Lasting Hydration Facial Moisturizer for Dry &amp; Sensitive Skin | 80ml, 2.7 oz The brand Aestura is made by AmorePacific which is a pretty large cosmetics company in South Korea. I was interested because of it being an AmorePacific product. This is a thick product with little encapsulated ceramide beads in them. I think since it is a thicker product it works quite well for those with dry skin. For those with combo or oily skin, this might be better for night time use because it&#x27;s a bit heavier. The cream is thick and <strong>silky</strong> and the beads seem to absorb quickly and doesn&#x27;t make it feel like you&#x27;re trying to exfoliate. It does leave a slightly dewy/shiny look to the skin, but eventually absorbs. As for the scent, I don&#x27;t really smell much of anything with this product. If I have to say if I lean my nose super close I can pick up a slight plastic like scent to it. I would probably recommend this cream for dry or combo skin folks. If you have oily skin, maybe you can save it for winter time or when you use skincare that dries your skin out.\n"}, {"rating": 5, "date": "2026-07-14", "season": "summer", "html": "THE best moisturizer for a desert climate. I&#x27;ve lived in a desert climate for 20 years and have long been on the search for a moisturizer that could actually last the whole day. My friend brought this back for me from Korea a couple months ago and I&#x27;m straight obsessed. It <strong>feels so smooth</strong>, silky and lightweight with no pilling or shine. I&#x27;m happy to have this in my life and with perimenopause probably coming soon this arrived just in time. It&#x27;s a little pricey but I stocked up when it was on sale for prime\n"}, {"rating": 5, "date": "2026-07-09", "season": "summer", "html": "10/10. I am very serious when it comes to my skincare as I have dry skin. When I tell yall… this is the best facial cream I have ever used. So smooth and moisturizing, I use it at night and my face still <strong>feels smooth</strong> hydrated and glowy the next morning. A little goes such a long way, so it has lasted me quite a while, but safe to say I love this cream. A bit on the pricier side, but it&#x27;s definitely worth it if you have dry skin.\n"}]}, "labels": {"pf_barrier_damage": "피부장벽 손상 보유", "pf_sensitivity_irritation": "민감성 피부 보유", "pf_redness_rosacea": "붉은기/로사시아 보유", "pf_acne_prone_driver": "여드름성 피부 보유", "pf_social_recommendation": "SNS/인플루언서 추천으로 접함", "pf_kbeauty_preference": "K뷰티 선호로 시도", "pf_dry_skin_driver": "극건성 피부 보유", "pf_other_condition_trigger": "아토피/건선/TSW 보유", "pf_ingredient_based": "성분(비건/무향 등) 보고 선택", "un_breakout_reaction": "트러블/뾰루지 유발", "un_adverse_reaction": "자극/발진/알러지 반응 유발", "un_insufficient_moisture": "보습력 부족", "un_reformulation_complaint": "리뉴얼(포뮬러 변경) 불만", "un_no_effect_general": "효과 없음 (전반)", "un_scent_complaint": "화학약품/플라스틱 냄새 불만", "un_price_value_complaint": "가격/가치 불만", "un_packaging_shipping_issue": "배송/패키징 파손 및 오배송", "un_texture_heavy_greasy": "무겁고 유분감", "un_absorption_issue": "흡수 안 됨", "un_not_authentic": "정품 의심", "sat_lightweight_absorption": "가볍고 산뜻한 흡수력", "sat_gentle_non_irritating": "자극 없이 순한 사용감", "sat_lasting_hydration": "보습 지속력", "sat_condition_improvement": "특정 피부고민 개선 체감", "sat_fragrance_satisfaction": "무향/향 만족", "sat_value_for_money": "가성비 만족", "sat_smooth_texture": "부드러운 발림성/텍스처"}}};
const PRODUCT_KEYS = Object.keys(PRODUCTS);

let currentProduct = PRODUCT_KEYS[0];
let currentSeason = 'overall';
let openTag = null;

function DATA() { return PRODUCTS[currentProduct]; }

function maxVal(countsObj, prefix) {
  return Math.max(1, ...Object.keys(countsObj).filter(k => k.startsWith(prefix) && !k.endsWith('_avgrating')).map(k => countsObj[k]));
}

function renderProductTabs() {
  const container = document.getElementById('product-tabs');
  container.innerHTML = '';
  PRODUCT_KEYS.forEach(key => {
    const tab = document.createElement('div');
    tab.className = 'product-tab' + (currentProduct === key ? ' active' : '');
    tab.textContent = PRODUCTS[key].name;
    tab.addEventListener('click', () => {
      if (currentProduct === key) return;
      currentProduct = key;
      openTag = null;
      render();
    });
    container.appendChild(tab);
  });
}

function render() {
  renderProductTabs();
  const data = DATA();
  document.getElementById('product-title').textContent = data.name + ' — Amazon 리뷰 VOC 분석';
  document.getElementById('product-subtitle').textContent = data.meta + ' · 구매요인 & 만족 포인트 & Unmet Needs 키워드 태깅 · 태그를 클릭하면 관련 리뷰 발췌를 볼 수 있습니다 · ★는 해당 태그 리뷰들의 평균 평점';
  document.getElementById('note-box').textContent = '※ ' + data.note;

  const counts = data.counts[currentSeason];
  document.getElementById('kpi-n').textContent = counts.n;
  document.getElementById('kpi-rating').textContent = counts.avg_rating;

  renderList('pf-list', counts, 'pf_', 'pf');
  renderList('sat-list', counts, 'sat_', 'sat');
  renderList('un-list', counts, 'un_', 'un');
}

function renderList(containerId, counts, prefix, cls) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const keys = Object.keys(counts).filter(k => k.startsWith(prefix) && !k.endsWith('_avgrating') && counts[k] > 0);
  keys.sort((a,b) => counts[b]-counts[a]);
  const max = maxVal(counts, prefix);

  if (keys.length === 0) {
    container.innerHTML = '<div class="no-data">해당 시즌에는 데이터가 없습니다.</div>';
    return;
  }

  keys.forEach(key => {
    const count = counts[key];
    const pct = (count / counts.n * 100).toFixed(1);
    const avgR = counts[key + '_avgrating'];
    const label = DATA().labels[key] || key;
    const row = document.createElement('div');
    row.className = 'tag-row' + (openTag === key ? ' open' : '');
    row.innerHTML = `
      <div class="tag-name">${label}</div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${(count/max*100).toFixed(0)}%"></div></div>
      <div class="tag-avgrating">★${avgR != null ? avgR.toFixed(1) : '-'}</div>
      <div class="tag-count">${count}건 (${pct}%)</div>
      <div class="chev">▶</div>
    `;
    row.addEventListener('click', () => {
      openTag = (openTag === key) ? null : key;
      render();
      renderQuotes();
    });
    container.appendChild(row);

    if (openTag === key) {
      const qDiv = document.createElement('div');
      qDiv.className = 'quotes show';
      qDiv.id = 'quotes-inline';
      container.appendChild(qDiv);
    }
  });
}

function renderQuotes() {
  if (!openTag) return;
  const target = document.getElementById('quotes-inline');
  if (!target) return;
  let items = DATA().snippets[openTag.replace(/^pf_|^un_|^sat_/, '')] || [];
  if (currentSeason !== 'overall') {
    items = items.filter(it => it.season === currentSeason);
  }
  if (items.length === 0) {
    target.innerHTML = '<div class="empty-note">해당 시즌에는 매칭된 리뷰 발췌가 없습니다.</div>';
    return;
  }
  items.sort((a,b) => a.rating - b.rating);
  target.innerHTML = items.map(it => `
    <div class="quote-card">
      <div class="q-rating">★ ${it.rating}</div>
      <div class="q-body">
        <div class="q-snippet">${it.html}</div>
        <div class="q-meta">${it.date}</div>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentSeason = tab.dataset.season;
    openTag = null;
    render();
  });
});

render();
</script>
