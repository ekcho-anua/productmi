 is so great its worth it even if not on sale. It was so good I immediately bought 2 more for friends who also LOVE it."}, {"rating": 5, "date": "2026-08-23", "season": "summer", "html": "A+ Great Product for very Sensitive Skin. This is the most similar to the Korean country products. Thank you, works great. I don&#x27;t <strong>break out</strong>, no burning, or irritation. Great product and my skin glows. Closet to the authentic Korean products you can purchase in USA."}, {"rating": 2, "date": "2024-12-06", "season": "winter", "html": "Gave me cystic <strong>acne</strong>. I haven’t had such deep under the skin pimples in so long, maybe in 4years. But after using this for a couple nights, i started noticing cystic acne on my cheeks and forehead. If you have or used to have acne prone skin, I wouldn’t risk it. Maybe would be good for mature skin since it is very moisturizing."}, {"rating": 4, "date": "2026-06-17", "season": "other", "html": "Good product. I definitely see a difference in a good way. Only thing is when the weather is hot, I sweat with the face cream and I <strong>break out</strong>"}, {"rating": 1, "date": "2026-04-18", "season": "other", "html": "Beware this cream. Very disappointed with this product as it caused immediate cystic <strong>acne</strong> to develop where I applied it. Never had such a reaction to a facial cream ."}, {"rating": 1, "date": "2026-05-24", "season": "other", "html": "Low quality. Did not like this moisturizer at all. I have had numerous <strong>breakouts</strong> each time I have used it."}, {"rating": 1, "date": "2025-06-20", "season": "other", "html": "IRRITATING. When I tried it for a couple days, my skin went from clear to becoming <strong>acne</strong> filled in such a short period of time due to this product! It was heavy on the skin and it wasn’t as effective as I would have wanted it to have been. There was no hydration that came from this. It only made my skin even more dry. There was no “glow.” It made your face look like you dumped a whole gallon of oil onto your face."}, {"rating": 2, "date": "2024-05-20", "season": "other", "html": "Made me break out. I usually use the gel version but figured I’d try something a little thicker since it’s still cold up here. I <strong>broke out</strong> almost immediately after using this, kept using it for a week just in case my skin needed to get used to it but it kept getting worse. Switched back to the gel one and it went back to normal."}, {"rating": 2, "date": "2024-06-26", "season": "other", "html": "Acne inducing but wrinkle reducing. I had to stop using this product because it was making me have acne <strong>break out</strong>s. However, I will say that it gave me a nice glow, it felt nice, not greasy or heavy. Maybe a like sticky in the first few seconds of applying it. But it appeared to reduce any fine lines I had"}, {"rating": 2, "date": "2025-09-14", "season": "other", "html": "Not good. Made me <strong>break out</strong>"}, {"rating": 3, "date": "2025-12-01", "season": "winter", "html": "Hydrating but wasn’t for me.. Sigh… I read some reviews that warned about <strong>break out</strong>…and I woke up with one. It is hydrating though."}, {"rating": 3, "date": "2024-03-29", "season": "other", "html": "Too heavy for acne prone skin. I read the other reviews regarding acne but my quest for Korean glass skin quieted them in my mind. Unfortunately they were completely right. Two days after using the cream in the evening during my PM routine my skin started to <strong>break out</strong>. I’ve dealt with acne in my teens and 20s but haven’t had it in the last 10-15 years. Small white head pimples appeared and continued to pop up throughout the day. So this is a NO for me. Not great for acne prone skin. I will add that it’s found a new life as a rich hand cream for me. I suffer from dry cuticles and this cream is fantastic for a night rub. It doesn’t soak in quickly but it is deeply moisturizing. Overall-not great for a new prone skin but nice for dry body skin."}, {"rating": 3, "date": "2024-03-07", "season": "other", "html": "nice... but not for my skin type. tldr: has ingredients that sit on my skin instead of absorb into it; <strong>broke out</strong> as a result edit: i have now found out cetyl ethylhexanoate was the cause of my breakouts! i have dehydrated oily sensitive skin. i saw people say this moisturizer is gentle and moisturizing on tiktok and i decided i&#x27;d give it a try. i like the cooling effect it gives and it makes my skin feel really soft. but after a while i realized it leaves a greasy feeling to my face and i started breaking out. i researched the ingredients and i found it has Pentaerythrityl Tetraisostearate and Cetyl Ethylhexanoate which i&#x27;m pretty sure were the causes to my breakout. maybe the other versions of this moisturizer don&#x27;t have this but i don&#x27;t want to take my chances and buy again, i&#x27;m using this for my body instead :)"}, {"rating": 3, "date": "2025-06-15", "season": "other", "html": "Not for oily skin. I have oily skin so it was too thick for me and gave me <strong>breakouts</strong>. But my sister enjoyed it. Did not feel moisturizing enough for me since I have oily skin."}, {"rating": 1, "date": "2026-04-16", "season": "other", "html": "Canola oil ingredient. Didn’t realize one of the ingredients was canola oil. May have been why my face <strong>broke out</strong>."}, {"rating": 1, "date": "2026-07-06", "season": "summer", "html": "Pimples on my face now. Face <strong>broke out</strong>"}, {"rating": 1, "date": "2026-03-02", "season": "other", "html": "<strong>Clogged pores</strong> beware. My face is now closed comedone city after using this. Would not recommend as it has comedogenic ingredients. Sigh"}, {"rating": 1, "date": "2026-03-31", "season": "other", "html": "Not for me. This cream is definitely not for me. I <strong>broke out</strong> even in areas where I never break out."}, {"rating": 2, "date": "2025-02-27", "season": "other", "html": "Not for sensitive skin. Made my skin <strong>breakout</strong>."}, {"rating": 2, "date": "2026-08-20", "season": "summer", "html": "Too heavy. Caused me <strong>acne</strong>"}, {"rating": 3, "date": "2025-03-14", "season": "other", "html": "Good for the body, not the face. Good for the body, not the face, it makes me <strong>breakout</strong>........"}, {"rating": 5, "date": "2026-07-07", "season": "summer", "html": "Works Amazingly!. I have dishydrodic eczema on my hands. It itches, its inflammation, constant open skin, its super dry in spots while hydrated on other spots. My hands are beyond destrpyed at times. Due to the condition of my hands when <strong>breakouts</strong> happen, Ibused first aid lotion. I would rank it 6/10. By chance I purchased this lotion in a hope that it would heal my skin. It healed my fingers to 95% in 5 days. At day 2 I seen a complete turn around. My skin did not hurt or angry. This product has worked wonders on my hands. This will be my new go to for skin repair."}, {"rating": 3, "date": "2023-10-04", "season": "other", "html": "<strong>Broke out</strong>. I wanted to love this product but I broke out really bad after 3 days. I have dry sensitive skin"}, {"rating": 3, "date": "2022-10-29", "season": "other", "html": "Caused <strong>breakouts</strong>. This cream is super moisturizing and feels great, unfortunately many of the ingredients are comedogenic and caused a lot of clogged pores and breakouts for me."}, {"rating": 3, "date": "2020-07-29", "season": "summer", "html": "I wanted to like it... I wanted to like this , I have sensitive <strong>acne</strong> prone combination skin. This was too oily / thick for me. It felt to greasy afterwards. So I now just use it for my neck or body. Still really thick though. Maybe better for dryer skin"}, {"rating": 3, "date": "2023-08-05", "season": "summer", "html": "Very hydrating but made me <strong>breakout</strong>. Definitely hydrated my face but broke me out. I use it on my body"}, {"rating": 1, "date": "2026-05-12", "season": "other", "html": "Not for me. Face is <strong>breaking out</strong>"}, {"rating": 1, "date": "2025-09-17", "season": "other", "html": "Breakout. This product is awful I <strong>broke out</strong> in a terrible rash little bumps everywhere on my neck skin irrated and itchy do NOT buy this if I can give o stars I would."}, {"rating": 1, "date": "2026-04-12", "season": "other", "html": "Sensitive skin. Skin <strong>broke out</strong>"}, {"rating": 1, "date": "2025-08-15", "season": "summer", "html": "“I never break out, it’ll be fine”. I literally never react to or breakout from skincare products. Welp, guess what? I <strong>broke out</strong>. Horribly. Beyond unhappy, missed the return window by a day. Waste of $20."}, {"rating": 4, "date": "2026-04-08", "season": "other", "html": "No recomiendo para pieles tendencia a <strong>Acne</strong>. Tiende a obstruir los poros y generar granitos, por eso no la recomiendo en el uso facial, aunque en zonas como rodillas y codos, es perfecta."}, {"rating": 1, "date": "2025-07-23", "season": "summer", "html": "Not sensitive skin friendly. Product severely dried out my skin causing a sun burn like effect and <strong>breakouts</strong>. I had a clear face until I used it. Not sensitive skin friendly."}, {"rating": 1, "date": "2025-03-31", "season": "other", "html": "Clogged pores. This product is very hydrating, but it will clog up your pores. If you have sensitive/<strong>acne</strong> prone skin, avoid this product. I woke up with a face full of whiteheads."}, {"rating": 5, "date": "2026-08-07", "season": "summer", "html": "I Recommend. I have some areas on my face that get really dry and flaky. This moisturizes them well and makes my skin soft and smooth with no irritation or <strong>breakouts</strong>."}, {"rating": 1, "date": "2025-01-06", "season": "winter", "html": "Irritating to sensitive skin. Makes my face <strong>break out</strong> in hives every time I use it. Smells chemically too"}, {"rating": 4, "date": "2026-03-10", "season": "other", "html": "Was causing <strong>acne</strong>. Loved it at first. Then I figured out it was causing me cystic acne. I had to stop using it on my face 😔"}, {"rating": 1, "date": "2020-07-20", "season": "summer", "html": "Do Not Recommend - Bad Breakout. I used this cream on my face for a week and my skin <strong>broke out</strong> in cystic acne. I haven’t had that kind of bad acne in years. I stopped using it to see what would happen and my skin went back to normal. I don’t know what ingredients were aggravating, I use a lot of products but nothing like this has ever happened. Waste of money and a horrible product."}], "switched_away": [{"rating": 2, "date": "2026-03-19", "season": "other", "html": "Caused bumpy dry skin. I liked this at first, but after a few weeks of using I noticed my face was getting very dry and flakey and with a bumpy texture. Also wasn&#x27;t a fan of the sticky feeling it left. After <strong>switching to</strong> a different lotion my face is much better. Disappointed since everyone said this was the hg of face lotions.. 2 stars because maybe it&#x27;s just my skin type but I think like most viral products they start with a good formula and then switch to cheaper ingredients as more people start buying since the reviews started out good then get worse with time!"}, {"rating": 3, "date": "2025-11-02", "season": "other", "html": "Won’t <strong>repurchase. No</strong>t good for dry dry skin. If u wanna work it out u have to use hydrating serum n toner beforehand . What’s the use of buying then?? 😒I should have bought other hydrating creams . Fake advertisement."}, {"rating": 4, "date": "2026-06-24", "season": "other", "html": "not a <strong>repurchase. not no</strong>urishing enough and sometimes irritates my combination skin. i would recommend pyunkang yul calming moisture nourishing cream over this"}], "reformulation_complaint": [{"rating": 1, "date": "2026-06-05", "season": "other", "html": "New product formulation. I was in love with the old formula- used it for the past two years. I just recieved the <strong>new formula</strong> (unknowingly) that they have been slowly releasing over last year and it took longer to get to the US. My face has a rash, I’m breaking out and I’m also grieving the old product. I get married in a few months and it took me so long to find something that worked for my skin. I don’t understand why companies change a formula when they have such a great product to begin with. So disappointed!"}, {"rating": 1, "date": "2026-04-10", "season": "other", "html": "New Reformulation Sucks. <strong>Formula changed</strong> and is no longer good. This used to be my holy grail but after the formula changed, it did the opposite of what I liked it in the first place. After using the new reformulated moisturizer, I started breaking out and it’s no longer heavy and thick enough to moisturize my super dry skin. Illyoon ruined this product for me! I used to really like this moisturizer and was the only moisturizer I bought for years because it’s the only thick moisturizer that hasn’t broken me out and moisturized my super dry skin at the same time, it was gentle and gotten rid of my dry patches but now it does completely the opposite."}, {"rating": 2, "date": "2026-01-27", "season": "winter", "html": "Not great. This is <strong>not the original Korean formula</strong>"}, {"rating": 1, "date": "2026-07-15", "season": "summer", "html": "Gave me acne/closed comedones. Started giving me acne. The <strong>new formula</strong> gave me acne in places where I never had acne before"}, {"rating": 1, "date": "2026-03-29", "season": "other", "html": "BAD EXPERIENCE. I’ve been using this moisturizer for two years and was always happy with it. But the one I bought this time has a <strong>different texture</strong>, and ever since I started using it, I’ve been getting rashes."}, {"rating": 3, "date": "2020-07-26", "season": "summer", "html": "Big value if on a budget, but not cosmetically elegant. First, I was amazed by how big the tube I received was for this price-- it&#x27;s massive and will definitely last you a long time! I was looking for a replacement for my CeraVe Daily Moisturizing Lotion, since they&#x27;ve <strong>reformulat</strong>ed and it no longer works with me skin. I found this cream to be heavy but not very moisturizing. It feels like there is a layer on my skin, so I only use it at night since its a bit suffocating. The texture is the worse-- gritty from the encapsulated ceramides and thick and tacky. It legit feels like I&#x27;m rubbing elmer&#x27;s glue on my face (and my eyebrows get all glued down in weird ways, with the little capsules stuck in them.. just gross). I find my skin sticking to my pillow case at night, even when I&#x27;ve tried to move my skincare evening routine to a few hours before bed time. Its like the stickiness never goes away! It dries matte and then is greasy in the mornings.. never a nice &quot;glowy, dewey,&quot; or &quot;glass-like&quot; finish like I&#x27;ve read others mention. I found this strange since most of the reviews say the opposite about this moisturizer, so maybe my skin is just different. I&#x27;m still experimenting with different ways to use this to get it to work better for me (ex. apply to wet skin, before other moisturizers, after other moisturizers, increase dry times between layering steps, using it just on its own, day time vs night time, less product vs more product, etc.) because its such a large tube at such a low cost that I want it to work for me. Also it doesn&#x27;t irritate my sensitive skin and hasn&#x27;t caused any breakouts, so that gives me motivation to keep trying to make it work. For reference, I have dehydrated combination skin. Prone to blackheads in the t-zone and hormonal acne in the U zone So far I&#x27;ve been using this for about ten days. I will update this review if things change in the future."}, {"rating": 2, "date": "2025-05-24", "season": "other", "html": "Not a Soon Jung dupe. This is NOT a dupe for Soon Jung 2x barrier intensive cream. Since they <strong>reformulat</strong>ed, I’ve been trying to find a replacement. My skin likes the older watery consistency. This is a thick cream that you have to work into your skin. Does not leave you dewy at all. Disappointed."}, {"rating": 1, "date": "2025-12-29", "season": "winter", "html": "Why?. WATCH OUT: Illiyoon <strong>reformulat</strong>ed, again. This time they removed the ceramide capsules and added soybean oil. The texture is now a gel cream instead of a cream and now it’s less hydrating. Seems like Illiyoon is trying to move away from being dry &amp; sensitive skin friendly. Boooo 👎"}, {"rating": 1, "date": "2025-10-27", "season": "other", "html": "<strong>Formula has changed</strong>. Formula has seemed to have changed. I have been using this moisturizer for a year now and now this last bottle gave me an allergic reaction."}, {"rating": 4, "date": "2020-05-08", "season": "other", "html": "Great for short term use to rebuild damaged skin barrier. Updated review 9/27/25. I first used and reviewed this product back around 2020. It won&#x27;t let me leave a new review only edit my old one. This moisturizer has undergone at least 2 <strong>reformulat</strong>ions at this point. I loved the original and only switched because I still got dry patches with it. I attempted the first reformulation in 2022 and it smelled like paint thinner and I refused to use it. I had a really bad allergic reaction to Bioderma intense lotion and then an equally bad reaction to centella asiatica (which I bought to repair my skin) about a week later. This promises to repair your barrier by 90% in 3 days and I think that was true. At the height of my damaged skin barrier, this did not burn or make my skin feel dry/tight. My routine consisted of 1) wipe my face with distilled water, 2) spray hypochlorous acid spray and let it dry, 3) use Illiyoon cream. I did that for a week. By the next day of using this, it majorly lessened the redness due to barrier damage. By day 4, the pustules I had were significantly reduce. I used this for about 2 weeks and I do think it repaired my barrier. HWOEVER, this cream is now making the pustules reappear, my skin itchy, and a bit dry. I truly think this cream is only good for repairing barrier damage and not long term use. So I am switching face creams but keeping this for when I need to repair my skin again. I truly wish I could use this long term because I think it even reduced facial redness caused by my rosacea as well. I may try and see if my face can handle one application of this a day vs 2."}], "insufficient_moisture": [{"rating": 2, "date": "2026-04-26", "season": "other", "html": "Sad it’s not for me. Did not work for me. I had high hopes I have sensitive and dry skin. <strong>Does not hydrate</strong> my dry spots I am reapplying at least 3-4 times in a day. Once it dries my dry spots crack and flake and this hasn’t helped me at all. But on ither parts of my skin does feel moist. A little goes a long way it’s thick."}, {"rating": 2, "date": "2026-05-16", "season": "other", "html": "Didn&#x27;t work for me. <strong>Not very moistur</strong>izing and didn&#x27;t help my hand eczema at all"}, {"rating": 1, "date": "2026-04-01", "season": "other", "html": "No go for me! :(. I was really hoping to like this moisturizer, but it has caused my skin to break out! The dimethicone also pills up on my skin. It’s weird. It’s left my skin with a rough texture. It was <strong>not moistur</strong>izing at all for me. I’ve also realized that this product does not contain clean ingredients so I won’t be using it at all. No thanks!"}, {"rating": 3, "date": "2020-07-26", "season": "summer", "html": "Big value if on a budget, but not cosmetically elegant. First, I was amazed by how big the tube I received was for this price-- it&#x27;s massive and will definitely last you a long time! I was looking for a replacement for my CeraVe Daily Moisturizing Lotion, since they&#x27;ve reformulated and it no longer works with me skin. I found this cream to be heavy but <strong>not very moistur</strong>izing. It feels like there is a layer on my skin, so I only use it at night since its a bit suffocating. The texture is the worse-- gritty from the encapsulated ceramides and thick and tacky. It legit feels like I&#x27;m rubbing elmer&#x27;s glue on my face (and my eyebrows get all glued down in weird ways, with the little capsules stuck in them.. just gross). I find my skin sticking to my pillow case at night, even when I&#x27;ve tried to move my skincare evening routine to a few hours before bed time. Its like the stickiness never goes away! It dries matte and then is greasy in the mornings.. never a nice &quot;glowy, dewey,&quot; or &quot;glass-like&quot; finish like I&#x27;ve read others mention. I found this strange since most of the reviews say the opposite about this moisturizer, so maybe my skin is just different. I&#x27;m still experimenting with different ways to use this to get it to work better for me (ex. apply to wet skin, before other moisturizers, after other moisturizers, increase dry times between layering steps, using it just on its own, day time vs night time, less product vs more product, etc.) because its such a large tube at such a low cost that I want it to work for me. Also it doesn&#x27;t irritate my sensitive skin and hasn&#x27;t caused any breakouts, so that gives me motivation to keep trying to make it work. For reference, I have dehydrated combination skin. Prone to blackheads in the t-zone and hormonal acne in the U zone So far I&#x27;ve been using this for about ten days. I will update this review if things change in the future."}, {"rating": 2, "date": "2024-09-24", "season": "other", "html": "Helps during dermatitis flares, but <strong>does not moisturize</strong> the skin. Been using this product for several months now. When I apply it, it takes FOREVER to soak in, and even after an hour or two it still feels like the moisturizer just sits on top of my skin. Also it smells like a plasticy chemical out of the tube? Fortunately that doesn’t linger. My biggest complaint is it just doesn’t not moisturize. Even when applied to different parts of my body it’s like a thin film that eventually rubs off on my clothes :("}, {"rating": 2, "date": "2024-08-06", "season": "summer", "html": "<strong>Not moistur</strong>izing. This product was suggested by an IG influencer but it&#x27;s a miss for me. Definitely not moisturizing as it claims to be, I had better with my organic baby Pipette. I also need to mention, the bottle and application is messy, the bottle is very hard to squeeze out because it&#x27;s a &quot;thick&quot; cream but not moisturizing. 🤷♀️"}, {"rating": 2, "date": "2024-11-30", "season": "other", "html": "Cream. Disappointment with this product with all the hype that was given so disappointing it <strong>doesn&#x27;t moisturize</strong> my face as it should again with all the hype i wanted to try it and it&#x27;s it&#x27;s a thumbs down"}, {"rating": 3, "date": "2023-11-15", "season": "other", "html": "Not enough for dry skin.. With consistent use I’m finding out that my skin does not really like this. It’s <strong>not moistur</strong>izing enough, I have to put layers on for it too feel like enough, and by that point it feels like it’s clogging my pores. After it sinks in it feels like I didn’t put anything on my skin, &amp; not in a good way. I used this On and off to determine how I feel, &amp; I’m noticing the next morning after using this my skin does not look good. Idk how to describe it, just looks uneven &amp; unclean. But I do see how this could work for some people, just maybe not the driest of skin. I use it in my hands now just to use it up. Won’t repurchase."}, {"rating": 3, "date": "2024-03-08", "season": "other", "html": "<strong>Not moistur</strong>izing enough for a heavy-ish cream.. I had high expectations when it comes to this cream, after reading all the reviews. For a cream that’s advertised to be made for barrier repair, it’s not moisturizing enough. It feels a little heavy at first, which is fine for something said to be moisturizing, but once it dries down or absorbed into the skin, my face and hands didn’t feel any more moisturized than my regular moisturizer. Another thing I didn’t like is that the flip top/cap doesn’t close down all the way."}, {"rating": 3, "date": "2020-07-06", "season": "summer", "html": "<strong>Not moistur</strong>izing. So I find this not to be moisturizing. It’s ok for my oily areas but for my dry face (mainly all over, u-zone), my skin does feel a bit rough and dry. Yes it’s a repair skin barrier cream but it’s definitely not moisturizing. I think I need oils when it comes to my moisturizers. Another cream I use had just one oil ingredient in it and my face feels great! I may just end up giving this to my sister or continue to use on my oily areas (t-zone)."}, {"rating": 3, "date": "2020-07-16", "season": "summer", "html": "<strong>Not moistur</strong>zing enough. I agree with a few other reviewers who have stated that this cream isn&#x27;t moisturizing enough. I agree. I had to return for this reason. I also didn&#x27;t find this cream very soothing. It didn&#x27;t help to reduce redness or irritation."}, {"rating": 1, "date": "2026-04-08", "season": "other", "html": "Not good. <strong>Doesn&#x27;t hydrate</strong> your skin"}, {"rating": 1, "date": "2025-02-15", "season": "other", "html": "Too sticky. <strong>Not hydrating</strong> and drys sticky. Not sure why its so hyped. Went in trash."}, {"rating": 1, "date": "2025-04-09", "season": "other", "html": "Drying. <strong>Not moistur</strong>izing. Did nothing good for my skin."}], "flaking_pilling": [{"rating": 2, "date": "2026-03-19", "season": "other", "html": "Caused bumpy dry skin. I liked this at first, but after a few weeks of using I noticed my face was getting very dry and <strong>flake</strong>y and with a bumpy texture. Also wasn&#x27;t a fan of the sticky feeling it left. After switching to a different lotion my face is much better. Disappointed since everyone said this was the hg of face lotions.. 2 stars because maybe it&#x27;s just my skin type but I think like most viral products they start with a good formula and then switch to cheaper ingredients as more people start buying since the reviews started out good then get worse with time!"}, {"rating": 2, "date": "2026-04-26", "season": "other", "html": "Sad it’s not for me. Did not work for me. I had high hopes I have sensitive and dry skin. Does not hydrate my dry spots I am reapplying at least 3-4 times in a day. Once it dries my dry spots crack and <strong>flake</strong> and this hasn’t helped me at all. But on ither parts of my skin does feel moist. A little goes a long way it’s thick."}, {"rating": 1, "date": "2026-04-01", "season": "other", "html": "No go for me! :(. I was really hoping to like this moisturizer, but it has caused my skin to break out! The dimethicone also <strong>pills up</strong> on my skin. It’s weird. It’s left my skin with a rough texture. It was not moisturizing at all for me. I’ve also realized that this product does not contain clean ingredients so I won’t be using it at all. No thanks!"}, {"rating": 2, "date": "2025-11-19", "season": "other", "html": "Feels nice but is it nice?. Does anybody else feel like it <strong>flake</strong>s off? Like at the end of the day I’ll go to wash my face and have the product around my hairline and chin is flaking from products."}, {"rating": 5, "date": "2026-08-09", "season": "summer", "html": "worth the money. I have struggled with dry skin for a while, mostly on my forehead, that would <strong>flake</strong> and peel off. Other moisturizers I have tried felt like they worked, but not after a few hours had passed. This moisturizer sinks into the skin and keeps it feeling plump and soft into the next day. I will be repurchasing once I run out of my current tube."}, {"rating": 3, "date": "2019-12-15", "season": "winter", "html": "Good if you sleep alone.... It’s just ok for me. When I use this as an occlusive at the end of my routine, instead of staying moist so I can “slug it” - it dries overnight, then <strong>pills up</strong> into the most hideous grey balls - and spreads out across my sheets and pillowcase while I sleep. My skin looks good though. If you sleep alone and you are dying for some ceramides - this might work for you."}], "packaging_dispensing": [{"rating": 4, "date": "2026-07-25", "season": "summer", "html": "Good Moisturize. Feels good but extra thick so <strong>hard to get out</strong> of bottle"}, {"rating": 4, "date": "2026-07-06", "season": "summer", "html": "Good product. Very soothing, moisturizing. I find it <strong>hard to get the cream out</strong> of the tube, but no other complaints."}, {"rating": 4, "date": "2026-06-11", "season": "other", "html": "Jar instead of tube.. I love this cream but they really need to put it in a jar instead of a tube!!!! It get really <strong>hard to squeeze the cream out</strong>."}, {"rating": 2, "date": "2024-08-06", "season": "summer", "html": "Not moisturizing. This product was suggested by an IG influencer but it&#x27;s a miss for me. Definitely not moisturizing as it claims to be, I had better with my organic baby Pipette. I also need to mention, the bottle and application is messy, the bottle is very <strong>hard to squeeze out</strong> because it&#x27;s a &quot;thick&quot; cream but not moisturizing. 🤷♀️"}, {"rating": 4, "date": "2026-03-12", "season": "other", "html": "Very nice, hydrating but packaging needs a change. This product is wonderful but I truly hate the packaging. It is very thick cream so it’s <strong>difficult to squeeze out</strong>."}], "not_authentic": [], "adverse_reaction": [{"rating": 2, "date": "2026-01-17", "season": "winter", "html": "Worked great for my body, but not for my face. I used this cream during a time when my skin was breaking out and my skin barrier was damaged, and unfortunately it <strong>made my facial skin worse</strong>. It felt too heavy for my face during that period and didn’t agree with my skin. I didn’t want to waste it, so I started using it on my body instead, and it actually worked amazing there. It was very moisturizing, soothing, and helped with dryness without irritation. Overall, I wouldn’t personally use this on my face again, but it’s a great body moisturizer, especially if you need something rich and nourishing."}, {"rating": 1, "date": "2026-03-19", "season": "other", "html": "<strong>Caused redness and irritation</strong>!. It’s irritating and sticky. Barely even hydrating. Not suitable at all for dry or sensitive skin. Especially the sensitive part. The AESTURA Atobarrier moisturizer is a much better choice. I should’ve never tried this an alternative to it."}, {"rating": 1, "date": "2026-06-14", "season": "other", "html": "Awful. Not for sensitive skin. This <strong>gave me red itchy</strong>/stinging skin and my kid got a rash from it."}, {"rating": 1, "date": "2026-01-20", "season": "winter", "html": "Not clean ingredients!. Canola oil &amp; soybean in the ingredients! No wonder my sensitive skin <strong>said no thank you</strong>. Shame on influencers for pushing this garbage on us, and shame on me for biting. Not good, burned my hands and face and clogged my pores. Garbage!"}, {"rating": 1, "date": "2026-01-26", "season": "winter", "html": "Irritated my skin. Hot red and burning.. I’m sad this didn’t work for me. It <strong>made my skin red</strong> and irritated big time. My cheekbones were on fire for hours after. Something in it irritates my skin. I don’t know how this can be used on babies."}, {"rating": 4, "date": "2026-04-04", "season": "other", "html": "<strong>Caused slight irritation</strong>. =(. I loved the feel of this moisturizer and how gentle it appeared to be. But unfortunately, it caused slight irritation under my eyes and on my cheeks. I have combination skin that is very sensitive, so it could just be from that. Very rarely do I come across a moisturizer that causes irritation. It is usually caused from a cleanser. This product had no smell and was not greasy or heavy. It absorbed quickly and didn&#x27;t cause my pores to clog. It did take care of the dry skin very well. I wanted to love this product since a lot of people love it. I&#x27;m sure it will be perfect for most people. Thank you."}, {"rating": 4, "date": "2026-05-08", "season": "other", "html": "Didn’t work out for me. This product might work for some. It didn’t work for me.. even though the description says it is good for sensitive skin, this product broke me out with <strong>hives</strong> like bumps and red skin after two uses, I gifted it to a friend who doesn’t have super sensitive skin."}, {"rating": 2, "date": "2025-02-27", "season": "other", "html": "<strong>Not for sensitive skin</strong>. Made my skin breakout."}, {"rating": 2, "date": "2025-02-03", "season": "other", "html": "<strong>Allergic reaction</strong>. I really like that it’s unscented and the texture is beautiful, but my skin did not agree with it. I have never had a reaction to skincare so I was definitely surprised when I started developing a stinging red rash after application. The reaction was mild at first and I didn’t realize it was due to the moisturizer until I had been using it for a few days. It’s much worse now and painful. Be cautious if you have sensitive skin!!"}, {"rating": 4, "date": "2026-04-14", "season": "other", "html": "Illiyoon ceramide ato concentrate cream. This is a good moisturizer, however, I am almost 70 yrs old and have very dry skin. So , I need more moisture than this cream delivers. Overall, it’s good and works well under makeup. My skin is sensitive as well, this cream <strong>caused no irritation or rash</strong>."}, {"rating": 1, "date": "2025-10-27", "season": "other", "html": "Formula has changed. Formula has seemed to have changed. I have been using this moisturizer for a year now and now this last bottle gave me an <strong>allergic reaction</strong>."}, {"rating": 1, "date": "2025-01-13", "season": "winter", "html": "Really bummed. Caused me a severe reaction. I had really high hopes for this moisturizer. I used it once and had a horrible reaction to it. It was like a <strong>chemical burn</strong>. If you try this, maybe test it on a small place first. It’s been a week and my face and neck are still recovering. 😣"}, {"rating": 1, "date": "2026-04-15", "season": "other", "html": "Rash. <strong>Gave me a rash</strong>"}, {"rating": 1, "date": "2025-07-23", "season": "summer", "html": "<strong>Not sensitive skin friendly</strong>. Product severely dried out my skin causing a sun burn like effect and breakouts. I had a clear face until I used it. Not sensitive skin friendly."}, {"rating": 1, "date": "2024-01-01", "season": "winter", "html": "Pass. I was so excited to get my hands on this. It does have the perfect texture for dry skin and no scent fo sensitive skin. However, this <strong>made my skin itch</strong>. I have dry sensitive skin."}, {"rating": 1, "date": "2025-01-06", "season": "winter", "html": "Irritating to sensitive skin. Makes my face break out in <strong>hives</strong> every time I use it. Smells chemically too"}, {"rating": 1, "date": "2023-09-26", "season": "other", "html": "Bad batch?. This <strong>made my skin worse. Red</strong> and irritated. I then noticed that it has many tiny insoluble white particles in there. Not sure if it’s supposed to be there, or a bad batch"}, {"rating": 5, "date": "2026-07-07", "season": "summer", "html": "great product. I bought this for my son&#x27;s severe eczema. It helped him when he put it on, but complained that it <strong>made his skin itch</strong> more, and stopped using it. In an effort not to waste it, I started using it on my hands and face. It has made my skin so soft! It&#x27;s not oily and goes on smoothly. Since it was one of the few creams that actually did help my son&#x27;s eczema, I will attempt to have him try it again."}, {"rating": 5, "date": "2026-07-14", "season": "summer", "html": "Must buy!. I can’t say enough about this cream. My boss told me about it. <strong>Cause I was having some skin irritation</strong> like skin psoriasis and nothing has helped with the itching but this cream. Tried many prescribed ointment and creams. While they do work they sometimes leave white patches behind or skin discoloration. This cream does NOT! This will always be a staple of mine."}, {"rating": 1, "date": "2023-08-18", "season": "summer", "html": "NOT GOOD. this product <strong>caused chemical burns</strong> on my face. it also caused severe redness and irritation."}, {"rating": 1, "date": "2026-03-11", "season": "other", "html": "<strong>Allergic reaction</strong>. I was hopeful that this product would be fabulous which initially it was. My face felt amazing. After using I noticed my pores were larger &amp; I started getting hives around my eyes. Not sure why since I do not apply. My eyes are swollen underneath."}, {"rating": 4, "date": "2020-05-08", "season": "other", "html": "Great for short term use to rebuild damaged skin barrier. Updated review 9/27/25. I first used and reviewed this product back around 2020. It won&#x27;t let me leave a new review only edit my old one. This moisturizer has undergone at least 2 reformulations at this point. I loved the original and only switched because I still got dry patches with it. I attempted the first reformulation in 2022 and it smelled like paint thinner and I refused to use it. I had a really bad <strong>allergic reaction</strong> to Bioderma intense lotion and then an equally bad reaction to centella asiatica (which I bought to repair my skin) about a week later. This promises to repair your barrier by 90% in 3 days and I think that was true. At the height of my damaged skin barrier, this did not burn or make my skin feel dry/tight. My routine consisted of 1) wipe my face with distilled water, 2) spray hypochlorous acid spray and let it dry, 3) use Illiyoon cream. I did that for a week. By the next day of using this, it majorly lessened the redness due to barrier damage. By day 4, the pustules I had were significantly reduce. I used this for about 2 weeks and I do think it repaired my barrier. HWOEVER, this cream is now making the pustules reappear, my skin itchy, and a bit dry. I truly think this cream is only good for repairing barrier damage and not long term use. So I am switching face creams but keeping this for when I need to repair my skin again. I truly wish I could use this long term because I think it even reduced facial redness caused by my rosacea as well. I may try and see if my face can handle one application of this a day vs 2."}], "lightweight_absorption": [{"rating": 5, "date": "2026-08-01", "season": "summer", "html": "Great product!!. I have very dry skin that can get flaky, tight, red, irritated, etc. and I have had none of that since using this. It soaks in quickly and easily. It is <strong>not greasy</strong>. It does not make my face shiny. Several friends have commented that my skin looks better while I&#x27;ve been using this. The price is great also. I have paid SO much more for less product that does nothing. This is a bargain! I will say that I do live in a very dry area that also can be very cold (Colorado) so I will see how it goes over winter when my skin really gets bad. I recommend this to others with dry skin but I actually think the formula, the texture and how it goes on will work for any skin type."}, {"rating": 5, "date": "2026-07-17", "season": "summer", "html": "Absolutely buy this!. This is the most amazing moisturizer I&#x27;ve ever tried, periodt. I have The World&#x27;s Worst Skin and this is.the only thing that works for me. Eczema, rosacea, dermatitis, sensitivity, I only need to use it a couple of times a day as opposed to 5 with other products. My only complaint is with the tube itself. I bought the middle one this time, and the plastic is so thick I can&#x27;t squeeze out the cream! I use the lighter one as well on days when I do a full face treatment, and I got the soothing one as well for the 2 times a day itch attack. Well worth it. It fully <strong>absorbs quickly</strong> and leaves your face smooth and cool."}, {"rating": 5, "date": "2026-08-09", "season": "summer", "html": "Absolutely Heaven Sent — My Skin Has Never Felt This Soft. This stuff is HEAVEN SENT. Seriously, throw everything else away because this is the moisturizer. I’ve tried plenty of lotions and creams, but this one has completely changed my expectations for what a moisturizer can do. The hydration is incredible. I can genuinely go 2–3 days without applying lotion again after using this, and my skin still feels soft and moisturized. My elbows are probably the best example — they feel like they were given a completely new start. They went from being rough and dry to unbelievably soft. The texture surprised me because it’s much more watery and <strong>lightweight</strong> than I expected from a concentrated cream. It spreads really easily and doesn’t feel like you’re putting a thick, heavy layer of product on your skin. It does have a somewhat unusual scent. I would describe it as slightly medicinal, almost like the smell of a coated tablet/pill — not a capsule, specifically. Thankfully, the scent isn’t very strong and doesn’t bother me once it’s applied. The biggest thing for me is that it actually lasts. I don’t feel like I have to constantly reapply it throughout the day just to keep my skin from getting dry again. If you have extremely dry, rough skin or you’re tired of lotions that feel nice for five minutes and then disappear, try this. My skin feels genuinely transformed, and this has easily become one of my favorite moisturizers."}, {"rating": 5, "date": "2026-07-19", "season": "summer", "html": "Already purchased a 2nd tube!. This is my 2nd tube, however still on my 1st one - Just wanted to take advantage of prime day sale because so far, I love this stuff! It’s more affordable than the Biossance Omega Repair Cream I usually use and it seems to work! I’m 45 yrs old, Filipino/Puerto Rican, and tend to have drier skin. I’m starting to use tretinoin, which can make my face even drier while I figure out how many nights a week my face can handle it. I use every night after corsRx snail mucin and after tretinoin (2x/wk for now). I also use some mornings when I feel drier. Other mornings I use a slightly lighter weight moisturizer or the Drmtlgy tinted moisturizer with spf. I wouldn’t say this stuff is light weight but I don’t need a ton to feel moisturized, so it lasts awhile. It’s <strong>not greasy</strong> and doesn’t seem to clog pores. In the photos, tube on the left is the 1st I purchased &amp; on right is the new one. I’ll update later with the date I purchased the 1st tube. Sorry so long but hope this review helps!"}, {"rating": 4, "date": "2026-07-30", "season": "summer", "html": "A little heavy, but great otherwise!. A little bit thicker, but tbh I love it. I have fairly sensitive skin and it’s been doing a great job. I have combo-oily skin, and after 4 hours I have to blot, but after that I should b fine for another 4! I use a pea size amount every morning paired w a milky toner! I will say it’s moisturizing but <strong>not greasy</strong>, super simple and straight forward! Makes my skin glow and supports my barrier!"}, {"rating": 4, "date": "2026-07-24", "season": "summer", "html": "Quality Moisturizer. Really like this moisturizer -- silky application and <strong>lightweight</strong> without stink fragrance or looking greasy or oily. No shine, just hydrated and supple skin. I use it every morning and night, plus rhe price is right!!!!"}, {"rating": 3, "date": "2026-04-12", "season": "other", "html": "Not worth the hype or the price tag. Honestly this is a lightweight and <strong>non-greasy</strong> moisturizer but at the end of the day it&#x27;s just not worth the price, it doesn&#x27;t make my skin feel any different than an off-branded face moisturizer. I think this product has been overhyped especially considering it&#x27;s Korean skin care but CeraVe is more moisturizing and for a comparable price, La Roche-posay is much better quality"}, {"rating": 3, "date": "2026-04-07", "season": "other", "html": "Good for dry skin only. Good for ointment type moisturization.. This is a creamy textured cream. It covers the dry skin. It did not create any itching right away. The skin feels moisture after apply. It is <strong>non greasy</strong>. Absorption is excellent. It acts like a dry ointment with absolute absorption. However, it has created white bumpy heads on my jawline and chick. It is unexpected."}, {"rating": 5, "date": "2026-08-18", "season": "summer", "html": "Favorite Moisterizer. This is probably the best moisterizer that I&#x27;ve ever used before. I feel like it&#x27;s the only one that is actually hydrates my skin, especially in the wintertime when my face gets so dry and peels. This cream really helpde with that. It is fragrence-free like it states it is, and a little bit does go a long way. It&#x27;s a slightly thicker consistency when it comes out of the bottle, but when you apply it on your skin, it <strong>doesn&#x27;t feel greasy</strong> or heavy at all. It just soaks right into the skin and hydrates it so well."}, {"rating": 5, "date": "2026-08-26", "season": "summer", "html": "10/10 lotion. 10/10 love it, I had to level up to the big bottle because the smaller one went too fast. It absorbs really well in the skin, <strong>not greasy</strong> at all. It’s not creamy but it’s not thick either. I was experiencing really bad dry skin and this lotion healed me quickly."}, {"rating": 4, "date": "2026-06-12", "season": "other", "html": "<strong>Absorbs well</strong> and is hydrating. Worked really well...at first. Upon everyday use for months I did notice dry skin patches still. But, I do use a prescription retinol every night so that could be my problem. I still use this everyday and think that it&#x27;s one of the most moisturizing products I&#x27;ve used. I have also recommended this to friends as I love that it absorbs pretty quickly and has no fragrance so it&#x27;s great for sensitive skin."}, {"rating": 4, "date": "2026-05-02", "season": "other", "html": "Deeply Hydrating Cream That Works Well for Sensitive Skin. This is a rich, soothing moisturizer, <strong>non-greasy</strong> that really focuses on long lasting hydration. It has a thick but smooth texture that spreads easily and absorbs better than expected for something so nourishing. It is especially helpful for dry or sensitive skin, helping to calm irritation while strengthening the skin barrier over time. The hydration feels steady and lasting rather than temporary, which makes it a good option for both daily use and more intensive repair when skin feels dehydrated. Overall, this is a dependable moisturizer that prioritizes comfort and barrier support. It is not lightweight, but it is very effective for keeping skin soft, balanced, and well hydrated."}, {"rating": 4, "date": "2026-06-19", "season": "other", "html": "Satisfied!. I REALLY like this product, feels nice and <strong>not greasy</strong>"}, {"rating": 3, "date": "2024-01-07", "season": "winter", "html": "Sensitive skin review !!. I’ve tried a handful of moisturizers but due to my eczema and psoriasis on my face (extremely dry and sensitive skin) none really do the job like how my soon jung moisturizer does. I saw everyone swear up and down on this specific cream claiming it was <strong>lightweight</strong> but super hydrating. I gave it multiple chances for weeks at a time, but I noticed my skin soaked it up within an hour &amp; was left dry. The ceramides didn’t really do anything special to my skin, if anything my redness got more red. It didn’t break me out thankfully but I can see people with combination to oily skin having this moisturizer &amp; falling in love with it. No scent and a pretty hefty amount for the price!"}, {"rating": 5, "date": "2026-07-29", "season": "summer", "html": "Deep Hydration Without Feeling Greasy. This has become one of my favorite moisturizers. It&#x27;s rich enough to keep my skin feeling hydrated but doesn&#x27;t leave a heavy or greasy feeling. It <strong>absorbs well</strong>, layers nicely with the rest of my skincare routine, and leaves my skin feeling soft and comfortable. A little goes a long way, so the tube lasts longer than expected. If you have dry or sensitive skin and want a reliable everyday moisturizer, I definitely recommend giving this one a try."}, {"rating": 4, "date": "2026-06-11", "season": "other", "html": "Deffenitly Moisturizing!. <strong>Non-greasy</strong>, Fragrance- free, Light weight, and a pretty good amount for the price. I have combo skin and this is my holy graillllll &gt;,0,&lt;Definitely my go-to moisturizer"}, {"rating": 4, "date": "2026-02-24", "season": "other", "html": "Deeply moisturizing, velvet/matte finish. The winter uglies have approached, it’s the time of year when the dry air steals all the moisture out of your skin. I’ve been using this cream for about a month now, I’ve read that it does wonders for dry skin in the winter &amp; the rumors are true! My legs get a scaly appearance due to the dry climate and it’s entirely gone &amp; my partner has even complimented how soft my skin feels! The moisturizer is nice and thick but entirely <strong>lightweight</strong> and easy to rub in, you don’t need a lot ! it does unfortunately (possibly fortunate for you?) have a velvety/matte finish while I prefer a high gloss/glass skin finish. I just top it off with aquaphor &amp; problem solved!"}, {"rating": 5, "date": "2026-08-24", "season": "summer", "html": "Great product for an affordable price. Very nice face cream that is <strong>not greasy</strong>. My son loved it so much I had to reorder. The price is affordable."}, {"rating": 5, "date": "2026-08-09", "season": "summer", "html": "Excellent hydration for sensitive skin. This moisturizer is fantastic for dry, sensitive skin. It <strong>absorbs quickly</strong> without feeling greasy, and my skin stays hydrated for hours. A little goes a long way, and there&#x27;s no irritation at all. Highly recommend for anyone with sensitive or dry skin!"}, {"rating": 4, "date": "2026-04-15", "season": "other", "html": "Very rich and hydrating. I love this face cream. <strong>Absorbs quickly</strong>, leaving skin feeling hydrated. It comes in a really big container, filled to the top, however my container had a huge air bubble in it. The cream dropped a half an inch 😵💫 I have no way to weigh it. Hopefully filled by weight but it is disappointing."}, {"rating": 4, "date": "2026-05-28", "season": "other", "html": "Love this cream. Goes on nice and smooth. <strong>Not greasy</strong>"}, {"rating": 5, "date": "2026-08-23", "season": "summer", "html": "Penetrates my skin without greasy feel. Luxurious lotion! It’s <strong>non-greasy</strong> but rich. It penetrates and feeds my skin. I love it."}, {"rating": 5, "date": "2026-07-31", "season": "summer", "html": "good value and soothing. Great quantity for the price compared to other moisturizers. I believe my skin barrier is damaged (have skin that gets really oily, but <strong>lightweight</strong> moisturizers leave me dry and irritated), and this stuff has really calmed things down. Keeps my face feeling good all day, and no more shiny midday skin."}, {"rating": 4, "date": "2026-05-02", "season": "other", "html": "<strong>Not greasy</strong>. I like this cream. It leaves my face feeling good without a greasy feeling. I&#x27;ll keep trying it and might even purchase it again. :)"}, {"rating": 4, "date": "2026-05-17", "season": "other", "html": "Super price and immediate absorption. It really works <strong>non greasy</strong> and easy to apply"}, {"rating": 4, "date": "2026-03-30", "season": "other", "html": "Generally happy. Lovely <strong>non-greasy</strong> &amp; creamy moisturizer that is competitively priced for the size bottle (good value for dollar!). Absorbs easily and relatively lightweight. Only slight negative is a &quot;plastic&quot; smell to the cream. Not sure what&#x27;s the cause, but it&#x27;s there."}, {"rating": 4, "date": "2026-04-12", "season": "other", "html": "dont hesitate. lovely product, extremly moisturizing, <strong>lightweight</strong>, glowy finish. So happy I found this product"}, {"rating": 4, "date": "2026-03-13", "season": "other", "html": "<strong>Not greasy</strong> goes right into the skin absorbing very well. This lotion is ok it’s a little pricey not sure if I’ll buy it again"}, {"rating": 4, "date": "2025-08-19", "season": "summer", "html": "Fast Absorbing Moisturizer. I&#x27;ve used this for less than a month, so I can&#x27;t speak to any major noticeable changes in my skin. The cream itself feels very pleasant on the face and it <strong>absorbs quickly</strong>, which I love since I use this as a cream after my serums before bed and layer another cream on top. My skin definitely isn&#x27;t as dry, but I wouldn&#x27;t say I wake up glowing. However, all skin care takes time so hoping to continue seeing results"}, {"rating": 5, "date": "2026-07-19", "season": "summer", "html": "Non-greasy moisturizing lotion. It’s genuinely good. I have dry skin but don’t like greasy and sticky lotions. This one absorbs quickly, is <strong>not greasy</strong> or sticky and keeps my dry legs and arms moisturized all day. I need to check how it works in winter. So far, I am very satisfied and would highly recommend."}, {"rating": 4, "date": "2025-05-07", "season": "other", "html": "Good Morning Moisturizer. As someone with dry skin naturally, and on top of having dry skin, uses Tretinoin nightly, this is a pretty good moisturizer. It is WAY bigger than I expected, which is always a plus. As far as moisture goes, it’s about a 7/10 or 8/10 on my skin. I appreciate how quickly it absorbs into my skin and doesn’t cause any pilling when layering with my other skincare products. It is, in my opinion, best suited for daytime use, due to how <strong>lightweight</strong> it feels on the skin. I like to apply this moisturizer on slightly damp skin to maximize on the moisture factor, and then follow it up with my sunscreen. Overall, I’m very happy with my purchase."}], "lasting_hydration": [{"rating": 5, "date": "2026-08-29", "season": "summer", "html": "Best moisturizer on planet earth. In my 33 years of life I’ve tried hundreds of skincare products and this is hands down my favorite one. Before this, I was using a $350 moisturizer and I have seen far better results using this one. My skin is very sensitive and typically things don’t seem to work for me so I’m genuinely dumbfounded at the results from just 2 months of using this cream - it really is like a magic potion! As an adult my skin has never been this clear, balanced looking without redness, and supple. I haven’t worn makeup in over a month and this is the first time I’ve felt confident enough to go entirely without it. The routine I’m using is washing my face with water, drying it, spraying liberally with rosewater, putting pure rosehip oil on and then topping it with this cream. You only need a tiny bit so I’m certain this bottle used morning and night will last 6 months to a year. It provides lasting <strong>all day</strong> moisture but no odd texture or smell. It’s just the best!"}, {"rating": 5, "date": "2026-07-10", "season": "summer", "html": "Creamy, smoothing, <strong>all day</strong> moisture. I was influenced to try this product months ago and now I&#x27;m on my 2nd bottle. The product goes on easily, isn&#x27;t greasy, and is absorbed into the skin very well. By the end of the day, my skin looks amazing and is so soft and smooth, even in the dry climate I live in. I don&#x27;t wash my face every day (don&#x27;t come at me), so the container lasted much longer than I thought it would. I&#x27;m looking forward to trying some of their other products as well."}, {"rating": 3, "date": "2026-05-26", "season": "other", "html": "Feels good, thick cream.. Very thick. Feels good and <strong>lasts long</strong>. No &quot;special&quot; results yet."}, {"rating": 5, "date": "2026-08-27", "season": "summer", "html": "10/10 no notes. I’m glad I splurged on this… my skin barrier is perfect. I use bioderma micellar at night, hot water only + washcloth in the morning, then this <strong>all day</strong> every day. A few times a week I layer this thinly under 9.25% tretinoin. My skin is literally glowing, hydrated, and all my redness went away! This stuff is holy grail"}, {"rating": 5, "date": "2026-08-09", "season": "summer", "html": "worth the money. I have struggled with dry skin for a while, mostly on my forehead, that would flake and peel off. Other moisturizers I have tried felt like they worked, but not after a few hours had passed. This moisturizer sinks into the skin and <strong>keeps it feeling plump and soft into the next day</strong>. I will be repurchasing once I run out of my current tube."}, {"rating": 5, "date": "2026-08-24", "season": "summer", "html": "Essential. One of the best moisturizers...I use it for my face and it keeps me glowy and hydrated <strong>all day</strong>. It&#x27;s great for sensitive skin and it feels luxurious compared to other fragrance free products."}, {"rating": 5, "date": "2026-07-29", "season": "summer", "html": "Deep Hydration Without Feeling Greasy. This has become one of my favorite moisturizers. It&#x27;s rich enough to keep my skin feeling hydrated but doesn&#x27;t leave a heavy or greasy feeling. It absorbs well, layers nicely with the rest of my skincare routine, and leaves my skin feeling soft and comfortable. A little goes a long way, so the tube <strong>lasts long</strong>er than expected. If you have dry or sensitive skin and want a reliable everyday moisturizer, I definitely recommend giving this one a try."}, {"rating": 5, "date": "2026-05-08", "season": "other", "html": "A Korean&#x27;s Intense Allergy Season Remedy. I held off on purchasing this for a while - honestly thought it might just feel a bit... generic or &quot;whatever&quot; because of the price point. It&#x27;s been just over 1 month of using it multiple times daily. I felt like I was going through such a specific situation where I already have dry and combo/oily hormonal skin (comes with flakiness and redness) and allergy season, especially in dry Colorado has been absolutely brutal. My nose for the most part has looked like it had little shards of glass sticking out. Hard to exfoliate when it&#x27;s already so raw. There are many favorites for [Korean] skincare, but this is a really sensitive time for my skin, along with the intense sun here. My review comes with glorious sneezing and blowing my nose <strong>all day</strong>, already predisposed flaky skin. I&#x27;ve been applying this moisturizer very frequently, because yes, unfortunately regardless of product, any lotion comes off with vigorous nose blowing. I&#x27;d say at least 5 times throughout the day. It has been heavy enough to protect my skin in this sensitive spot, but not feel greasy. Clearly I cannot speak too much on longevity because I wipe it off unintentionally. While having searched for a long while for a bang-for-your-buck, but still good quality, luxury feeling moisturizer for allergy season, I have no regrets having pulled the trigger on this one. A tip for any, any facial skincare is to leave your face a little damp before application. For these throughout-the-day applications, I usually wet my hand a wee bit first. (+ At this time, I&#x27;m using the Haruharu Wonder Black Rice Moisture Airyfit Daily Sunscreen 1.69fl.oz alongside it because WEAR YOUR SUNSCREEN!!!)"}, {"rating": 5, "date": "2026-08-16", "season": "summer", "html": "One of my favorite products of all time. I am 2+ years into TSW and I LOVE this lotion. One of only two products I use. A little on my face keeps me comfortable <strong>all day</strong>."}, {"rating": 5, "date": "2026-07-31", "season": "summer", "html": "good value and soothing. Great quantity for the price compared to other moisturizers. I believe my skin barrier is damaged (have skin that gets really oily, but lightweight moisturizers leave me dry and irritated), and this stuff has really calmed things down. Keeps my face feeling good <strong>all day</strong>, and no more shiny midday skin."}, {"rating": 5, "date": "2026-07-07", "season": "summer", "html": "Great for <strong>all day</strong> wear. This cream is my new love. It is so soft and light weight. It is heavier than the lotion but still soaks into my skin well. It is very smooth upon application, so you d9n&#x27;t need a lot. It is easy to use. The tub bolds a large quantity and I&#x27;ll be surprised if I need to purchase it more that twice a year. It does not have any scent, so that makes it very versatile with perfumes you wear."}, {"rating": 5, "date": "2026-07-19", "season": "summer", "html": "Non-greasy moisturizing lotion. It’s genuinely good. I have dry skin but don’t like greasy and sticky lotions. This one absorbs quickly, is not greasy or sticky and keeps my dry legs and arms moisturized <strong>all day</strong>. I need to check how it works in winter. So far, I am very satisfied and would highly recommend."}], "fragrance_satisfaction": [{"rating": 3, "date": "2026-05-09", "season": "other", "html": "Wanted it more greasy.. It’s OK. I do not feel any ceramide beads, as I expected. This is not as greasy as I wanted. It doesn’t irritate however and applies easily. It does not leave a shine. I like the flat container. I got travel size, under 3 oz. <strong>No scent</strong>. Prolly wouldn’t buy again, but I will use this one til finished."}, {"rating": 5, "date": "2026-08-09", "season": "summer", "html": "Goodbye dry skin. I have purchased cream after cream trying to find the right fit for my dry skin until now. I have spent hundreds, thousands of dollars searching for a cream that has <strong>no smell</strong> and doesn’t make me sick. After just one night I see the difference and my skin actually absorbed the cream! Usually the cream sits on my face and nothing happens after it is washed off- my skin is back to dry as if I never used the cream. This morning I woke up to smooth, hydrated skin on my face. Even my makeup looked amazing! I recommend this cream to those sensitive to smells and with dry skin."}, {"rating": 5, "date": "2026-08-18", "season": "summer", "html": "ideal for sensitive skin. If you need to restore your skin barrier, this ceramide moisturizer is one of the best options. I like that it’s vegan and <strong>fragrance free</strong>. I really appreciated that during my first trimester of pregnancy when I couldn&#x27;t tolerate strong smells. It leaves my skin hydrated and very soft, I can use it on both my face and body, and it’s ideal for sensitive skin."}, {"rating": 4, "date": "2026-06-12", "season": "other", "html": "Absorbs well and is hydrating. Worked really well...at first. Upon everyday use for months I did notice dry skin patches still. But, I do use a prescription retinol every night so that could be my problem. I still use this everyday and think that it&#x27;s one of the most moisturizing products I&#x27;ve used. I have also recommended this to friends as I love that it absorbs pretty quickly and has <strong>no fragrance</strong> so it&#x27;s great for sensitive skin."}, {"rating": 4, "date": "2026-06-19", "season": "other", "html": "As described.. A mild moisturizer like the bottle says. <strong>No smell</strong>. Good absorption; easy to rub in. Didn’t see a noticeable difference in my skin from the product alone. Okay value."}, {"rating": 3, "date": "2025-07-12", "season": "summer", "html": "Has a smell but not a fragrance. I want to like this but the smell is a little off putting. Its <strong>fragrance free</strong> but it definitely has a smell I cant describe. I almost wish it had an actual light fragrance to it:/"}, {"rating": 3, "date": "2024-01-07", "season": "winter", "html": "Sensitive skin review !!. I’ve tried a handful of moisturizers but due to my eczema and psoriasis on my face (extremely dry and sensitive skin) none really do the job like how my soon jung moisturizer does. I saw everyone swear up and down on this specific cream claiming it was lightweight but super hydrating. I gave it multiple chances for weeks at a time, but I noticed my skin soaked it up within an hour &amp; was left dry. The ceramides didn’t really do anything special to my skin, if anything my redness got more red. It didn’t break me out thankfully but I can see people with combination to oily skin having this moisturizer &amp; falling in love with it. <strong>No scent</strong> and a pretty hefty amount for the price!"}, {"rating": 5, "date": "2026-08-24", "season": "summer", "html": "Essential. One of the best moisturizers...I use it for my face and it keeps me glowy and hydrated all day. It&#x27;s great for sensitive skin and it feels luxurious compared to other <strong>fragrance free</strong> products."}, {"rating": 5, "date": "2026-08-11", "season": "summer", "html": "Rosacea dry skin loves!. My rosacea dry skin loves this!!! It’s so thick but doesn’t take forever to rub in. It takes a few seconds which I love. It makes my skin feel so hydrated and it doesn’t leave me greasy feeling. There is <strong>no scent</strong> which is nice too. Fragrance-free. It lasts a long time and a little goes a long way."}, {"rating": 5, "date": "2026-08-01", "season": "summer", "html": "Sensitive skin approved. I tried this for the first time 4 months ago on a trial run as i have sensitive skin and not a lot of things are compatible with my skin. I use this every day as my morning AND night moisturizer. There is <strong>no fragrance</strong>. It leaves my skin glowing and hydrated without a greasy feeling. If you have sensitive skin i would highly recommend trying this product."}, {"rating": 4, "date": "2026-04-04", "season": "other", "html": "Caused slight irritation. =(. I loved the feel of this moisturizer and how gentle it appeared to be. But unfortunately, it caused slight irritation under my eyes and on my cheeks. I have combination skin that is very sensitive, so it could just be from that. Very rarely do I come across a moisturizer that causes irritation. It is usually caused from a cleanser. This product had <strong>no smell</strong> and was not greasy or heavy. It absorbed quickly and didn&#x27;t cause my pores to clog. It did take care of the dry skin very well. I wanted to love this product since a lot of people love it. I&#x27;m sure it will be perfect for most people. Thank you."}, {"rating": 5, "date": "2026-08-04", "season": "summer", "html": "Give it a Try!. I like this moisturizer. It has a thicker cream consistency. I have very sensitive skin and this hasn’t burned or bothered my skin at all. <strong>Fragrance free</strong>. I believe ChatGPT recommended this for me. I didn’t even know this brand existed. Give it a try!"}, {"rating": 5, "date": "2026-07-11", "season": "summer", "html": "Just buy it. Genuinely the real deal. No fancy packaging, no BS mystery ingredients. Insane value and the best moisturizer I&#x27;ve used living here in the desert. Maybe couple it with a panthenol cream every few days for barrier repair but genuinely the best moisturizer for the money I&#x27;ve ever used. Huge bottle so you don&#x27;t feel bad about using it on your body too. <strong>No fragrance</strong> is awesome. Very light for being so moisturizing too. Use it anywhere and everywhere because it&#x27;s so economical!"}, {"rating": 4, "date": "2026-03-20", "season": "other", "html": "One of my new Go tos. The bottle I bought was bigger than I thought but I’m glad because it works well! Only have to apply a little and it lasts. <strong>No smell</strong>,no sting and my skin has been looking suppler"}, {"rating": 5, "date": "2026-07-23", "season": "summer", "html": "Finally found it!!. I was looking for a thick moisturizer and found it in this. It goes into my skin and does not sit on top. I&#x27;m older and kind of dry so Illiyoon fits the bill for me. Makes my face and neck area feel supple. <strong>No fragrance</strong> which is a HUGE plus!"}, {"rating": 4, "date": "2025-06-13", "season": "other", "html": "Moisturizing and good for my dry-combo skin!. I like this product! It is one that I will repurchase over and over! It is very moisturizing especially for my dry to combo skin! It is non irritating and has <strong>no scent</strong>. Love love lveeee"}], "value_for_money": [{"rating": 5, "date": "2026-07-14", "season": "summer", "html": "Chronically dehydrated skin helper!. Note for people with hypothyroidism and have chronically dehydrated skin! Ive found this lotion to be long lasting in leaving my skin feeling moisturized. I take daily doses of supportive supplements and try to drink enough water but this lotion helps lock everything in. It feels amazing! I buy the giant tub which is a <strong>great value</strong>. Doesn&#x27;t leave my skin greasy, only moisturized. The smaller tubes are great on the go too (especially frequent hand washers). I use for face and body routine! I rarely leave ratings but this product has helped me in so many ways. Apply fresh out of the shower and/or fresh face washing!"}, {"rating": 5, "date": "2026-08-01", "season": "summer", "html": "Excellent Quality for a Reasonable Price. A little <strong>goes a long way</strong> with this facial cream. It is very absorbent and feels great, not heavy or greasy. It is best applied to slightly damp skin and locks in moisture. It is great for sensitive skin and does not cause irritation or breakouts. It did not aggravate my rosacea. For the quality of the product, it is an excellent price. I highly recommend it!"}, {"rating": 5, "date": "2026-07-19", "season": "summer", "html": "Already purchased a 2nd tube!. This is my 2nd tube, however still on my 1st one - Just wanted to take advantage of prime day sale because so far, I love this stuff! It’s more <strong>affordable</strong> than the Biossance Omega Repair Cream I usually use and it seems to work! I’m 45 yrs old, Filipino/Puerto Rican, and tend to have drier skin. I’m starting to use tretinoin, which can make my face even drier while I figure out how many nights a week my face can handle it. I use every night after corsRx snail mucin and after tretinoin (2x/wk for now). I also use some mornings when I feel drier. Other mornings I use a slightly lighter weight moisturizer or the Drmtlgy tinted moisturizer with spf. I wouldn’t say this stuff is light weight but I don’t need a ton to feel moisturized, so it lasts awhile. It’s not greasy and doesn’t seem to clog pores. In the photos, tube on the left is the 1st I purchased &amp; on right is the new one. I’ll update later with the date I purchased the 1st tube. Sorry so long but hope this review helps!"}, {"rating": 5, "date": "2026-08-05", "season": "summer", "html": "I&#x27;m a believer!. I got influenced to try this, so I bought the smaller 2.53 oz to try it out. I love it and will definitely be repurchasing the larger size going forward. It is deeply hydrating. I use it as my night Moisturizer after my nightly adapalene. No more irritation from my adapalene and I&#x27;ve been able to increase the number of nights per week. I also use it on my decollete area and as a hamd cream. I love this stuff! It works better and is more <strong>affordable</strong> than other barrier creams."}, {"rating": 5, "date": "2026-08-14", "season": "summer", "html": "Very hydrating.. This is amazing stuff. Hydrates my skin without making my es a long way</strong>, so the tube lasts longer than expected. If you have dry or sensitive skin and want a reliable everyday moisturizer, I definitely recommend giving this one a try."}, {"rating": 5, "date": "2026-08-21", "season": "summer", "html": "Dryness on my skin. This cream is excellent high-quality cream for dry and sensitive skin. I use it all over my body as well, very <strong>affordable</strong> too; just love it!"}, {"rating": 5, "date": "2026-08-24", "season": "summer", "html": "Great product for an <strong>affordable</strong> price. Very nice face cream that is not greasy. My son loved it so much I had to reorder. The price is affordable."}, {"rating": 5, "date": "2026-08-09", "season": "summer", "html": "Excellent hydration for sensitive skin. This moisturizer is fantastic for dry, sensitive skin. It absorbs quickly without feeling greasy, and my skin stays hydrated for hours. A little <strong>goes a long way</strong>, and there&#x27;s no irritation at all. Highly recommend for anyone with sensitive or dry skin!"}, {"rating": 5, "date": "2026-07-31", "season": "summer", "html": "<strong>good value</strong> and soothing. Great quantity for the price compared to other moisturizers. I believe my skin barrier is damaged (have skin that gets really oily, but lightweight moisturizers leave me dry and irritated), and this stuff has really calmed things down. Keeps my face feeling good all day, and no more shiny midday skin."}, {"rating": 4, "date": "2026-03-30", "season": "other", "html": "Generally happy. Lovely non-greasy &amp; creamy moisturizer that is competitively priced for the size bottle (<strong>good value</strong> for dollar!). Absorbs easily and relatively lightweight. Only slight negative is a &quot;plastic&quot; smell to the cream. Not sure what&#x27;s the cause, but it&#x27;s there."}, {"rating": 5, "date": "2026-08-08", "season": "summer", "html": "non-irritating. Zero irritation. Emollient enough for my extra dry skin from climate and hormones. Packaging is un-fancy making it good for my purse and dispensing a controlled amount. <strong>Affordable</strong>! Thank you."}, {"rating": 5, "date": "2026-08-09", "season": "summer", "html": "Love it!. Love this moisturizer for all seasons! It is light weight and hydrating. It also last a long time, a little <strong>goes a long way</strong>."}, {"rating": 4, "date": "2025-12-31", "season": "winter", "html": "<strong>Great value</strong> for sensitive skin. I have extremely sensitive skin and this has seemed to be a great moisturizer during these harsh winter months that doesn’t bother or irritate my skin. It goes on nicely"}, {"rating": 4, "date": "2024-08-30", "season": "summer", "html": "Needs better packaging. I like the cream and the option of a <strong>big value size</strong>. The problem is that it really needs a sturdier inner lid. A flimsy piece of plastic doesn&#x27;t do anything to protect the interior of the main lid and when I received it, the plastic piece had mixed in with the cream. I had to spend some time fishing it out and trying to scrape the cream back into the container since I didn&#x27;t want to waste product. Also, the jar was packed in the shipper box with no packing filler. So it was just sliding around in the box as it traveled to me. I&#x27;m sure that contributed to the cream splattering all over the inner lid and the flimsy plastic becoming imbedded in the cream. Not a great way to receive a new product. Update (1/12/25): my second tub arrived with no problems. No complaints. It&#x27;s a great cream, especially now that we&#x27;re into the heart of winter. It offers stellar protection and moisturization. Will be repurchasing."}, {"rating": 5, "date": "2026-08-12", "season": "summer", "html": "Feels good. It feels nice, a little <strong>goes a long way</strong>. Helps clear up my face."}], "condition_improvement": [{"rating": 5, "date": "2026-07-13", "season": "summer", "html": "As close to a Miracle Cream as possible!. This is  asiatica (which I bought to repair my skin) about a week later. This promises to repair your barrier by 90% in 3 days and I think that was true. At the height of my damaged skin barrier, this did not burn or make my skin feel dry/tight. My routine consisted of 1) wipe my face with distilled water, 2) spray hypochlorous acid spray and let it dry, 3) use Illiyoon cream. I did that for a week. By the next day of using this, it majorly lessened the redness due to barrier damage. By day 4, the pustules I had were significantly reduce. I used this for about 2 weeks and I do think it <strong>repaired my barrier</strong>. HWOEVER, this cream is now making the pustules reappear, my skin itchy, and a bit dry. I truly think this cream is only good for repairing barrier damage and not long term use. So I am switching face creams but keeping this for when I need to repair my skin again. I truly wish I could use this long term because I think it even reduced facial redness caused by my rosacea as well. I may try and see if my face can handle one application of this a day vs 2."}], "smooth_texture": [{"rating": 4, "date": "2026-07-24", "season": "summer", "html": "Quality Moisturizer. Really like this moisturizer -- <strong>silky</strong> application and lightweight without stink fragrance or looking greasy or oily. No shine, just hydrated and supple skin. I use it every morning and night, plus rhe price is right!!!!"}, {"rating": 4, "date": "2026-05-28", "season": "other", "html": "Love this cream. <strong>Goes on nice</strong> and smooth. Not greasy"}, {"rating": 5, "date": "2026-08-28", "season": "summer", "html": "<strong>Feels great on</strong> my skin. Love it!"}, {"rating": 4, "date": "2025-12-31", "season": "winter", "html": "Great value for sensitive skin. I have extremely sensitive skin and this has seemed to be a great moisturizer during these harsh winter months that doesn’t bother or irritate my skin. It <strong>goes on nice</strong>ly"}], "makeup_friendly": [{"ratin ew spots. I have oily skin prone to <strong>breakouts</strong> and extremely sensitive to &quot;natural&quot; ingredients like botanicals. I tried this because it is targeting barrier health without any complicated actives or botanicals or anything else. I replaced my moisturizer entirely so this is used on the oily areas and dry spots. The dry spots went away and I have no irritation or breakouts after a few months of daily use. It&#x27;s rich and luxurious feeling, but not heavy or goopy. My skin feels soft and smooth all day. I was surprised that it leaves some glow as heavier creams tend not to. It&#x27;s lovely. One odd thing: I have never felt the little beads the company and reviews mention. Mine is always perfectly smooth. Hopefully that&#x27;s ok and not bad product.\n"}, {"rating": 5, "date": "2026-05-29", "season": "other", "html": "Good for <strong>Acne</strong> &amp; Closed Comedones. Healed my skin\n"}, {"rating": 4, "date": "2026-05-25", "season": "other", "html": "Feels Great. Not for <strong>Acne</strong> Prone Skin. This stuff works at creating a nice barrier on your skin, but it is pore clogging. If you have trouble with clogged pores or acne, I do not recommend it.\n"}, {"rating": 5, "date": "2026-05-25", "season": "other", "html": "this is amazing… (long time user). I will forever repurchase this cream. It saved my skin barrier and made it easier for me to start using adapalene and minimize reaction/side effects. It is a bit greasy on my skin as my skin is in general bad at absorbing products. My friend who purchased this cream after my recommendation doesn&#x27;t seem to have the greasiness problem at all. Because of this, I use it as a rich night cream or whenever I am home all day. I started using this cream a while back, at the end of 2025 if i remember correctly. And I went through at least 3 tubes since. My skin is unrecognizable. It made my skin barrier healthy enough to allow my skin to heal annoying and persistent <strong>acne</strong>
