 born. I&#x27;ve been using this barrier cream for about 2 months, since I went to Sephora looking for a light foundation that wouldn&#x27;t worsen the PD. When I was frustrated that every foundation made my skin look so dried and cracked and just old, an employee recommended we wash my face and apply this barrier cream. When I say it made A WORLD OF DIFFERENCE. I now use this around the mouth at night after washing, and all over before applying make up —— not only does my make up look flawless on top of this cream, but the PD is now almost completely gone (and I am feeling hopeful it will now disappear completely once I am done Bf&#x27;ing my baby) Long story short, if you&#x27;re having any dryness, you need this cream. It&#x27;s worth every cent.\n"}, {"rating": 1, "date": "2026-04-07", "season": "other", "html": "<strong>Breakouts</strong>. Caused me ridiculous amounts of breakouts in the form of comedones, pimples (didn&#x27;t even know I could still get those). My skin appeared extremely greasy and shiny for the period I used it. I highly recommend skipping this - I&#x27;ve now got a lot of work to undo the damage\n"}, {"rating": 5, "date": "2026-03-25", "season": "other", "html": "great product for sensitive skin and healing skin barrier. this face cream is great. i have pretty sensitive skin and have <strong>break out</strong> or get skin irritation really easily and this did not cause me any issues. it really helped my skin barrier so much. i would say the formula can be light or heavier depending on the amount you use. i use a lighter amount in the morning and more at night. i will be getting this again once i run out.\n"}, {"rating": 5, "date": "2026-03-23", "season": "other", "html": "Best moisturizer esp with actives like Tret. Such a great moisturizer. Thick but not greasy, moisturizing but not heavy. Absorbs so well. I am oily and <strong>acne</strong> prone and this moisturizer works so well for me especially while using several actives. In fact, I believe it makes me tolerate Tretinoin better, calming my skin after harsh actives. Will repurchase again and again!\n"}, {"rating": 2, "date": "2026-02-23", "season": "other", "html": "Caused <strong>breakouts</strong>. Saw this promoted by many online derms and was excited to try. They said it was non-comedogenic but unfortunately made my skin breakout. I am 40+ with hormonal breakouts, so I was looking for strong moisturizer for aging skin.\n"}, {"rating": 3, "date": "2026-02-20", "season": "other", "html": "Not for semi-sensitive skin. Liked it at first - absorbed quickly, felt nice, moisturized decently. But after a few days I began to break out. As soon as I stopped using this my breakouts cleared. I tried it again just to be sure, and <strong>broke out</strong> again.\n"}, {"rating": 1, "date": "2026-02-06", "season": "other", "html": "Horrible for <strong>acne</strong> prone skin. I wanted to love this sooo bad but it ruined my skin. I have oily, acne prone skin and have always enjoyed korean skincare but this destroyed my face. I now have tiny comedones all over which i never had before using this product. My skin has never broken out this bad.\n"}, {"rating": 2, "date": "2025-11-26", "season": "other", "html": "Holy <strong>breakouts</strong>!. I&#x27;ve been on the hunt for a new moisturizer and saw this recommended by a beauty influencer. While it definitely moisturized, it also definitely broke me out. I read another review that mentioned it smells like plastic, and I can confirm that&#x27;s true as well. Ultimately I will end up using this as a hand lotion. If you are not acne prone, I would say it does make my skin soft, but the trade off isn&#x27;t worth it for me.\n"}, {"rating": 1, "date": "2025-11-16", "season": "other", "html": "NOT FOR ROSACEA SKIN. Dont buy. Let me tell you that I have the most sensitive skin out of anyone I know outside of myself. First of all I have type 1 rosacea AND an allergy to strong fragrance and chemicals. Smelling anything thats overpowering will trigger my rosacea along with heat. I had really high hopes for this cream when I bought it during Sephora&#x27;s sale. I used it for one night and I <strong>broke out</strong> in red patchy bumps across my face! I was using LRP repair cream prior to that and never had an issue so I compared their ingredients and found the difference. Some of the acids in the aestura cream traps heat for rosacea skin which leads to flaring. This may work fine on normal sensitive ppl but if you have rosacea, avoid it!\n"}, {"rating": 1, "date": "2025-10-08", "season": "other", "html": "Pass.. Caused BAD <strong>breakouts</strong>. CCs and deep/painful blemishes. If you are sensitive, skip this one.\n"}, {"rating": 1, "date": "2025-09-22", "season": "other", "html": "<strong>Break Out</strong>s. This broke me out - I tried it twice and both times it took at least a week to get rid of all the tiny bumps\n"}, {"rating": 1, "date": "2025-09-10", "season": "other", "html": "huge <strong>breakout</strong>. i have very very dry skin but for some reason the next day after using this an entire colony of pimples made its way onto my forehead…\n"}, {"rating": 2, "date": "2025-08-18", "season": "summer", "html": "Not Recommended for <strong>Acne</strong>-Prone Skin. Very rich and hydrating, but it broke me out within days of use! :( My acne has been gradually clearing up since I stopped applying it.\n"}, {"rating": 2, "date": "2025-08-02", "season": "summer", "html": "Sticky and Never Dries Down. I am not sure if it&#x27;s because I used this with other products but this never quite dries down. I despise when my skin sticks to my pillow case at night and this did that to me. I have dry, sensitive, <strong>acne</strong> prone skin. I live in a dry climate and no matter how small amount I used it never sank in and dried down for me. I do have to say it is a very nice experience when applying the cream. It is very smooth and feels nice while rubbing it in so is pretty cosmetically elegant in that sense.\n"}, {"rating": 4, "date": "2025-07-06", "season": "summer", "html": "Great moisturizer, but not for everyday use. This cream is very rich and provides intense hydration — perfect for dry or flaky areas. It leaves the skin feeling soft and soothed, especially when it&#x27;s feeling tight or irritated. However, it contains several comedogenic ingredients, so I wouldn&#x27;t recommend using it daily or all over the face, especially if you&#x27;re <strong>acne</strong>-prone or if your skin barrier is compromised. I&#x27;d suggest using it only on specific dry areas when needed. It works really well that way without overwhelming the skin.\n"}, {"rating": 1, "date": "2025-06-09", "season": "other", "html": "<strong>Breakouts</strong>!. Not acne prone and this made my skin breakout. So bummed.\n"}, {"rating": 1, "date": "2025-04-23", "season": "other", "html": "Beware if you have oily <strong>acne</strong> prone skin. But moisturizes well.. Broke me out, beware if you have oily skin\n"}, {"rating": 1, "date": "2025-03-18", "season": "other", "html": "Gave me cystic <strong>acne</strong>!. I wanted to love this but it gave me cystic acne in 3 different places after two days of use! I do have very sensitive skin but wow I haven&#x27;t had a reaction like that to a product in a very long time. Super disappointed! Looked it up and it does have several pore clogging ingredients. Everyone&#x27;s skin is different but just beware.\n"}, {"rating": 1, "date": "2025-02-19", "season": "other", "html": "<strong>Break out</strong> :(. First day of use made me break out :( shame because it was very moisturizing\n"}, {"rating": 2, "date": "2025-02-13", "season": "other", "html": "Skin texture and <strong>breaking out</strong>. I was super excited to use this and thought it would be the perfect moisturizer for my needs. This product didn&#x27;t burn my skin at all which is rare for me. My skin is really sensitive so anything besides vanicream causes burning, redness, and peeling. I really enjoyed the feel of this but it is now day 2 and I&#x27;m breaking out everywhere and my skin is textured all around. The cream itself smells heavily of plastic so I&#x27;m not sure I trust the ingredients. Disappointed :(\n"}, {"rating": 1, "date": "2025-02-08", "season": "other", "html": "Not for oily face... Im asian and i got very oily face which was controlled with other korean face products that i used however, when i started this moisturizer, got some <strong>acne</strong> popping every now and then, its lightweight though but too much for my oily skin.\n"}, {"rating": 1, "date": "2025-01-21", "season": "winter", "html": "the reformulation broke me out. the reformulation broke me out and gave me cystic <strong>acne</strong>, which i never had before\n"}, {"rating": 2, "date": "2025-01-05", "season": "winter", "html": "I don&#x27;t get the hype. I got &#x27;influenced&#x27; and bought this in hopes to restore my skin&#x27;s barrier after a major <strong>acne</strong> break-out, but it only made it come back and get inflamed again. Average quality, doesn&#x27;t moisturize as promised either.\n"}, {"rating": 2, "date": "2024-12-05", "season": "winter", "html": "Non adatto a pelli miste. Ha una texture piuttosto densa. Idrata la pelle alla prima applicazione lasciandola luminosa ma dopo l&#x27;utilizzo mattina e sera per più giorni ha reso la mia pelle grassa e oleosa, creando l&#x27;ambiente ideale per la proliferazione di punti neri e <strong>acne</strong>. Non la consiglierei a chi ha una pelle a tendenza mista.\n"}, {"rating": 2, "date": "2024-11-23", "season": "other", "html": "Hydrating but gave me <strong>clogged pores</strong>. It&#x27;s a good thick moisturiser and leaves your skin soft and hydrated however in my opinion it felt a little greasy. It also gave me closed comedones (little clogged pores) allover my face, making my skin texture bumpy when it was clear before. I&#x27;m very disappointed and won&#x27;t be using this product again.\n"}, {"rating": 1, "date": "2024-08-28", "season": "summer", "html": "Breaks me out. Wanted to love this and feels nice but instantly <strong>broke out</strong>. Worse my skin has been in a long time. Not usually very sensitive to moisturizer formula changes but this one made my skin reactive. Beware!\n"}, {"rating": 2, "date": "2024-07-15", "season": "summer", "html": "Reformulation is Awful - Ruined This Product. The original version of this product was the best moisturizer I&#x27;ve ever used - lightweight, easy to spread, and great for <strong>acne</strong>-prone skin, but still deeply moisturizing (enough to be used with prescription retinoids). This 2024 reformulation feels thick, tacky, and hard to spread. Worst of all, it&#x27;s now so occlusive that it leaves a greasy-feeling film that sits atop your skin, which clogs my pores and causes acne. The addition of niacinimide causes the skin on my neck to get red, itchy, and irritated too. I&#x27;m so frustrated that they basically had a perfect product with the prior formulation and completely ruined it. Save your money and look elsewhere - Illiyoon is a fraction of the price and basically the same experience, minus the irritated skin.\n"}, {"rating": 3, "date": "2024-06-25", "season": "other", "html": "I like it, but can&#x27;t use it with my combo/blemish prone skin. Recently noticed that I need a heavier lotion at night with my aging skin now at 34. I wake up on the drier side and have been seeing creases so I decided to give this a try. I love how it makes my skin feel, as it feels moisturized, but with my combination skin+blemish prone it made my skin get small bumps as soon as I put it on for two consecutive days. I immediately stopped using it. After a week I decided to give it another try, but this time around it then gave a bad <strong>break out</strong> in my lower cheek area. It wasn&#x27;t just a pimple or two but it created small bumps that then turn into small acne like patches, which I never get. I then started using it for my legs, but even on my legs I notice that it creates bumps, which I think means it just clogs my pores. So, now just using it for feet to not waste it.\n"}, {"rating": 4, "date": "2024-06-18", "season": "other", "html": "Too heavy for my face, but great as a cream for the body. I have combo sensitive skin. I got this to help repair my skin barrier since I over exfoliated and had skin peeling off, but it wouldn&#x27;t absorb into my skin. I tried rubbing it in more and using by itself, but it would just sit on my skin. I slept with it on overnight to see if maybe it just needs a long time to absorb, but when I woke up it was still sitting on top and ended up giving me <strong>acne</strong>. I eventually gave up, but used it on my neck and ashy parts of my body and it made it feel super soft and moisturized.\n"}, {"rating": 2, "date": "2024-04-13", "season": "other", "html": "Changed Formula. Used to be my ultimate favorite and this is probably about my 15th purchase of this product. However, my skin has been <strong>breaking out</strong> bizarrely (when my skin has been clear for the past two years) and I questioned what it could be (since my routine has been the same since then). Realized that they changed the formula and my skin is reacting horribly. (I also noticed a different smell to it.) Looks like I&#x27;ll have to find another main moisturizer from here on out :/\n"}, {"rating": 1, "date": "2024-04-08", "season": "other", "html": "Pore clogging. SO at first it worked really well but like a week into using it I started <strong>breaking out</strong> in little pimples all over my T zone (so it was clogging my pores). like there were so many small pimples it looked like cystic acne. once i stopped using it my skin started to clear up but it&#x27;s not fully gone\n"}, {"rating": 3, "date": "2024-01-28", "season": "winter", "html": "2nd purchase. Ok for a dry, <strong>acne</strong> prone sensitive skin. I like the short ingredients list, but for the price it&#x27;s not really an elegant cream. The scent reminds me of a sterilized doctor&#x27;s office. Texture remains grainy unless warmed throughly with your fingers, which requires you to carefully rub it in. The container makes it hard to finish it up entirely. My final criticism is that the price keeps going up. It used to be sold for under $20 just two years ago.\n"}, {"rating": 3, "date": "2023-12-11", "season": "winter", "html": "Doesn&#x27;t work for my acne prone skin. I was hoping this would work as a winter cream for me because of the hype. After testing it a few times, my skin would <strong>break out</strong> in small bumps and whiteheads, and they would go away when I stopped. I think it&#x27;s the fatty alcohol that&#x27;s breaking me out. If fatty alcohols, fatty acids, and squalane don&#x27;t break you out, then this would be a great cream. It has a good amount of ceramides and the beads dissolve when you apply it to the skin.\n"}, {"rating": 3, "date": "2023-12-06", "season": "winter", "html": "Not for everyone (not all k beauty is good). I started <strong>breaking out</strong> a week into applying. Caused me to have tiny blisters all over my face. It also caused me to get acne on my neck for the first time in my life. I&#x27;m sure it works for some of you but it&#x27;s definitely not for all skin types. Be very careful guys. I personally don&#x27;t recommend it.\n"}, {"rating": 2, "date": "2023-09-24", "season": "other", "html": "sticky, somewhat drying and broke me out. So I have combination skin, oily t zone, dry chin and sometimes dryness on my cheeks. I was reading reviews saying this moisturizer was good for combination but turns out it didn&#x27;t work for me. Instead of hydrating, I felt like it dried up areas of my face even more and made me <strong>break out</strong>. Another thing, it feels very sticky yet for some reason it didn&#x27;t hydrate my skin enough. It did work well for my oily t zone though. However i started breaking out more and more as I used it each day. Since it didn&#x27;t work on my face I simply started using it on my arms and body because this moisturizer is very pricey and i wouldn&#x27;t want for it to be a waste of money.\n"}, {"rating": 2, "date": "2023-09-18", "season": "other", "html": "Mediocre Moisturizer. Seems it seems like it moisturizes at first but doesn&#x27;t seem sustainable. I also am <strong>breaking out</strong> everywhere with small little pimples. I&#x27;m glad some people thought it was amazing but it was not for me. Going back to farmacy moisturizer\n"}, {"rating": 1, "date": "2023-04-10", "season": "other", "html": "Hmmmm not so happy. Okay so I am a HUGE fan of Korean skin care and everyone on social media was saying how this is a good moisturizer. So I bought It and I have dry <strong>acne</strong> prone skin, the first week my skin was very moisturized but I feel like it over moisturized my face because week 2 I got small bumps on my cheek and forehead so I decided to stop using it on my forehead and surprisingly it cleared up but my cheeks continued to have small bumps so now I no longer use it and I don&#x27;t have that much texture anymore.\n"}, {"rating": 3, "date": "2023-04-08", "season": "other", "html": "just okay. i wanted to like this moisturizer so bad but it just didnt work out for me. it has this weird plasticy smell that takes some getting used to. its good at keeping the skin balanced and non irritating especially with my sensitized tretinon skin. however after a about a month of usage i came to the conclusion that it was indeed breaking me out. so sad :( after i switched back to my old moisturizer the frequent <strong>breakouts</strong> stopped. oh well!\n"}, {"rating": 4, "date": "2022-10-05", "season": "other", "html": "Rich hydrating cream for dry skin. I have combo skin. Most super dry everywhere except around the nose and chin. My skin is also sensitive and reactive. I had no reactions or irritation while testing this product over the last two weeks. I use it every other night after washing my face before bed. I dont like to wash my face in the mornings because I find it gets irritated if I disturb it too much, so if I use a thick moisturizer nightly it would actually be too much for my skin and I&#x27;d end up with <strong>acne</strong>. This product is thick and creamy, and a little goes a long way. Like a typical barrier cream, it takes a bit to fully absorb, so while it sits on the skin you can feel a bit of tackiness. I have liked other Aestura products, but this is not my favorite barrier cream, I have actually used others that I found to be more light weight. If you are chronically dry this is a great non irritating option.\n"}, {"rating": 5, "date": "2026-08-25", "season": "summer", "html": "Amazing for <strong>acne</strong>-prone skin!!! 10/10. Cannot recommend this product enough!!! It truly is amazing, your skin will feel so smooth! It&#x27;s not greasy at all and leaves your skin with such a nice glass look. I&#x27;ve been using it for about 2 months and have not broken out once and I have very acne prone skin, I use it every single night and wake up and my skin still feels hydrated. Totally recommend 10/10!\n"}, {"rating": 5, "date": "2026-08-20", "season": "summer", "html": "Acne Safe !. ACNE SAFE BARRIER CREAM this is the holy grail product. as an esthetician with cystic acne i have tried just about everything to treat my sensitive acne prone skin. i wanted to find a barrier cream and after lots of research decided to try this one. i&#x27;m finishing my second bottle and it is one of the best products I have ever tried. My skin reacts strongly to most things i try and has never had a bad reaction to this. I&#x27;m able to use it twice a day and haven&#x27;t had a single <strong>breakout</strong>. My skin looks healthier, more moisturized, plumper, and just phenomenal.\n"}, {"rating": 5, "date": "2026-08-19", "season": "summer", "html": "Great!. This is my go to moisturizer if I&#x27;m feeling really dry and I wanna feel moisturize by the morning. I will put this on before bed. And I&#x27;ve tried a lot of Korean skin care and I definitely can tell difference with this one also <strong>acne</strong> prone and have sensitive skin and it hasn&#x27;t affected me.\n"}, {"rating": 2, "date": "2026-08-10", "season": "summer", "html": "Broke me out the next morning. Unfortunately this cream broke me out. I&#x27;m combination <strong>acne</strong> prone but my skin is now on the dry side because i use tretinoin so i thought i would be able to use it but it was a money wasted 😭\n"}, {"rating": 5, "date": "2026-07-26", "season": "summer", "html": "BEST FOR DRY SKIN IN NEED OF BARRIER REPAIR. I have extremely dry skin &amp; have lots of blemishes (hormonal acne). My <strong>breakouts</strong> are always red &amp; I hate to say it, but I pick at it when I get anxious which is often. No moisturizers have ever worked no matter how good the reviews were, most of them burned &amp; made it worse, I&#x27;ve spent years &amp; thousands of dollars on skincare &amp; dermatology appointments with no hope. I finally caved &amp; decided to ask Google AI what it recommends for my skin type &amp; it brought me to this. I was skeptical because of all of the previous disappointments, but thought what the heck, what&#x27;s one more? I gave it a try &amp; WOW thank God I did! It&#x27;s been THE absolute best product I&#x27;ve ever bought! I hope they keep this forever, it&#x27;s the only thing that works for me. It is a bit on the thicker side, but if your skin is like mine, it feels amazing. Did a wonderful job with barrier repair, it has helped me not pick at it so much too.\n"}, {"rating": 5, "date": "2026-07-15", "season": "summer", "html": "Holy Grail absolute must have. My absolute favorite moisturizer that I have ever tried. I have <strong>acne</strong> prone combination skin which can either be super flakey and dry or oily depending on the season. Either way this moisturizer is perfect! I have super sensitive skin and had a very damaged skin barrier but this cream really did wonders and has never broken me out. It feels hydrating and soothing while still being light weight.\n"}, {"rating": 3, "date": "2026-07-12", "season": "summer", "html": "Great for non oily skin types. Felt good on the skin, but unfortunately it <strong>broke out</strong> my oily/combo skin.\n"}, {"rating": 5, "date": "2026-07-09", "season": "summer", "html": "HOLY GRAIL MOISTURIZER. I have dry/dehydrated combination skin and this moisturizer has just been absolutely amazing! I wear it morning and night and it absolutely makes my skin look so much better and healthier. It takes away that tight feeling. It sinks into skin and does not give a greasy look. Fragrance-free and great for <strong>acne</strong> prone skin! Will forever purchase!\n"}, {"rating": 5, "date": "2026-07-07", "season": "summer", "html": "Sensitive, hormonal skin has met its match- holy grail product!. This is hands down, the best moisturizer I&#x27;ve ever tried. From $2-200, this is just a superior product. With hormonal, aging skin, it is hard to keep moisture and my skin rarely feels supple. Add to that hormonal <strong>breakouts</strong>, perioral dermatitis…it&#x27;s all I could to not cry. This has calmed my skin, consistently leaves it feeling hydrated, not greasy, does not cause flare ups nor does it make them worse….I&#x27;m just so very thankful to have found this product. It&#x27;s my holy grail and I will NEVER be without it. I use this on my 10 year olds sensitive skin with no issue- just an all around, no bells and whistles, fantastic product!!!! A little goes a very long way, as well.\n"}], "adverse_reaction": [{"rating": 1, "date": "2026-06-07", "season": "other", "html": "DO NOT BUY. This product is definitely <strong>not for sensitive skin</strong>. I&#x27;m not even sure it&#x27;s safe to use on your face. My face continues to break out in red raised bumps and is extremely irritated. I thought that it was just the initial use but it keeps getting worse. The product is greasy and very heavy. It is not intended for sensitive skin by any means.\n"}, {"rating": 1, "date": "2026-05-28", "season": "other", "html": "Too Heavy for Anne prone Skin ..not for inflammed reaktive Barrier. Made my damaged Barrier Skin super red and <strong>swollen</strong> and broke me out\n"}, {"rating": 1, "date": "2026-03-23", "season": "other", "html": "Makes eyes water. Made my eyes water and had some sort of <strong>allergic reaction</strong>\n"}, {"rating": 1, "date": "2025-07-21", "season": "summer", "html": "<strong>Allergic reaction</strong>. Loved the feel and the moisture, but the smell was very industrial and I woke with an angry, red, itchy, swollen face. This is NOT for all the sensitive skin girlies.\n"}, {"rating": 1, "date": "2025-05-06", "season": "other", "html": "IT RUINED MY SKIN. &quot;I stocked up on this after seeing all the hype on TikTok—and the first tube was amazing. But when I opened the second one, I realized they had reformulated it. It <strong>gave me rash</strong>es and dried out my skin completely! I&#x27;m furious I can&#x27;t return it because I&#x27;m past the window. Why ruin a perfectly good formula? Total disappointment. Save your money and stay away—this new version is NOT worth it.\n"}, {"rating": 1, "date": "2025-02-25", "season": "other", "html": "피부 barrier 제품 리뷰. I have sensitive skin, this was supposed to repair my skin barrier (it is super pushed and advertised by influencers) although is actually moustraizing, it <strong>made my skin super red</strong> and inflamed , so it made my skin more inflamed that it was in the beginning. Not recommended\n"}, {"rating": 1, "date": "2024-10-18", "season": "other", "html": "I got a lot of rashes. I am not very sensitive about the cosmetics but I just used the lotion and cream once at night and when I wake up, I <strong>got rashes</strong> all over my face. I need to see a doctor. Very disappointed.\n"}, {"rating": 3, "date": "2024-06-05", "season": "other", "html": "<strong>Gave me a rash</strong>. Purchased this as I heard it&#x27;s a good product for sensitive skin. Unfortunately it made my skin red and bumpy. Had to return\n"}, {"rating": 4, "date": "2025-12-06", "season": "winter", "html": "My skin refuses this cream. The cream is very good, very moisturizing and light. Since I started using it two days ago, I&#x27;ve <strong>developed a rash</strong> on my face. It&#x27;s the only new cream I&#x27;ve started using, so I&#x27;ll stop using it because, although it&#x27;s good, it irritates my skin.\n"}], "insufficient_moisture": [{"rating": 3, "date": "2026-03-02", "season": "other", "html": "<strong>Not that hydrating</strong> or luxurious. I don&#x27;t know if I received a genuine product from the seller, but the product that I got didn&#x27;t feel that good on my skin, both on my face and on the back of my hand (I have dry skin and I&#x27;m really sensitive about the way products glide onto my skin and the way products feel.) It didn&#x27;t feel luxurious. It felt semi-matte. It also didn&#x27;t feel that hydrating either and there isn&#x27;t that much product for the money you pay for it. I got this product because so many people including Korean dermatologists on YouTube were raving about it (Yes, I&#x27;m Korean American), but I think I&#x27;ve experienced products way better than this before. Especially for the price they&#x27;re selling it for, I don&#x27;t think it&#x27;s worth it. I hate to say it, but I&#x27;d rather slather on some Kiehl&#x27;s for that price.\n"}, {"rating": 1, "date": "2025-07-07", "season": "summer", "html": "Overhyped. I bought this because it was hyped up on skincare channels. I was looking for something to replace my holy grail moisturizer because of the price. I love the belief true cream moisturizing bomb but it is expensive. This did not meet my expectations. Definitely overhyped. Firstly, the smell was really weird. It only bothered me when putting it on and did not smell once soaked into the skin. Secondly, it is a really greasy cream. It feels greasy when applying on the skin. Lastly, it does not last at all. Using it overnight, I woke up with dry skin. Using it during the day, it must be reapplied. It <strong>does not hydrate</strong> the skin well enough. This was a waste of money for me.\n"}, {"rating": 1, "date": "2025-01-11", "season": "winter", "html": "건조 피부용 미용제품 평가. What a disappointment. I have dry skin and this was so insufficient even in the autumn. I mixed with face oil and was still <strong>not hydrating</strong> or moisturising.\n"}, {"rating": 2, "date": "2025-01-05", "season": "winter", "html": "I don&#x27;t get the hype. I got &#x27;influenced&#x27; and bought this in hopes to restore my skin&#x27;s barrier after a major acne break-out, but it only made it come back and get inflamed again. Average quality, <strong>doesn&#x27;t moisturize</strong> as promised either.\n"}, {"rating": 1, "date": "2024-03-31", "season": "other", "html": "Went from best ever to worst. The original formulation of this product was divine. It was an unbelievably outstanding product. The new version is laughably bad. Can&#x27;t believe how stupid this company is to destroy such a top tier product. The new version is so greasy I looked like I rubbed butter all over my face. It <strong>doesn&#x27;t moisturize</strong>, form a protective barrier anymore, and stung my skin. Hope everyone hates it and stops buying it so they&#x27;ll bring back the OG formulation that was so many people&#x27;s HG.\n"}], "reformulation_complaint": [{"rating": 2, "date": "2026-05-16", "season": "other", "html": "New formula = Worse formula. This moisturiser used to be significantly better until it got <strong>reformulat</strong>ed. Although the original texture felt thicker, this one feels more occlusive and comedogenic while feeling greasier. The skin absorption is not as fast as with the original formula. Sadly, I won&#x27;t be repurchasing.\n"}, {"rating": 4, "date": "2025-10-13", "season": "other", "html": "Possible <strong>reformulat</strong>ion. I&#x27;ve bought this before snd it worked great at moisturizing my skin but I think they reformulated this and now it moisturizes but leaves my skin a little oily, not like before.\n"}, {"rating": 1, "date": "2025-08-27", "season": "summer", "html": "<strong>New formula</strong>? Thinner, irritates skin, burns. I have purchased several bottles of this, all of which were excellent. It appears that they may have either changed their formula or sent a bad bottle to me. This new bottle irritates my skin and causes a burning sensation.\n"}, {"rating": 1, "date": "2025-08-20", "season": "summer", "html": "Changed formula. This moisturizer is <strong>NOT the same</strong> as it was a couple of months ago. I ordered the same product from the same seller and it&#x27;s completely different. It changed from a moisturizing lovely white lotion to a more opaque cream that is far inferior. Super disappointed ! Even the bottle is subtly different\n"}, {"rating": 1, "date": "2025-08-06", "season": "summer", "html": "변경된 제품에 대한 불만과 피부 반응. I&#x27;m so sad but it seems they&#x27;ve completely <strong>reformulat</strong>ed this. It used to be sooo rich and silky and completely fragrance free, but now it&#x27;s thin and wet with no visible ceramides, and seems to have a slight scent. My skin immediately reacted badly — the product actually burnt which it never ever has in the past. It&#x27;s tragic to lose such a holy grail product.\n"}, {"rating": 1, "date": "2025-05-16", "season": "other", "html": "[Long time user] New batch started to burn my eyes. I&#x27;ve been a loyal user of this cream for many years. This is my second tube of the new formula. I&#x27;m now half way through the bottle and noticed that my eyes have started burning when using it (It was not applied on the eye). I will have to discontinue use immediately as it is impacting my eyesight. If Aestura is reading, tube batch is K56395. EXP 20270303. My experience matches up similar to another reviewer who posted: &quot;Update: I loved this, until I didn&#x27;t. My eyes had the weirdest reaction to this product. Like a burning, film over my eyes type thing. It was very uncomfortable. I&#x27;m sad as I heard many great reviews but I guess they <strong>reformulat</strong>ed and not many are happy about it. Either way, I had to give it up.&quot;\n"}, {"rating": 1, "date": "2025-05-06", "season": "other", "html": "IT RUINED MY SKIN. &quot;I stocked up on this after seeing all the hype on TikTok—and the first tube was amazing. But when I opened the second one, I realized they had <strong>reformulat</strong>ed it. It gave me rashes and dried out my skin completely! I&#x27;m furious I can&#x27;t return it because I&#x27;m past the window. Why ruin a perfectly good formula? Total disappointment. Save your money and stay away—this new version is NOT worth it.\n"}, {"rating": 4, "date": "2025-04-11", "season": "other", "html": "수분크림 후기 요약. So originally my review was pretty meh towards the moisturiser.But after awhile I guess my skin adapted to it and it&#x27;s actually pretty decent.Definitely keeps my skin always feeling moisturised/slick for the day.I mainly put it on at night before bed so my skin doesn&#x27;t feel dry and yeah it does the job nicely.I do wish I could of experienced it when it wasn&#x27;t <strong>reformulat</strong>ed so I could have seen if I noticed the difference for better or worse, but the reformulated version feels fine.\n"}, {"rating": 4, "date": "2025-03-02", "season": "other", "html": "New formula. I have been using this cream for about a year now and it used to be my Holy Grail. Unfortunately since the <strong>reformulat</strong>ion it hasn&#x27;t been the same. They&#x27;ve added niacinamide which is a sensitivity of mine and personally I loved the product before. Really great product for long lasting hydration. Just wish they left the formula alone\n"}, {"rating": 1, "date": "2025-02-10", "season": "other", "html": "Ruined by <strong>reformulat</strong>ion. Aestura ruined this formula last year and it&#x27;s doesn&#x27;t absorb into the skin, nor is it sensitive skin friendly. Now it sits atop the skin and leaves a greasy finish. They added niacinamide and swapped out some of their ingredients for cheaper substitutes for the western market. They removed the cyclopentasiloxane and cyclohexasiloxane for PLAIN, CHEAP DIMETHICONE. There are better moisturizers out there. RIP Aestura.\n"}, {"rating": 2, "date": "2025-02-03", "season": "other", "html": "Careful If You&#x27;ve Sensitive Skin. Apparently this has been <strong>reformulat</strong>ed and now contains Niacinamide, which is an irritant for some folks with sensitive skin. I found it on the ingredient list but it&#x27;s not advertised front and center.\n"}, {"rating": 1, "date": "2025-01-21", "season": "winter", "html": "the <strong>reformulat</strong>ion broke me out. the reformulation broke me out and gave me cystic acne, which i never had before\n"}, {"rating": 3, "date": "2025-01-07", "season": "winter", "html": "<strong>Reformulat</strong>ed. AESTURA ATOBARRIER365 used to be my holy grail moisturizer for my sensitive skin with type 2 rosacea. I prefer the previous formulation without the niacinamide, which can be irritating. The new version is more hydrating but less occlusive, so it&#x27;s not as effective in winter. Disappointing. However, those of you with combo to oily, dehydrated skin might enjoy this if the previous version felt too heavy.\n"}, {"rating": 1, "date": "2024-11-18", "season": "other", "html": "Formulation change. I loved the prior formulation, the bottles had an A on it towards the top instead of the full name. This <strong>new formula</strong> doesn&#x27;t soak into my skin as well, and feels greasy. Unfortunately I didn&#x27;t realize this until I was past the return window, I had grabbed one on sale back in October. I&#x27;ll use it on my legs instead.\n"}, {"rating": 1, "date": "2024-10-05", "season": "other", "html": "Not Nearly as Good as the Original Formula. Unfortunately this <strong>new formula</strong> does not hold its own against the original formula. The original formula&#x27;s texture was like no other moisturizer, soothing the inner and outer skin. My skin also felt hydrated all day long. The original formula was by far the best moisturizer I have used. The new formula doesn&#x27;t seem to ever absorb into the skin after applying it. My skin also felt dry mid-day with the new formula. After extensively testing the new formula, I can confidently same it&#x27;s no where as good as the original sadly.\n"}, {"rating": 3, "date": "2024-08-12", "season": "summer", "html": "<strong>Formula Changed</strong>. This new formula is more thin and doesn&#x27;t give me that moisturizing feel anymore..\n"}, {"rating": 2, "date": "2024-07-15", "season": "summer", "html": "<strong>Reformulat</strong>ion is Awful - Ruined This Product. The original version of this product was the best moisturizer I&#x27;ve ever used - lightweight, easy to spread, and great for acne-prone skin, but still deeply moisturizing (enough to be used with prescription retinoids). This 2024 reformulation feels thick, tacky, and hard to spread. Worst of all, it&#x27;s now so occlusive that it leaves a greasy-feeling film that sits atop your skin, which clogs my pores and causes acne. The addition of niacinimide causes the skin on my neck to get red, itchy, and irritated too. I&#x27;m so frustrated that they basically had a perfect product with the prior formulation and completely ruined it. Save your money and look elsewhere - Illiyoon is a fraction of the price and basically the same experience, minus the irritated skin.\n"}, {"rating": 1, "date": "2024-07-12", "season": "summer", "html": "<strong>Reformulat</strong>ion Ruined Everything. The 2024 Renewal reformulation of this product RUINED a Holy Grail, cult favorite Asian Beauty moisturizer. This new formulation has a completely different texture and is not at all moisturizing. The beads no longer melt and you can feel them rubbing into your skin. They felt rough on my face. As I rubbed the product in I was hit with a very unpleasant plastic smell. The old formulation was completely odorless no matter how much I applied. The new tube has this persistent plastic odor when you apply more than the tiniest amount. The product would not absorb into my skin. It sat on top and when I tried to rub it in, it began to pill. Furthermore, I woke up with my skin peeling off and flaking. My skin is so dry it is tight and painful. The OG formula is a 10/10. This reformulation is a 1/10. Save your money. This is NOT the product everyone raves about.\n"}, {"rating": 2, "date": "2024-05-26", "season": "other", "html": "new version is <strong>reformulat</strong>ed.. The first photo is the new reformulated version (DermaOn), if you have the bottle in the second photo, you have the OLD formulation. I use to love this moisturizer. It was the only product that healed my terribly damaged skin barrier. I used it for months, but unfortunately, the new version now has Niacinamide (which is what damaged my skin barrier in the first place). If you are sensitive to Niacinamide, try the Illyoon Ceramide Cream! Very similar and cheaper too.\n"}, {"rating": 1, "date": "2024-04-30", "season": "other", "html": "Disappointed by the 2024 <strong>reformulat</strong>ion. This was my absolute holy grail moisturizer until the 2024 reformation. I have rosacea and extremely sensitive skin. The addition of Niacinamide means I can no longer use this product :(\n"}, {"rating": 2, "date": "2024-04-17", "season": "other", "html": "So disappointed this has been <strong>reformulat</strong>ed🤦🏻♀️. Why do brands do this? If it isn&#x27;t broken don&#x27;t fix it! I loved this cream, but learning about the reformulation and difference in ingredients I will no longer be repurchasing this. The reason why I got Aestura was because I wanted a cream WITHOUT niacinamide for calmer days. And now the new reformulated version has niacinamide😩 WHYYYY change formulas if it was working?! This cream was my holy grail and the old version&#x27;s formula was amazing. It was the one of the best creams I&#x27;ve used without niacinamide and that would have been perfect for those who don&#x27;t people who don&#x27;t want to use niacinamide in every skin care step. Pleaseee!! Bring back the old formula or i&#x27;ll have no choice but to get Illiyoon instead. Btw these two are about the same, Illiyoon has the same formulation as the Aestura&#x27;s before it&#x27;s reformulation. Aestura, you messed this up big time and I hope you guys see this review and actually listen to your customers!\n"}, {"rating": 1, "date": "2024-03-31", "season": "other", "html": "Went from best ever to worst. The original formulation of this product was divine. It was an unbelievably outstanding product. The <strong>new version</strong> is laughably bad. Can&#x27;t believe how stupid this company is to destroy such a top tier product. The new version is so greasy I looked like I rubbed butter all over my face. It doesn&#x27;t moisturize, form a protective barrier anymore, and stung my skin. Hope everyone hates it and stops buying it so they&#x27;ll bring back the OG formulation that was so many people&#x27;s HG.\n"}, {"rating": 2, "date": "2024-03-28", "season": "other", "html": "Went from holy grail to 👎. Was on my 10th restock just to realize they <strong>reformulat</strong>ed my holy grail. Initially it saved my destroyed skin barrier and fixed my redness but since they added niacinamide and dimethicone, my skin now hates it :( please bring old formula.\n"}, {"rating": 3, "date": "2024-03-17", "season": "other", "html": "<strong>NEW FORMULA</strong>!!. Ok so this is a new formula with new packaging. The new formula contains niacin-amide. And 2 of the silicones have been removed and replaced with dimethicone so guess that contributes to the texture difference smh. The old texture was way better. Idk what happend. Bring back the old formula please.\n"}], "no_effect_general": [{"rating": 3, "date": "2026-06-23", "season": "other", "html": "<strong>Not worth the</strong> price.. I don&#x27;t think it was worth the price. Just didn&#x27;t wow me. Over $30, small quantity, just not special\n"}, {"rating": 4, "date": "2026-06-15", "season": "other", "html": "Good, but Greasy!. This is very moisturizing and does have good ingredients, but I&#x27;ve never had a moisturizer that was this greasy. I&#x27;ve been using every night for the last couple of months. I have mature, dry, sensitive skin for reference. No issues with sensitivity or moisture, but my face looks and feels super greasy. I don&#x27;t know how this could ever be used during the day. Even after a couple of hours, it still hasn&#x27;t soaked in. I plan on going back to CeraVe Skin Renewing Night Cream, which is far superior in my opinion. I wanted to love it, just <strong>didn&#x27;t work</strong> out for me. I suppose if you had extremely dehydrated skin, this would work for you.\n"}, {"rating": 1, "date": "2026-05-14", "season": "other", "html": "Made <strong>no difference</strong>. Im 21 with some redness and acne on my face and been using this product along with a cleanser, ampoule, disposable skin towels and a serum for about 3 weeks now literally made no difference at all to my skin looks just as bad as before I was using this product just a waste of money\n"}, {"rating": 3, "date": "2026-04-15", "season": "other", "html": "It&#x27;s basic. It&#x27;s okay. Personally I think it&#x27;s not super moisturizing if you have very dry skin. It&#x27;s honestly just like a basic moisturizer, don&#x27;t fall for the &quot;fancy little beads&quot;, you can buy Illiyoon for much cheaper (which also has the little beads) and it&#x27;s a much better moisturizer (pictured). Honestly, <strong>not worth the</strong> money.\n"}, {"rating": 1, "date": "2026-02-15", "season": "other", "html": "Gross. Broke me out and has a weird plasticy smell. <strong>Waste of money</strong>. $34 for this is a joke.\n"}, {"rating": 1, "date": "2025-10-19", "season": "other", "html": "Broke me out!!!!. I wanted to love this so bad, especially because everyone else raves about it. I do not have acne prone skin at all, I can use pretty much any product on my face, but for some reason this broke me out so bad. My face is covered in tiny pustules from it. This is the only thing that&#x27;s new about my skincare routine so I know it&#x27;s this. It moisturizes great!! I can tell the difference in my skin. However, it&#x27;s <strong>not worth the</strong> breakouts and I will be throwing this away :(\n"}, {"rating": 3, "date": "2025-08-11", "season": "summer", "html": "<strong>No difference</strong>. It didn&#x27;t do much. I was able to finish the entire tube. And didn&#x27;t notice any difference. It did keep my face moistured like anyother moisturizer\n"}, {"rating": 1, "date": "2025-07-07", "season": "summer", "html": "Overhyped. I bought this because it was hyped up on skincare channels. I was looking for something to replace my holy grail moisturizer because of the price. I love the belief true cream moisturizing bomb but it is expensive. This did not meet my expectations. Definitely overhyped. Firstly, the smell was really weird. It only bothered me when putting it on and did not smell once soaked into the skin. Secondly, it is a really greasy cream. It feels greasy when applying on the skin. Lastly, it does not last at all. Using it overnight, I woke up with dry skin. Using it during the day, it must be reapplied. It does not hydrate the skin well enough. This was a <strong>waste of money</strong> for me.\n"}, {"rating": 1, "date": "2025-05-06", "season": "other", "html": "IT RUINED MY SKIN. &quot;I stocked up on this after seeing all the hype on TikTok—and the first tube was amazing. But when I opened the second one, I realized they had reformulated it. It gave me rashes and dried out my skin completely! I&#x27;m furious I can&#x27;t return it because I&#x27;m past the window. Why ruin a perfectly good formula? Total disappointment. Save your money and stay away—this new version is <strong>NOT worth it</strong>.\n"}, {"rating": 3, "date": "2024-10-10", "season": "other", "html": "Meh. Works fine, but <strong>not worth the</strong> price.. It helps the eczema a little bit and keeps it moisturized for maybe 30 minutes tops. But for the amount you pay for a bottle half the size of your hand, cerave probably works just about as well for cheaper as they both share the same top ingredients... I can see myself going through a bottle of this in a week.... I can&#x27;t imagine paying full price for this.\n"}, {"rating": 3, "date": "2024-05-26", "season": "other", "html": "Doesn&#x27;t work for me!. I have combination sensitive skin and this moisturizer just <strong>didn&#x27;t work</strong> for me. Sadly, it made my skin super sticky and never seemed to really absorb into my skin. It does provide pretty great hydration, but for me it didn&#x27;t work. It is also very thick as well, this product would probably work a lot better for someone who has very dry skin.\n"}, {"rating": 2, "date": "2024-04-22", "season": "other", "html": "It&#x27;s okay. I wanted to love this and had high hopes for it but it&#x27;s really not that great. The smell is gross, I think it&#x27;s just unscented but I don&#x27;t love it. It didn&#x27;t do anything for my skin. It&#x27;s just a really average moisturizer. I will not be buying this again at that price point. <strong>Not worth the</strong> money.\n"}, {"rating": 3, "date": "2024-04-17", "season": "other", "html": "<strong>Not worth the</strong> $. I succumbed to tiktok . This cream is nothing different than anything else\n"}, {"rating": 4, "date": "2024-01-17", "season": "winter", "html": "Moisturizing but <strong>not worth the</strong> hype. The moisturizer was moisturizing but smelled like curel lotion. I wish makeup sat on this moisturizer a little better too. This was one of the few moisturizers where it was hard to have makeup sit on it well.\n"}, {"rating": 2, "date": "2024-01-06", "season": "winter", "html": "Of impressed. <strong>Not impressed</strong>\n"}, {"rating": 2, "date": "2023-10-21", "season": "other", "html": "Meh. First of this doesn&#x27;t feel like the real product, or they have really changed the formula. Second this is <strong>not worth the</strong> price, it feels like a drug store type cream.\n"}, {"rating": 2, "date": "2023-10-01", "season": "other", "html": "<strong>Didn&#x27;t work</strong> for me. I bought this in the hopes that it would help repair my skin barrier but I tried it for 2 days and as soon as I put it on my face it began to get really itchy and burned and was just very uncomfortable. I also noticed that my other skin care was pilling off so it just wasn&#x27;t compatible with my other products. I love the way it made my face glow, but other than that it wasn&#x27;t great. I will be returning.\n"}, {"rating": 2, "date": "2023-09-24", "season": "other", "html": "sticky, somewhat drying and broke me out. So I have combination skin, oily t zone, dry chin and sometimes dryness on my cheeks. I was reading reviews saying this moisturizer was good for combination but turns out it <strong>didn&#x27;t work</strong> for me. Instead of hydrating, I felt like it dried up areas of my face even more and made me break out. Another thing, it feels very sticky yet for some reason it didn&#x27;t hydrate my skin enough. It did work well for my oily t zone though. However i started breaking out more and more as I used it each day. Since it didn&#x27;t work on my face I simply started using it on my arms and body because this moisturizer is very pricey and i wouldn&#x27;t want for it to be a waste of money.\n"}, {"rating": 3, "date": "2023-06-30", "season": "other", "html": "Alright. I see <strong>no difference</strong>s but it feels nice after applying.\n"}, {"rating": 3, "date": "2023-04-08", "season": "other", "html": "just okay. i wanted to like this moisturizer so bad but it just didnt work out for me. it has this weird plasticy smell that takes some getting used to. its good at keeping the skin balanced and non irritating especially with my sensitized tretinon skin. however after a about a month of usage i came to the conclusion that it was indeed breaking me out. so sad :( after i switched back to my old moisturizer the frequent breakouts stopped. oh well!\n"}, {"rating": 3, "date": "2023-03-30", "season": "other", "html": "<strong>Not worth the</strong> cash. I have dry, acne-prone skin. I don&#x27;t find this moisturizer to be very moisturizing. I even added two layers and nothing. I think this may be a better moisturizer for normal skin. Definitely not worth the cash.\n"}, {"rating": 3, "date": "2026-08-01", "season": "summer", "html": "Sits on the face <strong>not impressed</strong>. Don&#x27;t like it maybe I use too much product but it sits on the face don&#x27;t know if my face sucks in the moisturiser. Greasy face dislike really wanted to love it\n"}], "scent_complaint": [{"rating": 2, "date": "2026-06-17", "season": "other", "html": "<strong>Smells off</strong>. This is the second time I buy this moisturiser, however, this time it smells a bit weird. The smell is not pleasant. I am wondering if it was not stored in the recommended environment and that&#x27;s why it smells of plastic. It still mousiturises my skin, but I&#x27;ll have to change the supplier the next time I order this cream..\n"}, {"rating": 1, "date": "2026-02-15", "season": "other", "html": "Gross. Broke me out and has a weird <strong>plasticy smell</strong>. Waste of money. $34 for this is a joke.\n"}, {"rating": 1, "date": "2025-11-10", "season": "other", "html": "It came open. It came open. No box, no seal on the lid. It was in a plastic bag. There was a <strong>chemical odor</strong> when I opened the plastic bag. I don&#x27;t feel comfortable putting this product on my skin.\n"}, {"rating": 1, "date": "2024-11-30", "season": "other", "html": "Smells bad. I was so excited to try this moisturizer and also gave one to my cousin as a gift. Unfortunately, I was disappointed by the smell of the product. It was very off putting <strong>plastic smell</strong> and decided not to use it after applying it. I don&#x27;t understand why this product has so many great reviews? My other unscented moisturizer that is half the price of this product smelled clean and had a better absorption than this.\n"}, {"rating": 1, "date": "2024-07-12", "season": "summer", "html": "Reformulation Ruined Everything. The 2024 Renewal reformulation of this product RUINED a Holy Grail, cult favorite Asian Beauty moisturizer. This new formulation has a completely different texture and is not at all moisturizing. The beads no longer melt and you can feel them rubbing into your skin. They felt rough on my face. As I rubbed the product in I was hit with a very unpleasant <strong>plastic smell</strong>. The old formulation was completely odorless no matter how much I applied. The new tube has this persistent plastic odor when you apply more than the tiniest amount. The product would not absorb into my skin. It sat on top and when I tried to rub it in, it began to pill. Furthermore, I woke up with my skin peeling off and flaking. My skin is so dry it is tight and painful. The OG formula is a 10/10. This reformulation is a 1/10. Save your money. This is NOT the product everyone raves about.\n"}, {"rating": 3, "date": "2024-06-11", "season": "other", "html": "Great lotion aside from the <strong>plastic smell</strong>. As someone with sensitive skin, I did a lot of research before purchasing this cream. I love the consistency and find that it does help reduce the severity of aftermath from prescription retinol creams. However, I cannot get past the smell. It smells like freshly manufactured plastic. While it&#x27;s not overpowering, I would say the scent has a strength of 3/10, and that&#x27;s too much for me. Coming from someone who can handle and even enjoys the original Biologique Recherche Lotion P50 1970, that is saying a lot. When it really comes down to it, I think the smell makes me question the integrity and quality of the formulation. As a scientist and someone who is obsessed with skincare, I don&#x27;t want to put anything that isn&#x27;t the best on my skin. The ceramides are good though, I will give them that. Love the consistency as well.\n"}, {"rating": 3, "date": "2023-11-23", "season": "other", "html": "Bad smell. I&#x27;ve used the entire tube, and I&#x27;ve got to say, there&#x27;s this noticeable <strong>chemical smell</strong>. At first, I thought it might be because I&#x27;m new to this brand and the tube is fresh, but nope. The weird chemical scent lingered with every use. It&#x27;s a good moisturizer and doesn&#x27;t break out my skin, but I&#x27;m not planning to buy it again.\n"}, {"rating": 1, "date": "2023-09-04", "season": "other", "html": "<strong>Smell bad</strong> like plastic. It seems like before I got it. It was in the sun for super long. It just smells like straight plastic.\n"}, {"rating": 3, "date": "2023-08-05", "season": "summer", "html": "weird <strong>chemical smell</strong>. Very moisturizing and somewhat lightweight. After a few days of using it, there was a chemical smell whenever I used it. There wasn&#x27;t a smell the first 3 days so or using it but after the smell appeared.\n"}, {"rating": 3, "date": "2023-04-08", "season": "other", "html": "just okay. i wanted to like this moisturizer so bad but it just didnt work out for me. it has this weird <strong>plasticy smell</strong> that takes some getting used to. its good at keeping the skin balanced and non irritating especially with my sensitized tretinon skin. however after a about a month of usage i came to the conclusion that it was indeed breaking me out. so sad :( after i switched back to my old moisturizer the frequent breakouts stopped. oh well!\n"}, {"rating": 4, "date": "2023-03-16", "season": "other", "html": "Grey moisturizer but scent is chemically…. Does anyone who owns this seem to notice a <strong>chemical smell</strong> to it? It moisturizes great, it&#x27;s just the smell I can&#x27;t really deal with… or did I get a &quot;bad batch?&quot;\n"}], "price_value_complaint": [{"rating": 3, "date": "2026-06-23", "season": "other", "html": "<strong>Not worth the price</strong>.. I don&#x27;t think it was worth the price. Just didn&#x27;t wow me. Over $30, small quantity, just not special\n"}, {"rating": 3, "date": "2026-04-15", "season": "other", "html": "It&#x27;s basic. It&#x27;s okay. Personally I think it&#x27;s not super moisturizing if you have very dry skin. It&#x27;s honestly just like a basic moisturizer, don&#x27;t fall for the &quot;fancy little beads&quot;, you can buy Illiyoon for much cheaper (which also has the little beads) and it&#x27;s a much better moisturizer (pictured). Honestly, <strong>not worth the money</strong>.\n"}, {"rating": 3, "date": "2026-04-10", "season": "other", "html": "Overpriced. Good quality but <strong>too expensive</strong> for what it does. I don&#x27;t think this should be over $30. It should be $20-25 ish price range in my opinion\n"}, {"rating": 4, "date": "2025-07-17", "season": "summer", "html": "건조 피부용 제품 평가. Love the thickness, awesome for my dry skin. Only thing is the <strong>price is too high</strong> 😕\n"}, {"rating": 1, "date": "2025-01-15", "season": "winter", "html": "Huge <strong>price increase</strong> in just one month!. I just purchased this same item last month for $22. For a moisturizer, I can&#x27;t justify a 45% price increase on a product that is only 2.7 oz and only lasts a month.\n"}, {"rating": 3, "date": "2024-10-10", "season": "other", "html": "Meh. Works fine, but <strong>not worth the price</strong>.. It helps the eczema a little bit and keeps it moisturized for maybe 30 minutes tops. But for the amount you pay for a bottle half the size of your hand, cerave probably works just about as well for cheaper as they both share the same top ingredients... I can see myself going through a bottle of this in a week.... I can&#x27;t imagine paying full price for this.\n"}, {"rating": 3, "date": "2024-07-01", "season": "summer", "html": "Would not recommend for oily skin. I&#x27;m someone with oily skin and I only used this moisturizer at night for a couple weeks and it still left me very greasy. This product dose leave a sticky like consistency on the skin and I think this product is <strong>too expensive</strong> for the amount of product you get if you are just starting your k beauty journey I would suggest finding something different they have better moisturizers for cheaper. I will say I think this product would be better for people with dry skin. However my skin dose feel pretty soft so that is a plus I just think I don&#x27;t have the right skin for this product.\n"}, {"rating": 2, "date": "2024-04-22", "season": "other", "html": "It&#x27;s okay. I wanted to love this and had high hopes for it but it&#x27;s really not that great. The smell is gross, I think it&#x27;s just unscented but I don&#x27;t love it. It didn&#x27;t do anything for my skin. It&#x27;s just a really average moisturizer. I will not be buying this again at that price point. <strong>Not worth the money</strong>.\n"}, {"rating": 2, "date": "2023-10-21", "season": "other", "html": "Meh. First of this doesn&#x27;t feel like the real product, or they have really changed the formula. Second this is <strong>not worth the price</strong>, it feels like a drug store type cream.\n"}, {"rating": 2, "date": "2023-07-14", "season": "summer", "html": "AMAZING! but the Amazon Price Gouging is NOT. UPDATE 7/20/23: I will purchase from Olive Young Global when they run Aestura sales as Amazon just jacked the <strong>price way up</strong> on bundles (like they always seem to do with items that you love and repurchase). There was a 30% savings when purchasing the Aestura bundles of 3-5 products (as of just yesterday) and after writing a positive review today on the Essence, the same bundles are suddenly only 10% savings. SHADY! The bundle I just purchased with the cream, cleanser, Essence, and lotion is $40 more than it was yesterday after posting my review. (I paid $75 and it&#x27;s now $120). I care about my skin but I&#x27;m not a fool, Amazon. I have backups of my favorites.l and will order elsewhere. ORIGINAL REVIEW: I kid you not, I have (foolishly) spent thousands on skincare and moisturizers over the past few years ranging from SkinCeuticals, Drunk Elephant, Tata Harper, AMOREPACIFIC, Avene, LaRoche Posay, CeraVe, etc. This is in my top 3 products of all time. The texture is incredible, it&#x27;s extremely hydrating/moisturizing, my sensitive skin does not react at all, it soothes, and it leaves that dewy plump look on my 47 year-old skin. (I&#x27;ve used Tretinoin for a few years so hydration and moisture are my priorities). It appears thick but it melts and absorbs quickly, leaving just enough to actually feel moisturized. Not heavy nor greasy at all on my normal skin type. This cream is going to be a God send in the NY winters when my skin is dry and sensitive, but I&#x27;m loving during the summer too. The Bubble Cleanser in this line is just as amazing and I&#x27;m looking forward to trying the mist that should be arriving shortly. CeraVe (which burns my skin), Vanicream, Cetaphil, and LaRoche Posay moisturizers in this category have NOTHING on Aestura aside from cost. It is seriously impressive. I think I have finally found a line that just works for my unique skin as I shift towards a less is more mentality and stop wasting my hard earned coins. EDIT: I now own the entire AtoBarrier line and they are all incredible products. The Hydro ESSENCE is one of the most quenching things I&#x27;ve ever put on my skin. I now use the Hydro Essence and Hydro Cream during the day and the 365 Cream at night. (The mist arrived and it&#x27;s just okay; totally effective but it has an oily slip that I don&#x27;t prefer. Will use in winter.) Aestura, Vitamin C (a.m.) Tretinoin (p.m.), and SPF are it from here on out. I can&#x27;t tell you how much better my skin already looks after getting rid of all of the hyaluronic acid and peptide serums, etc. It&#x27;s like Tretinoin can finally do what it&#x27;s supposed to do without competing and my barrier is now functioning healthily enough to support it.\n"}, {"rating": 4, "date": "2022-10-28", "season": "other", "html": "Expensive but great. Is the perfect size to take on a plane because it is under the 100 ml limit. It&#x27;s good to use all around your body as well as your face. It&#x27;s <strong>a bit expensive</strong>. That&#x27;s the only problem with it and that&#x27;s why I deducted one star. But if the price doesn&#x27;t bother you, you should get it.\n"}, {"rating": 3, "date": "2026-07-17", "season": "summer", "html": "good but <strong>too expensive</strong> for what it is. is good but not that good to justify price, just get cerave same thing a quarter of the price\n"}], "packaging_shipping_issue": [{"rating": 1, "date": "2026-05-29", "season": "other", "html": "Love the product but not how it was handled. I&#x27;ve ordered this product for 2 years and loved it enough to subscribe. My latest subscription <strong>arrived opened</strong>, nearly empty, and had a black hair attached. It was extremely unsanitary and upsetting to receive. Amazon replaced it, but requiring a return of a clearly compromised product is concerning. I hope this doesn&#x27;t happen to anyone else. (Pictures are comparing yesterdays order with todays replacement)\n"}, {"rating": 1, "date": "2025-11-10", "season": "other", "html": "It came open. It came open. <strong>No box</strong>, no seal on the lid. It was in a plastic bag. There was a chemical odor when I opened the plastic bag. I don&#x27;t feel comfortable putting this product on my skin.\n"}, {"rating": 1, "date": "2025-06-29", "season": "other", "html": "제품 품질 의심 및 상태 문제. Item did <strong>not seem legit</strong>. Damaged and opened. Looked completely different to the first one I purchased. Item smells of nivea cream.\n"}, {"rating": 1, "date": "2024-12-19", "season": "winter", "html": "Open product. PRODUCT CAME HALF USED AND OPEN <strong>NO SEAL</strong>\n"}, {"rating": 1, "date": "2024-04-08", "season": "other", "html": "Okay product with poor packaging. I bought this as a gift, but unfortunately, it arrived with a <strong>damaged package</strong>. I&#x27;m uncertain whether the damage occurred during shipping or due to some other reason. Consequently, I had to purchase other Korean beauty products instead for my friend&#x27;s birthday. I&#x27;m currently using this product myself. While I would recommend it for dry or sensitive skin, my overall experience was marred by the poor shipping and the quality of the packaging. There&#x27;s definitely room for improvement in their packaging design.\n"}, {"rating": 2, "date": "2023-07-07", "season": "summer", "html": "Great moisturizer but always sends the <strong>wrong item</strong>. I love the atobarrier 365 original cream, so I order from this vendor whenever I run out. For the SECOND time they have sent the wrong item, and I had to re-order and return the wrong item back. I really hope they don&#x27;t send me the wrong thing again as the replacement..\n"}, {"rating": 1, "date": "2026-07-06", "season": "summer", "html": "<strong>Arrived damaged</strong>. .\n"}], "texture_heavy_greasy": [{"rating": 1, "date": "2026-06-28", "season": "other", "html": "<strong>Sticky</strong>, not for me. No, it&#x27;s sticky and doesn&#x27;t feel moisturizing. I tried it, tried to let it absorb for 20 mins and ultimately ended up washing my face because I couldn&#x27;t stand the feeling.\n"}, {"rating": 5, "date": "2026-06-26", "season": "other", "html": "one of the best moisturizers for dry and sensitive skin. This cream has quickly become one of my favorite moisturizers. It feels rich and nourishing but does not sit heavily on the skin. The texture spreads easily and absorbs well while still leaving skin feeling protected and comfortable. The ceramide capsules are a nice feature and help give the cream a more moisturizing feel without being <strong>greasy</strong>. My skin felt softer and more hydrated after using it consistently, and it worked especially well whenever my skin felt dry or stressed. It layers nicely under sunscreen and makeup and does not pill with other skincare products. A little goes a long way, so the tube lasts quite a while. Overall, a great barrier focused moisturizer that delivers long lasting hydration and leaves skin feeling healthy and smooth.\n"}, {"rating": 4, "date": "2026-06-15", "season": "other", "html": "Good, but <strong>Greasy</strong>!. This is very moisturizing and does have good ingredients, but I&#x27;ve never had a moisturizer that was this greasy. I&#x27;ve been using every night for the last couple of months. I have mature, dry, sensitive skin for reference. No issues with sensitivity or moisture, but my face looks and feels super greasy. I don&#x27;t know how this could ever be used during the day. Even after a couple of hours, it still hasn&#x27;t soaked in. I plan on going back to CeraVe Skin Renewing Night Cream, which is far superior in my opinion. I wanted to love it, just didn&#x27;t work out for me. I suppose if you had extremely dehydrated skin, this would work for you.\n"}, {"rating": 5, "date": "2026-06-10", "season": "other", "html": "Hard water issues are no longer a problem.. Fan-freaking-tastic! I get the dewy look without being <strong>sticky</strong>. Sometimes, I travel to places with hard water which leaves my skin raw. This helps with that.\n"}, {"rating": 1, "date": "2026-06-07", "season": "other", "html": "DO NOT BUY. This product is definitely not for sensitive skin. I&#x27;m not even sure it&#x27;s safe to use on your face. My face continues to break out in red raised bumps and is extremely irritated. I thought that it was just the initial use but it keeps getting worse. The product is <strong>greasy</strong> and very heavy. It is not intended for sensitive skin by any means.\n"}, {"rating": 3, "date": "2026-06-07", "season": "other", "html": "I wish it was thicker and bigger. It&#x27;s okay so far however, being thats it&#x27;s a cream and not a lotion, I expected a thicker consistency. It feels thick at first but doesn&#x27;t really spread far and actually has a <strong>watery feel</strong> on the skin. As I have very dry, itchy skin, I hope this helps. Also a bigger option for body use would be better. For now its 3 stars but it does give good hydration.\n"}, {"rating": 1, "date": "2026-05-28", "season": "other", "html": "<strong>Too Heavy</strong> for Anne prone Skin ..not for inflammed reaktive Barrier. Made my damaged Barrier Skin super red and swollen and broke me out\n"}, {"rating": 5, "date": "2026-05-25", "season": "other", "html": "Can&#x27;t get enough from this product, Line. I absolutely adore everything I&#x27;ve tried from Aestura. I have hyperactive rosacea-prone skin, and my skin barrier has been compromised for years. Even the most basic products would irritate me, but this line has been a game-changer. Initially, I was concerned that it would be too <strong>greasy</strong>, but my skin actually absorbs it effortlessly. I&#x27;m already planning to repurchase it\n"}, {"rating": 5, "date": "2026-05-25", "season": "other", "html": "this is amazing… (long time user). I will forever repurchase this cream. It saved my skin barrier and made it easier for me to start using adapalene and minimize reaction/side effects. It is a bit <strong>greasy</strong> on my skin as my skin is in general bad at absorbing products. My friend who purchased this cream after my recommendation doesn&#x27;t seem to have the greasiness problem at all. Because of this, I use it as a rich night cream or whenever I am home all day. I started using this cream a while back, at the end of 2025 if i remember correctly. And I went through at least 3 tubes since. My skin is unrecognizable. It made my skin barrier healthy enough to allow my skin to heal annoying and persistent acne that I had for 5 years now. Nothing ever helped me (I tried all kinds of actives that exist on the market, (including tret and lasers) until I tried this cream and healed my barrier. Then I slowly introduced adapalene. I see about 95% improvement in pimples/ healing/ scarring/ dehydration, etc. I fear if I continue using this problem I will accidentally win miss universe. I also do sometimes put it on my back, elbows, chest, armpits for extra hydration if needed, but I try to save it for my face as much as I can because this product is that special for me. Highly recommend!\n"}, {"rating": 5, "date": "2026-05-18", "season": "other", "html": "Favorite everyday moisturizer!. I have tried just about every daily moisturizer there is out there and had never really found THE one until I came across this particular one. I have extremely sensitive/eczema prone skin and this is now my go to moisturizer. I use it morning and night. It&#x27;s highly moisturizing, yet non-<strong>greasy</strong>. Does not clog my pores or cause irritation. It is unscented. Relatively affordable price for how amazing this product is. I am already on my second tube and will continue to purchase!\n"}, {"rating": 5, "date": "2026-05-15", "season": "other", "html": "Would purchase over and over. Can&#x27;t be without it.. This is my second purchase of this product. I use it day and night as a final moisturizer after my skincare routine. Non <strong>greasy</strong>, lightweight and no skin irritation. I only use a pea sized amount and the product lasts for months. It helps retain the moisture in your skin by creating a clean light barrier.\n"}, {"rating": 4, "date": "2026-05-10", "season": "other", "html": "Good price for amount. Got a sample and loved it, and purchased the full size. I feel like it does a good job of moisturizing without being overly <strong>greasy</strong>.\n"}, {"rating": 4, "date": "2026-04-24", "season": "other", "html": "Never absorbs but is soothing after tret. This stuff feels hydrating and soothing on my face and it&#x27;s very thick. The only downside is it never really seems to fully absorb into my skin but remains as a <strong>greasy</strong> layer on my face until I wash it off. Helps with tret irritation and definitely gets rid of peeling from tret though\n"}, {"rating": 5, "date": "2026-04-09", "season": "other", "html": "Good product 👍. Tried this morning, didn&#x27;t expect it to be so good. Very light weight, non <strong>greasy</strong>. Feel very comfortable on the face, highly recommended\n"}, {"rating": 1, "date": "2026-04-07", "season": "other", "html": "Breakouts. Caused me ridiculous amounts of breakouts in the form of comedones, pimples (didn&#x27;t even know I could still get those). My skin appeared extremely <strong>greasy</strong> and shiny for the period I used it. I highly recommend skipping this - I&#x27;ve now got a lot of work to undo the damage\n"}, {"rating": 4, "date": "2026-04-06", "season": "other", "html": "Moisture with out <strong>greasy</strong> feeling for mature skin. Lovely product Excellent value for money\n"}, {"rating": 3, "date": "2026-04-03", "season": "other", "html": "Okay-ish. It&#x27;s a bit <strong>greasy</strong> on my skin, I have dry skin.\n"}, {"rating": 5, "date": "2026-03-30", "season": "other", "html": "Great moisturizing cream. Very hydrating and gentle on the skin. It feels rich but absorbs well without being <strong>greasy</strong>. Leaves my skin soft and smooth really happy with it!\n"}, {"rating": 5, "date": "2026-03-30", "season": "other", "html": "It&#x27;s non-<strong>greasy</strong>. It&#x27;s good product It is non- greasy…\n"}, {"rating": 4, "date": "2025-10-31", "season": "other", "html": "little heavy. its a very noce mosturizer. Howeer, is a little <strong>greasy</strong>.\n"}, {"rating": 2, "date": "2025-08-02", "season": "summer", "html": "<strong>Sticky</strong> and Never Dries Down. I am not sure if it&#x27;s because I used this with other products but this never quite dries down. I despise when my skin sticks to my pillow case at night and this did that to me. I have dry, sensitive, acne prone skin. I live in a dry climate and no matter how small amount I used it never sank in and dried down for me. I do have to say it is a very nice experience when applying the cream. It is very smooth and feels nice while rubbing it in so is pretty cosmetically elegant in that sense.\n"}, {"rating": 4, "date": "2025-07-24", "season": "summer", "html": "Not everyday moisturizer. I like this moisturizer but cannot be used for everyday. This cream is very rich and perfect for dry skin. But it leaves my skin a shiny finish. I can&#x27;t use it everyday . Sometimes will leave my face <strong>greasy</strong> when waking up in the morning.\n"}, {"rating": 1, "date": "2025-07-07", "season": "summer", "html": "Overhyped. I bought this because it was hyped up on skincare channels. I was looking for something to replace my holy grail moisturizer because of the price. I love the belief true cream moisturizing bomb but it is expensive. This did not meet my expectations. Definitely overhyped. Firstly, the smell was really weird. It only bothered me when putting it on and did not smell once soaked into the skin. Secondly, it is a really <strong>greasy</strong> cream. It feels greasy when applying on the skin. Lastly, it does not last at all. Using it overnight, I woke up with dry skin. Using it during the day, it must be reapplied. It does not hydrate the skin well enough. This was a waste of money for me.\n"}, {"rating": 3, "date": "2025-03-23", "season": "other", "html": "A bit heavy <strong>greasy</strong>. I have normal dry sensitive skin but this cream feels too heavy for me. It is very nourishing so perhaps people with drier skin will enjoy it. Although sometimes if i feel my skin drier i use it only in my nighttime routine. I just purchased the aestura hydro soothing cream and feels better on my skin\n"}, {"rating": 1, "date": "2025-02-10", "season": "other", "html": "Ruined by reformulation. Aestura ruined this formula last year and it&#x27;s doesn&#x27;t absorb into the skin, nor is it sensitive skin friendly. Now it sits atop the skin and leaves a <strong>greasy</strong> finish. They added niacinamide and swapped out some of their ingredients for cheaper substitutes for the western market. They removed the cyclopentasiloxane and cyclohexasiloxane for PLAIN, CHEAP DIMETHICONE. There are better moisturizers out there. RIP Aestura.\n"}, {"rating": 1, "date": "2025-02-01", "season": "other", "html": "피부 자극 및 흡수 문제 관련 불만. Very thick and <strong>greasy</strong> on the skin, doesn&#x27;t absorb and sits on the surface and pills under makeup. Broke me out badly\n"}, {"rating": 3, "date": "2025-01-07", "season": "winter", "html": "Reformulated. AESTURA ATOBARRIER365 used to be my holy grail moisturizer for my sensitive skin with type 2 rosacea. I prefer the previous formulation without the niacinamide, which can be irritating. The new version is more hydrating but less occlusive, so it&#x27;s not as effective in winter. Disappointing. However, those of you with combo to oily, dehydrated skin might enjoy this if the previous version felt <strong>too heavy</strong>.\n"}, {"rating": 4, "date": "2025-01-05", "season": "winter", "html": "Very hydrating. I may be using too much. It can feel <strong>tacky</strong>.\n"}, {"rating": 2, "date": "2024-11-23", "season": "other", "html": "Hydrating but gave me clogged pores. It&#x27;s a good thick moisturiser and leaves your skin soft and hydrated however in my opinion it felt a little <strong>greasy</strong>. It also gave me closed comedones (little clogged pores) allover my face, making my skin texture bumpy when it was clear before. I&#x27;m very disappointed and won&#x27;t be using this product again.\n"}, {"rating": 1, "date": "2024-11-18", "season": "other", "html": "Formulation change. I loved the prior formulation, the bottles had an A on it towards the top instead of the full name. This new formula doesn&#x27;t soak into my skin as well, and feels <strong>greasy</strong>. Unfortunately I didn&#x27;t realize this until I was past the return window, I had grabbed one on sale back in October. I&#x27;ll use it on my legs instead.\n"}, {"rating": 1, "date": "2024-10-26", "season": "other", "html": "So <strong>Greasy</strong>. This moisturizer is so greasy, I barely put any on and my skin feels so greasy and oily. It is not lightweight and literally made me feel like I didn&#x27;t wash my face. Do not get if your skin is combination only get this if you have really dry skin because your face will feel so oily and greasy. To make sure y&#x27;all understand, GREASY!\n"}, {"rating": 4, "date": "2024-07-25", "season": "summer", "html": "Very hydrating. I used this as my night moisturizer for about 2 months. It did not irritate my skin at all and I tend to have pretty sensitive skin. However, I didn&#x27;t really notice a huge difference in the texture of my skin, and it sometimes would leave my face a little <strong>greasy</strong> when waking up in the morning. Overall good experience though, I would recommend it as a night cream to people with dry and sensitive skin looking for something that will not irritate.\n"}, {"rating": 4, "date": "2024-07-22", "season": "summer", "html": "Almost too moist. It made my face feel a little <strong>greasy</strong> and didn&#x27;t feel like it would absorb but it
